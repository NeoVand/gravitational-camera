name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference:
    name: Reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e 'reference[test]'
      - name: Tests
        working-directory: reference
        run: python -m pytest
      - name: Fixtures match the code that generates them
        working-directory: reference
        run: |
          python -m gravcam.export_fixtures
          git diff --exit-code -- fixtures

  site:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install pandoc (converts the paper)
        run: sudo apt-get update && sudo apt-get install -y pandoc
        working-directory: .
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm exec vitest --run
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (includes the GPU self-test)
        run: pnpm exec playwright test

  paper:
    name: Paper PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-publishers lmodern latexmk
      - name: Build the PDF
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      # the Pages build takes this PDF rather than installing LaTeX and compiling it again
      - uses: actions/upload-artifact@v7
        with:
          name: paper-pdf
          path: paper/main.pdf
          retention-days: 1

  build:
    name: Build for GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [reference, site, paper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install pandoc (converts the paper)
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: The PDF built by the Paper job, into the site
        uses: actions/download-artifact@v8
        with:
          name: paper-pdf
          path: paper-pdf
      - run: cp paper-pdf/main.pdf app/static/gravitational-camera.pdf
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        working-directory: app
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/build/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
