fig:sun-at-midnight: "The Sun at midnight, computed. An observer at latitude $40^\\circ$ north looks north and down, $33^\\circ$ below the horizon, at local midnight, with the same camera, $86^\\circ$ from top to bottom, in both panels. (a) Ordinary light, exposed long enough to show the ground; the dotted circle marks where the Sun lies, behind the planet. (b) Thermal gravitational radiation: the expected number radiance $N(\\hat n)$ of [section 5.5](/tutorial/waves/radiance/), on a logarithmic scale. The ground is transparent. Lines of sight just below the horizon cross only the crust and upper mantle and are faint; steeper ones cross the hotter lower mantle, and those within $33^\\circ$ of straight down, at the foot of the picture, the core, as the figure of the Earth's glow shows. The Sun's core, $50^\\circ$ below the horizon, is smaller than a pixel; its flux, under one graviton per square metre per second, is spread over a spot a few pixels across, far brighter than the top of the scale."
fig:tidal: "What a pixel measures: a ring of twelve free test masses, distorted by the tidal field of [section 1.4](/tutorial/newton/tides/), with each arrow the displacement of its mass and the dashed circle the ring undisturbed; the distortions are exaggerated. (a) Beside a mass $M$, the ring is stretched along the line to the mass and squeezed across it, exactly twice as strongly along as across. The size and distance of the mass are schematic. (b), (c) In a gravitational wave travelling toward the reader ($\\odot$), of polarization $h_+$ and $h_\\times$: the ring is stretched and squeezed equally along two perpendicular directions, which change places every half cycle (the pale ring), and the two polarizations differ by a turn of $45^\\circ$. A pixel records the size and orientation of this distortion."
fig:tidal-field: "The tidal field itself. At points of a plane, a small ring of free particles is drawn as the field distorts it (exaggerated, with the strength compressed so that weak regions remain visible), over a map of one component: $\\tE_{zz}$ (up the page) in (a) and (b), $\\tE_{xx}$ (across) in (c). Orange marks a stretch along that axis (the component negative, as in [section 1.4](/tutorial/newton/tides/)), blue a squeeze (positive). (a) One mass: every ring is stretched toward it. (b) Two masses: midway between them the ring is stretched along the line joining them and squeezed across it. (c) A plane wave of polarization $h_+$ travelling up the page: bands of stretch and squeeze across the direction of travel alternate every half wavelength, and nothing happens along it. A pixel records one such ring, in three dimensions."
fig:regimes: "Where sources lie. The diagonal is the edge of the near zone, $r = c/2\\pi f$ ([section 5.2](/tutorial/waves/retarded-waves/)). Everything that moves mechanically, from the tides to a calibration rotor beside a LIGO mirror, sits below it and is seen through its changing Newtonian pull. Only radiation at thermal frequencies, far to the right, reaches a nearby camera as waves short enough to form sharp images; thermal sources are placed at the peak of their spectrum, $f = 2.82\\,k_BT/2\\pi\\hbar$. The Moon is placed by the 12.4-hour rise and fall of its tide at one place, an upper bound, since that rate comes from the Earth's turning; the Moon's field itself changes over 13.7 days."
fig:sky-integral: "The sky integral of [section 2.3](/tutorial/outside/multipoles/). (a) A pixel at the apex of a cone of directions $\\dd\\Omega$ about $\\hat n$. The matter in the cone between $r$ and $r + \\dd r$, a piece of the cone bounded by two spherical caps (orange), has mass $\\dd m = \\rho\\,r^2\\,\\dd r\\,\\dd\\Omega$ and adds $G\\,\\dd m\\,(\\delta_{ij} - 3\\hat n_i\\hat n_j)/r^3$ to the tidal field. The $r^2$ of the volume cancels two of the three powers of $1/r$, so each line of sight contributes its mass weighted by $\\dd r/r$: the tidal column $S(\\hat n)$. The cone's width and $\\dd r$ are exaggerated. (b) The sky around the pixel, coloured by the sign of the weight $1 - 3\\cos^2\\vartheta$ with which one component, $\\tE_{zz}$, takes matter in each direction: matter in the orange caps, within $54.7^\\circ$ of the $z$ axis ($\\cos^2\\vartheta > 1/3$), stretches the pixel along $z$; matter in the blue band squeezes it. The weight averages to zero over the sky, which is why a uniform shell of matter around the camera is invisible to it."
fig:same-outside: "Same outside, different inside: three steel balls whose fields are identical everywhere outside them. (a) A gold nugget halfway from the centre to the wall. (b) Its harmonic projection ([section 2.5](/tutorial/outside/null-space/)), the least assuming interior that a camera outside could draw, shaded in bands that double in density up to $46\\,m/4\\pi R^3$ at the near wall. (c) Its balayage: the nugget's mass spread over the surface as a skin, drawn just inside the surface as a band of constant width shaded in the same way, in steps that double in surface density up to $6\\,m/4\\pi R^2$ over the nugget. Blue: equipotentials of the gold's share of the field, drawn outside each ball (the steel's share, common to the three, is left out). They are the same in all three, and in (b) and (c) they centre on a nugget that is not there."
fig:silent-flows: "Silent flows. Inside a ball, (a) a swirl about its axis (in this meridian plane the flow comes out of the page on one side and goes in on the other) and (b) rolls in meridian planes, drawn as stream lines, with the same smooth profile. Outside, the size of the magnetic part of the field of each, computed by the same integration over the ball and shaded over four decades below the swirl's largest value; nothing is computed in the white margin of (a). The swirl shows; the rolls are silent, to the accuracy of the integration, below $10^{-4}$ of the swirl's field."
fig:tremor: "The thermal tremor of a ball and a shell whose fields outside are identical: lattices of equal masses joined by springs, with the same total mass and radius, the shell's thickness a third of its radius. Each curve adds up, mode by mode in order of frequency, the mean square rate of change of the quadrupole moment along a lattice axis, $h = z^2 - \\tfrac12(x^2 + y^2)$, the $m = 0$ term of the thermal multipole sum; frequency is in units of the ball's strongest quadrupole mode. The totals are in the ratio of the bodies' second moments, $\\int\\rho\\,r^2\\,\\dd V$, whatever the springs; the shell is softer, and its tremor lies at lower frequencies."
fig:resolution-law: "The exact near-field resolution law of [section 3.7](/tutorial/noise/blur-law/). (a) The Wiener filter $H$ of [section 3.5](/tutorial/noise/wiener-filter/) against spatial frequency, for four signal-to-noise ratios: patterns coarser than $kz = q_c$ are kept almost whole, finer ones are lost. Dots mark $H = \\tfrac12$ at the cut-off $q_c$. Raising the sensitivity from $10^{6}$ to $10^{60}$ moves the cut-off only from 18 to 144. (b) The resulting blur, the full width at half maximum of the image of a point, for a flat array ($4.43/q_c$) and a single row ($3.79/q_c$), with values computed directly (dots) and the first estimate $\\pi/\\ln\\SNR$ (dashed)."
fig:nearfield: "The near-field blur, for a row of pixels over a two-dimensional scene: two line masses a distance $z/2$ apart at depth $z$, recorded with signal-to-noise ratio $10^6$. (a) The geometry, to scale, and what the pixels record: $-\\tE_{zz}$ along the row, a single smooth bump. (b) The best linear reconstruction of the masses that the noise allows, the Wiener filter of [section 3.5](/tutorial/noise/wiener-filter/); its ripples are the price of discarding the detail that noise has swamped. The bar is the blur, $0.21\\,z$."
fig:locked-safe: "The locked safe, computed. Two identical steel safes $3.5\\,\\mathrm{m}$ away; the right-hand one holds $324\\,\\mathrm{kg}$ of gold. (a) Ordinary light, from the same camera. (b) The tidal column $S(\\hat n)$ of [section 2.3](/tutorial/outside/multipoles/), exact, with the floor and walls of the room included; white lines mark the outlines that light shows, and the yellow line the gold, which it does not. (c) The same with the empty room, which is known, subtracted. (d) Panel (c) blurred by the point spread of the Wiener reconstruction at a signal-to-noise ratio of $10^{20}$ ([section 3.7](/tutorial/noise/blur-law/)): the gold still stands out through the steel. Blurring $S$ in this way treats the scene as if it lay at a single depth; it shows what an array as wide as the scene is deep could resolve, not a reconstruction from simulated data. Panels (b)--(d) share one scale. (e) The tidal field of the two safes on a sphere of radius $3.8\\,\\mathrm{m}$ about the camera, which passes through the middle of each, seen from the same camera, drawn as in the figure of the tidal field: rings of free particles across the line of sight as the field distorts them (exaggerated, the strength compressed), over a map of the component along the line of sight, blue for squeeze. Where the sphere cuts the safes it is drawn cream, and where it cuts the gold, yellow. (f) What the pixels read: two components of the tensor along a row of pixels $3.5\\,\\mathrm{m}$ long at the camera, with the gold (solid) and without it (dashed), and the gold's own part (black), at most $6.5\\times10^{-10}\\,\\mathrm{s^{-2}}$. These curves, with noise, are all that an image of the scene is computed from."
fig:buried-ruler: "The zeros of the shear above two buried masses. Two equal masses $d$ apart (crosses) lie at depth $z$ below the plane of a camera; each panel spans $4.4\\,d$ of that plane. Top: the ordinary near-field picture, $-\\tE_{zz}$, in which the two merge as $z$ grows. Bottom: the phase of the shear in the plane, $(\\tE_{xx} - \\tE_{yy}) + 2i\\,\\tE_{xy}$, which turns once around each of two zeros (circles). The zeros lie on the perpendicular bisector of the pair, exactly $d$ apart at every depth, and they are the only zeros at every depth greater than $\\tfrac{\\sqrt3}{2}d$."
fig:capacity: "The information in a near-field picture, per area $z^2$ of the scene, against the signal-to-noise ratio ([section 3.8](/tutorial/noise/bits/)). Orange: the bits the data carry about the scene. Dashed: the closed form, which lies on it. Blue: the number of independent patterns resolved, $q_c^2/4\\pi$. Raising the sensitivity by sixty-seven orders of magnitude, from $10^3$ to $10^{70}$, raises the information only from 38 bits to $1.8\\times10^5$, about 22 kilobytes."
fig:near-field-geometry: "The geometry of the near field. A block of ground cut open beneath a flat camera whose pixels are $b$ apart. Its face is divided into cells of one size in the line element $(\\dd x^2 + \\dd y^2 + \\dd z^2)/z^2$: squares as wide as their tops are deep. Two equal masses lie at the middles of two cells (the paler squares), at the depths $3b$ and $12b$. Blue: what the front row of pixels records of each, $-\\tE_{zz}$, drawn to its own greatest value and between the places where it changes sign, or to the camera's edge. Each pattern is as wide, at half its height, as its mass is deep, so that a change of depth is a change of scale across the camera, and the cells of every level hold the same number of resolved patterns. The stone is a picture."
fig:quadrupole: "Radiation from a spinning pair of masses. (a) The power sent in each direction, $(1 + 6\\cos^2\\iota + \\cos^4\\iota)/8$, against the angle $\\iota$ from the spin $\\boldsymbol\\Omega$, drawn as a curve in a plane containing the spin: strongest along the axis and eight times less in the plane of the orbit. Around it, at every $30^\\circ$, the polarization an observer there sees, face on: an ellipse with semi-axes in proportion to $(1 + \\cos^2\\iota)/2$ and $|\\cos\\iota|$, filled magenta where the pattern of stretching turns anticlockwise as that observer sees it ($V/I > 0$) and green where it turns clockwise, as in the figure of which way the waves turn, the depth of colour in proportion to $|V/I|$ ([section 5.4](/tutorial/waves/polarization/)); in the plane of the orbit the wave is linearly polarized (a line). The pair at the centre is schematic. (b) The wavelength over the size of the source ([section 5.2](/tutorial/waves/retarded-waves/)), against the speed of its moving parts: for anything moving at everyday speeds the wavelength is millions of times the size of the body."
fig:polarization: "The wave of a rotor seen from different directions: the amplitudes of its two polarizations ([section 7.7](/tutorial/geometry/quadrupole-formula/)) and its degree of circular polarization $V/I$ ([section 5.4](/tutorial/waves/polarization/)), against the angle $\\iota$ between the spin and the direction of the camera. $V/I$ is $\\pm1$ along the axis and changes sign edge-on, where the wave is linearly polarized: its sign gives the sense of rotation, its size the tilt."
fig:which-way: "Which way it turns, computed with the speed of light set to $20\\,\\mathrm{cm\\,s^{-1}}$, so that the waves are $10\\,\\mathrm{cm}$ long and an array $1.5\\,\\mathrm{m}$ wide can resolve the boxes. Three sealed steel boxes on a shelf; in the top and middle ones a pair of balls turns once a second, in opposite senses, and the bottom pair is still. (a) Ordinary light, from the same camera: the boxes are sealed and look the same. (b) The waves: each turning pair is an Airy spot ([section 5.3](/tutorial/waves/diffraction/)) of an array focused at the shelf's distance, and the still pair is dark; the colour is the degree of circular polarization $V/I$ ([section 5.4](/tutorial/waves/polarization/)), that of a compact rotor, magenta where the pattern of stretching turns anticlockwise as the camera sees it and green where it turns clockwise. At the true speed of light the waves are $1.5\\times10^{8}\\,\\mathrm{m}$ long and nothing is resolved; a camera in the room, deep inside their near zone, reads the Newtonian tide, whose stretch turns with each pair and still gives the sense of turning."
fig:line-integral: "Two ways of forming a picture. A camera's line of sight passes through a closed door, a closed steel furnace with a hot iron block inside, and a person. In light it ends where it meets the door's face (the dot): a pixel reports one point. Gravitational radiation passes through everything, so the line runs on, dashed where a body hides it, and the hot block shows through the furnace's walls. The pixel reports the sum along the whole line ([section 5.5](/tutorial/waves/radiance/)): each body $k$ adds its number emissivity $j_{N,k}$ times the length $\\ell_k$ of the line inside it, shown below for illustrative values in which the hot iron is by far the brightest and the door, crossed only through its thickness, adds little. The objects are illustrations."
fig:closed-furnace: "The closed furnace, computed. Two closed steel furnaces hold the same block of iron, one at $293\\,\\mathrm{K}$ and one at $1500\\,\\mathrm{K}$. (a) Ordinary light: the two are identical. (b) The expected thermal number radiance ([section 5.5](/tutorial/waves/radiance/)) from the same camera, on a logarithmic scale, with the outlines that light shows. Both blocks show through their steel, since the air about them does not glow, and the hot one is sixteen times as bright through its middle (twenty-two without the glow of the floor behind them). The room itself glows faintly, brightest where a line of sight crosses the floor at a slant. Iron and steel have the friction of iron shown in the figure of the materials' friction, falling as $1/T$ in the hot block; silica glass stands for the concrete and the plaster."
fig:materials: "The friction and the glow of real materials. (a) The friction against a uniform shear, $\\mathrm{Re}\\,\\eta(\\omega)$, of the materials considered in the text at $293\\,\\mathrm{K}$; the shaded band is where the Planck radiance exceeds a tenth of its peak. In copper and iron (dotted: the upper bound for free electrons) the electrons relax; silicon and diamond have lines at their Raman frequencies, drawn as damped oscillators of the measured widths whose far wings are not modelled; the steps are where pair bands end; silica glass is spread evenly over its band; water's friction rises where its hydrogen bonds stretch. (b) The glow they send, $4\\pi j_\\omega$ per unit of frequency ([section 10.2](/tutorial/glow/kirchhoff/)), shown beside the placeholder's for comparison."
fig:black-hole-camera: "A black hole as the camera's lens. The tide of the hole that is as warm as the sky ($1.356\\times10^{23}\\,\\mathrm{kg}$, Schwarzschild radius $0.2\\,\\mathrm{mm}$), the one lens compact enough to focus the thermal glow, against the distance from it. The camera has to sit where the tide is bearable, $1\\,\\mathrm{s^{-2}}$ at $26\\,\\mathrm{km}$, where the Einstein ring is $26''$ in radius and the camera must orbit the hole every nine seconds. Even there the hole's tide is $10^{8}$ times that of a person a metre from the camera (dashed), and it stays larger until the camera is $12{,}500\\,\\mathrm{km}$ away."
fig:array: "How sharply a camera can tell directions apart: the response to a single distant source as the computed image is steered away from it, with the width of each curve at half height. For arrays $2$, $5$ and $30$ wavelengths wide the curve is the scalar pattern of a round aperture, which the power of [section 5.3](/tutorial/waves/diffraction/) follows to within five per cent in width. For a single pixel it is instead the best linear estimate of the sky from the pixel's data, its projection onto the spherical harmonics of degree four and below; being an estimate rather than a power, it can be negative, as it is sixty degrees off. A single pixel's view of the sky is blurred over some fifty degrees, and an array sharpens in proportion to its width in wavelengths."
fig:stars: "The principal null directions of a field ([section 9.4](/tutorial/one-point/petrov/)), on the sky around one pixel (each disc), for gravity (top) and light (bottom). Coincident directions are drawn as touching dots, so that every sky of gravity holds four and every sky of light two; faint dots and dashed lines lie on the far side. One wave puts all of them on its direction of travel $\\hat k$. One source at rest, a mass or a charge, puts them in two groups on the line through it. Moving across that line at $0.9\\,c$, the source folds both groups toward its velocity, along the paths drawn from their places at rest (open circles), and the midpoint of the two, as a vector, is its velocity across the line to where it is now, $\\mathbf{v}_\\perp/c$. Two masses at rest give four separate directions (Petrov type I), so they could not be one body; two charges give light's two directions again, at the ends of the line of force, as one charge would."
fig:speedometer: "A pixel's own velocity, and a test for motion in the scene. (a) A pixel crosses a room of four masses unknown to it at $0.6\\,c$ (seen from above, in the room's frame), and at every point reads its own velocity from $\\mathcal{W}$ alone ([section 9.3](/tutorial/one-point/the-matrix-w/)) (arrows). (b) Along the path: the error of the velocity read (dashed), and the ratio $\\max|\\mathrm{Im}\\,w|/\\max|w|$ over the eigenvalues $w$ of $\\mathcal{W}$, which is zero for the room at rest, however fast the pixel moves, to the accuracy of the computation, $10^{-8}$ here, and is not when one mass crosses the room at $0.05\\,c$. Computed from the exact field of uniformly moving masses."
fig:voices: "One pixel, four waves. (a) Four plane waves arrive from four fixed directions, each with its own waveform and polarization (strong and faint lines; the third is linearly polarized, and its faint line is flat), and one pixel reads the ten numbers of $\\tE$ and $\\tB$ while all four pass. (b) From the readings alone: the matrix $A$ with $\\mathrm{tr}(A\\mathcal{W}) = 0$ for every reading, and, on the sky toward the sources, the size of $\\mathbf{m}^{T}\\!A\\,\\mathbf{m}$, shaded over two and a half decades. It vanishes at exactly four points ([section 9.5](/tutorial/one-point/separating-waves/)): the zeros found from the readings (dots) fall on the four sources (rings). (c) Light from the first two sources, the same way: its readings $\\mathbf{E} + ic\\mathbf{B}$ span a plane, the vector $\\mathbf{a}$ orthogonal to it gives $\\mathbf{m}\\cdot\\mathbf{a}$, and that vanishes at the two sources; a third wave of light would fill all six of its numbers and leave nothing to find."
fig:sky-count: "What one pixel sees of the sky at one frequency. (a) Of the real numbers in the spectral matrix of a point sensor, those that carry the sky's brightness $I$, its circular polarization $V$ and its linear polarization, and those that vanish for any sky of waves and serve as checks ([section 9.6](/tutorial/one-point/the-sky-at-one-point/)), for sound (a pressure and a velocity), light and gravity. (b) What a pixel cannot see: twelve equal, unpolarized, independent sources at the corners of a regular icosahedron give it exactly the second moments of a uniform sky of the same total brightness, because those corners average every polynomial of degree five or less as the whole sphere does."
fig:ranging: "Ranging a wave source from one pixel: the exact field of two equal masses turning in a circle, read at reduced distance $kr$ and inclination $\\iota$ (points), against the formulas of [section 9.7](/tutorial/one-point/beyond-one-plane-wave/) (lines). (a) At one instant, at wave phase $\\theta = 0$, the oscillating part of $\\mathcal{W}$ departs from rank one by $C(\\iota, 0)/(kr)^2$, not by $1/kr$ (dashed); the points approach the lines as the next order dies away. (b) Over a cycle, the distance read from the two frequency parts $\\mathcal{W}_\\pm$ alone, with no knowledge of the inclination, over the true distance. (c) The directions read from the two frequency parts differ by $8|\\cot\\iota|/kr$, here at $kr = 200$."
fig:present: "The field of a moving mass points to its present position. (a) A mass passing a pixel at $0.6\\,c$: the stretch axis of its exact field at the pixel (a ring of free masses, exaggerated) points at where the mass is now, while its light arrives from where it was a light-travel time ago. (b) Near two masses in orbit, at reduced distance $kr$, the changing part of the exact field against Newton's field of the masses at their present positions, which it matches to order $(kr)^2$, and at their retarded positions, which miss by $kr$."
fig:beyond: "Beyond general relativity in one reading. (a) The six polarizations a metric theory of gravity allows (Eardley, Lee and Lightman 1973), each drawn as the distortion it makes of a ring of free particles in the plane where it acts (dashed: at rest; exaggerated), for a wave travelling along $\\hat k$; general relativity has only the first two. One reading gives all six, with the direction and the phase speed ([section 9.7](/tutorial/one-point/beyond-one-plane-wave/)). (b) The ratio of the longitudinal to the breathing amplitude, and $n = c/v_p$, both from one reading, for the helicity-zero wave of a massive graviton (black) and for a massive scalar (blue) (points: curvature computed from the metric), against $-2(1 - n^2)$ and $+(1 - n^2)$ (lines); general relativity is the open circle. The two differ in sign at every speed, and both ratios vanish as the speed approaches $c$."
fig:two-pixels: "Two pixels far apart. (a) The response of two sensors six wavelengths apart to one source, against the angle from it in the plane of their baseline: scalar sensors respond equally at every fringe, while for two pixels each fringe is weighted by $\\cos^8(\\vartheta/2)$, the overlap of their tensor responses to the two directions. (b) With a minimum-variance (Capon) estimator and two pixels a hundred wavelengths apart, the true fringe over the next false one, $1 + \\rho^2[1 - \\cos^8(\\vartheta_1/2)]$ (line; points computed), against the signal-to-noise ratio, for a source $55^\\circ$ from broadside, where $\\vartheta_1 = 1.8\\,\\lambda/D$; for scalar sensors the two are equal at any $\\rho$."
fig:separation-noise: "Separation and depth with noise, against the distance $b$ of a pixel's six neighbours over the distance $r$ of the source. Blue: Cramér-Rao bounds of the full models; black: closed forms; dots: the spread of maximum-likelihood fits to simulated noisy readings (2000 readings for each point of (a), $10^4$ in (b) and (c)). (a) The factor by which fitting the rotor of the text enlarges the error of a wave's amplitude: at one pixel from $\\tE$ and $\\tB$, with any near field, $\\sqrt2$ (the dot at left is a simulation with the rotor present); for the array, which fits the rotor as a point quadrupole of unknown moment and position, from $\\tE$ alone (solid) and from both (dashed). (b) The range of one mass, with $\\rho$ the signal-to-noise ratio of one pixel's reading, against the closed-form bound. (c) The separation $\\Delta_{\\min}$ in depth at which two equal masses on one line are told from one at one standard deviation."
fig:earth-glow: "The thermal glow of the Earth's interior seen from its surface. (a) The model's five shells, to scale, in a globe with a quarter cut away. Every line of sight starts at the camera on the surface; the three drawn graze the boundaries of the inner core, the core and the lower mantle, which they meet at $\\arcsin(r/R)$ from straight down: $11^\\circ$, $33^\\circ$ and $63^\\circ$. At an equinox the line to the Sun's core leaves $40^\\circ$ from straight down, as in the figure of the Sun at midnight, and misses the core. The Sun's size and distance are schematic; the surface is NASA's Blue Marble. (b) The brightness ([section 5.5](/tutorial/waves/radiance/)) against the angle of the line of sight, with each shell's share shaded in its colour in (a). Its kinks fall exactly at the grazing angles, so their places are a measurement of the radii that does not depend on the friction, here the most that each shell's stiffness allows, which sets only their heights."
fig:budget: "Gravitons emitted per second by whole objects, on a logarithmic scale spanning forty powers of ten. The spinning masses radiate by bulk motion ([section 7.7](/tutorial/geometry/quadrupole-formula/)); the others thermally ([section 10.2](/tutorial/glow/kirchhoff/)). The person, taken as seventy litres of water, and the litre of water have the friction of water. The Earth's value (marked with an asterisk) depends on its assumed friction and is an upper bound. The beam weighs 490 tonnes; the pairs of masses are of one tonne, two metres apart, and of one kilogram, a metre apart."
fig:earth-inverted: "The thermal Earth, inverted, in a simulation. (a) Eighty years of gravitons on a detector of one square metre that collects from every direction, pooled in rings of one degree about straight down (dots, with Poisson errors; $35{,}619$ in all), and the maximum-likelihood fit of five uniform shells, radii and emissivities together (line; [section 5.6](/tutorial/waves/abel-transform/)). Dotted: the fitted boundaries, at $\\arcsin(r/R)$. (b) Each shell's friction, read from its fitted emissivity at the model's temperature ([section 10.2](/tutorial/glow/kirchhoff/)), against radius. The boxes span the fitted radii and one standard deviation; the dashed grey lines are the frictions given to the model, each shell's bound (for the crust, too thin to draw, a short dash across its bar). The radii fitted to this simulated sample are $1281 \\pm 41$, $3499 \\pm 28$, $5709 \\pm 5$ and $6350 \\pm 3\\,\\mathrm{km}$, against the model's $1222$, $3480$, $5701$ and $6346$. The crust, $25\\,\\mathrm{km}$ thick, sends only about twelve of the gravitons."
fig:binary-field: "Two black holes of thirty solar masses, ten seconds before they merge, in the plane of their orbit: the changing part of the tidal field $\\tE_{zz}$ (across the plane), from the linearized solution of [section 7.7](/tutorial/geometry/quadrupole-formula/). Colour gives the phase, orange for stretch and blue for squeeze, scaled at each place by the local strength. (a) Near the pair, whose separation is $d$, the pattern turns rigidly with it; beyond the dotted circle, $r = \\lambda/2\\pi$, it begins to wind. (b) Farther out it is the spiral of the waves. (c) The strength along a line in the plane, times $r$: Newton's $r^{-5}$ near the pair and the waves' $r^{-1}$ far from it, the two laws crossing at $0.3\\,\\lambda$, twice the radius of the dotted circle. The field is an exact solution of linearized gravity truncated at the mass quadrupole, which this close to a merger is a guide to the full solution, not a substitute for it."
fig:memory: "The gravitational-wave memory, against the direction of the camera. (a) A merger: the oscillating wave is strongest along the orbit's axis, the memory in its plane. (b) An explosion whose energy leaves in one jet, in two opposite jets, or evenly in all directions, in units of $4GE/c^4 r$."
fig:milky-way: "The Milky Way from the Sun in two maps of the whole sky on one logarithmic scale of brightness, centred on the Galactic centre, with Galactic longitude (marked beneath each map) increasing to the left. (a) Light from the model's stars, dimmed and reddened by its dust. (b) Gravitational waves from white-dwarf pairs that trace the same stars, as an ideal camera about $50\\,\\mathrm{AU}$ across would see them at three millihertz. Without its dust, (a) would be identical to (b) in brightness."
fig:black-hole: "A black hole seen from rest $40\\,GM/c^2$ away, through exact Schwarzschild rays, with the Galaxy's centre $9^\\circ$ below the hole. (a) Light: the model Milky Way of the figure of the Galaxy, with stars added for orientation. (b) The primordial graviton background, warmed to $0.929\\,\\mathrm{K}$ by the depth of the potential ([section 11.3](/tutorial/black-holes/hawking/)) and hotter toward our direction of motion; the colour shows its departure from the mean, folded around the shadow by the bending. The two skies differ, but the rays that carry them are the same: dashed, in both panels, is the Einstein ring, $20^\\circ$ in radius, where the sky straight behind the hole is seen. The Galaxy's bulge, which reaches up to that line, is drawn out around it into the bright ring of (a). Inside the ring each side of the sky appears on the opposite side of the hole: the band of the Milky Way below the hole appears again as the arc above it in (a), and the background's dipole turns over in (b)."
fig:sun-lens: "The transparent Sun as a lens for gravitational waves, in Eddington's standard model. (a) Bending against the impact parameter: inside the Sun it rises to $4.2''$ and falls to zero at the centre; the dashed curve is what a point mass would give. (b) The distance behind the Sun at which the rays at each impact parameter cross the axis: $33.7\\,\\mathrm{AU}$ through the centre, $548\\,\\mathrm{AU}$ at the surface. The dashed line marks the $23.5\\,\\mathrm{AU}$ found for the standard solar model."
fig:hair: "What the exterior field determines. (a) Three bodies of one size and one mass: a uniform ball, a shell whose skin is eight per cent of its radius thick, and a ball of light rock whose core, of $0.4$ of its radius, holds half the mass. The field: outside, the pull of the three is the same at any one time (grey arrows). A tide: an impulsive tide of potential proportional to $x^2 - y^2$ gives each part an impulse along $(x, -y)$ and in proportion to its distance from the $z$ axis, outward near one axis (orange) and inward near the other (blue), drawn on sections of the three. The weight: the energy each gains ([section 13.1](/tutorial/what-a-field-keeps/push-and-pass/)) is proportional to its $\\int\\rho\\,r^2\\,\\dd V$, which is $0.60$, $0.92$ and $0.37\\,MR^2$ (bars). (b) The numbers that the field outside carries, a bead for each. A stone read at $\\SNR = 10^6$ from three of its radii shows the $169$ moments of degree twelve and below, the $2\\ell + 1$ of each degree in a row, each bead's area in proportion to the bits it holds, about $1200$ in all; a black hole at rest shows seven. The cutaway bodies and the stone's layers are pictures."
fig:two-readings: "The two readings as one transform ([section 13.2](/tutorial/what-a-field-keeps/calderon/)). (a) The space of the scene's transform: $\\mathbf K$ across a flat camera, and the rate of decay with depth, $\\kappa$. A reading at one time holds the transform on the cone $\\kappa = K$ (blue outline); readings at two times hold it inside (orange). The harmonic functions $h_{\\mathbf k}$ and $h_{\\mathbf k'}$ are two points of the cone, drawn here on its outline, and the second reading made with them holds the transform at their sum, $(\\mathbf k + \\mathbf k',\\,|\\mathbf k| + |\\mathbf k'|)$, which lies inside. (b) The plane of $\\mathbf K$ seen from above. The same point $(\\mathbf K, \\kappa)$ is reached by every pair with $\\mathbf k$ on the ellipse $|\\mathbf k| + |\\mathbf K - \\mathbf k| = \\kappa$, whose foci are $0$ and $\\mathbf K$: the pair of (a), and one other (pale)."
fig:passing: "A mass that passes. (a) Two bodies with the same field outside, a thin shell of mass $M$ and radius $R/\\sqrt2$ (above) and a point of mass $M/2$ at the centre of a shell of radius $R$ that holds the other half (below), seen along the path of a mass that crosses the page at $b = 1.5R$ (the bead). Arrows: the impulses that parts of each shell receive, less that of the body as a whole, outward (orange) or inward (blue), at the four places where they lie along the radius; the mass at the centre receives none. Bars: the internal energy left in each, $0.080$ and $0.104\\,MC^2/2R^2$. (b) That energy against the distance of the pass, in the same units. The two gain alike from every quadrupolar tide (the figure of the ladder of tides) and are told apart by one pass. The cutaway bodies are pictures, and the skins, the mass at the centre and the bead are drawn with some size."
fig:ladder: "What a tide of a given degree reaches ([section 13.3](/tutorial/what-a-field-keeps/ladder/)). (a) Two bodies with the same field outside the radius $R$ (dotted): a thin shell of mass $M$ and radius $R/\\sqrt2$ (above), and a point of mass $M/2$ at the centre of a shell of radius $R$ that holds the other half (below). Grey arrows: the pull outside $R$, the same for both. The impulses of a tide of profile $(x^2 - y^2)/2$ and of one of profile $(x^3 - 3xy^2)/3$, outward (orange) or inward (blue), are drawn on sections of the two; the bars are the energies gained, $\\tfrac12\\epsilon^2$ times $MR^2/3$ for both under the first, and $\\tfrac{2}{15}\\,MR^4$ and $\\tfrac{4}{15}\\,MR^4$ under the second. (b) The moments that are reached, a bead for each as in the figure of what the exterior field determines, the $2\\ell + 1$ of each degree $\\ell$ in a row. The field at one time holds the lowest floor, $\\int\\rho\\,r^\\ell Y_\\ell\\,\\dd V$; tides of degree two add the next, with $r^{\\ell+2}$, and each further degree one floor more. The orange bead, $\\int\\rho\\,r^4\\,\\dd V$, is the first at which the two bodies differ. The cutaway bodies are pictures, and the skins and the mass at the centre are drawn with some size."
fig:hidden-flow: "A flow that the exterior field does not show, and what two tides read of it ([section 13.4](/tutorial/what-a-field-keeps/flows-inside/)). (a) A uniform sphere in section through its equator, seen along the axis about which it turns: the inner ball, out to $2^{-1/5}$ of the radius, turns one way (orange) and the rest the other (blue), at the same rate, so that the sphere has no angular momentum and no magnetic field outside. Each arrow is the path of a part in one interval of time. (b) The share of each radius in the bracket that the two tides read, for the pairs of profiles $h + ig = (x + iy)^n/n$ with $n = 2$ and $3$, each drawn to its own greatest value. The inner ball counts with one sign and the rest with the other, in proportion to $r^{2n}$. For degree two the two areas are equal, as they are in the angular momentum, and the sum is zero. For degree three the outer part counts for more, and the sum is $0.221\\,M\\Omega R^4$. The stone of the section is a picture."
fig:hole-response: "The weight of a black hole's response to a tide ([section 13.7](/tutorial/what-a-field-keeps/thermometer/)). (a) The integrand of the sum rule, $(5/32\\pi)\\,\\Gamma_2/x^4$ with $x = GM\\omega/c^3$, in units of $Mr_s^2$. It is greatest at $x = 0.40$. (b) Its sum below each frequency, which tends to $0.345\\,Mr_s^2$. The lines are the sums of two round bodies of the hole's mass, $\\tfrac13\\int\\rho\\,r^2\\,\\dd V$ for the quadrupole moment $Q_{ij}$ of the horizon: a thin shell of radius $r_s$ and a uniform ball of that radius. (c) The same sum for the tide of each degree, as the radius of the shell of the hole's mass that has it. The radii tend to $(3\\sqrt3/e)\\,r_s$, and the first three belong to no distribution of positive mass. (d) The reason: $\\int\\rho\\,r^2(r^2 - a)^2\\,\\dd V$, which no positive mass can make negative, computed from the sums for $\\ell = 2$, 3 and 4, for the hole (orange) and for a uniform ball with the hole's first sum (grey)."
