[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravcam"
description = "Independent Python reference implementation for The Gravitational Camera"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "mpmath>=1.3"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["gravcam"]

[tool.setuptools.dynamic]
version = { attr = "gravcam.__version__" }

[tool.pytest.ini_options]
# `pytest` run from reference/ works without installing the package.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
