# The tutorial's parts and chapters (PLAN.md section 3), and its routes.
#
# Each chapter has an id (as PLAN.md numbers it: 1.4, or R1 for a reading chapter), a slug (part/chapter: the
# page is /tutorial/<slug>/ and the source tutorial/<slug>.md), a title, a short title for margin notes and
# links ("Background · Tides, 1.4"), a size (S about 1500-2500 words, M 2500-4000, L 4000-5000) and a status:
#   planned    no source yet, listed on the home page only
#   draft      a source is being written; not built yet, listed as in preparation
#   published  built, listed, linked from the paper's margin
# A reading chapter also names the paper's sections it reads (reads: [sec:...]).
#
# Sizes beyond Part 0 are first estimates, to be corrected as outline cards are written.

parts:
  - id: '0'
    slug: evening
    title: The camera in one evening
    chapters:
      - { id: '0.1', slug: evening/a-camera-for-gravity, title: 'A camera for gravity: the pixel, the tide, the three regimes', short: A camera for gravity, size: S, status: published }
      - { id: '0.2', slug: evening/through-walls, title: 'Seeing mass through walls, and why the picture blurs', short: Through walls, size: S, status: published }
      - { id: '0.3', slug: evening/waves-and-heat, title: 'Waves too long to see, and the glow of heat', short: Waves and heat, size: S, status: published }
      - { id: '0.4', slug: evening/one-pixel, title: "One pixel does a camera's work", short: One pixel, size: S, status: published }
      - { id: '0.5', slug: evening/what-the-outside-keeps, title: 'What the outside of a body keeps', short: What the outside keeps, size: S, status: published }
      - { id: '0.6', slug: evening/how-to-read, title: 'How to read the rest: units, scales, notation, routes, how to read an equation', short: How to read, size: S, status: published }

