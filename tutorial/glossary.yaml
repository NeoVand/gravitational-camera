# The terms the tutorial defines, each with its defining chapter: the glossary page lists them.
# Fields: term, definition (one or two plain sentences, $...$ for mathematics), role (optional: the colour role of
# the object, if it has one), chapter (the defining chapter's id), anchor (optional: a section id within it).
terms:
  - term: tide
    definition: 'The difference between the pull of gravity at two nearby points. A tide stretches a small free body along one direction and squeezes it along the others.'
    role: curv
    chapter: '1.4'
  - term: potential
    definition: 'The energy per unit mass that a small body has because of where it is in a gravitational field, measured in joules per kilogram.'
    role: field
    chapter: '1.2'
  - term: gradient
    definition: 'The vector of the three partial derivatives of a function of position. It points in the direction in which the function grows fastest.'
    chapter: '1.2'
  - term: Hessian
    definition: 'The table of all the second partial derivatives of a function, $\partial_i\partial_j f$. For the potential it is the tidal tensor.'
    chapter: '1.4'
  - term: pixel
    definition: 'In the paper, a small cloud or ring of free test masses whose relative motion is watched. It measures the tide at one place.'
    chapter: '0.1'
  - term: trace-free
    definition: 'A square table of numbers whose diagonal entries add up to zero. Outside matter, the tidal tensor is trace-free.'
    chapter: '1.5'
  - term: free fall
    definition: 'The motion of a body on which gravity is the only force. A freely falling observer cannot feel the pull of gravity at their own place.'
    chapter: '1.4'
  - term: equivalence principle
    definition: 'In its Newtonian form, the fact that every body at a given place falls with the same acceleration, whatever its mass and whatever it is made of.'
    chapter: '1.4'
  - term: tidal tensor
    definition: 'The table of the nine second derivatives of the potential, $\mathcal{E}_{ij} = \partial_i\partial_j\Phi$. Two free balls a small vector $\xi$ apart accelerate relative to each other by $-\mathcal{E}_{ij}\xi_j$. It is measured in s⁻².'
    role: curv
    chapter: '1.4'
  - term: tensor
    definition: 'A table of numbers with a row and a column for each direction in space, whose entries change in a fixed way when the axes are turned, as the components of a vector do. The tidal tensor is one.'
    chapter: '1.4'
  - term: stretch
    definition: 'A negative entry of the tidal tensor along a direction: free balls separated along that direction move apart. Drawn in orange.'
    role: curv
    chapter: '1.4'
  - term: squeeze
    definition: 'A positive entry of the tidal tensor along a direction: free balls separated along that direction move together. Drawn in blue.'
    role: curv
    chapter: '1.4'
  - term: eötvös
    definition: 'The unit of tide, 1 E = 10⁻⁹ s⁻². A person of 70 kg one metre away raises a tide of about 9 E.'
    chapter: '1.4'
  - term: trace
    definition: 'The sum of the diagonal entries of a square table. The trace of the tidal tensor is $4\pi G\rho$, zero in empty space.'
    chapter: '1.4'
    anchor: in-empty-space-the-stretch-and-the-squeezes-balance
  - term: angular size
    definition: 'The radius of a body divided by its distance. For a distant body it is the angle, in radians, from its centre to its edge.'
    chapter: '1.4'
    anchor: tidal-brightness-is-density-times-the-cube-of-angular-size
  - term: tidal brightness
    definition: 'The size of the tide a body raises, $2GM/r^3 = (8\pi G/3)\bar\rho\,\theta^3$: its mean density times the cube of its angular size, times a constant.'
    chapter: '1.4'
    anchor: tidal-brightness-is-density-times-the-cube-of-angular-size
  - term: strain
    definition: 'A change in length divided by the length, a pure number. LIGO reads the strain of one arm minus that of the other; the waves it detects have strains near 10⁻²¹.'
    chapter: '1.4'
    anchor: a-swaying-person-makes-the-signal-that-ligo-must-keep-out
  - term: pseudo-tide
    definition: 'An apparent tide that comes from the motion of the frame, not from any mass. A frame turning at angular velocity $\Omega$ feels one of size $\Omega^2$.'
    chapter: '1.4'
  - term: signal-to-noise ratio of the array
    definition: 'The peak tide of a point mass, divided by the noise of the tide averaged over a square patch whose side equals the depth of the mass: $\mathrm{SNR} = 2Gm/(z^2\sqrt{N_0})$.'
    chapter: '3.7'
    anchor: step-1-one-number-measures-the-camera
  - term: cut-off
    definition: 'The finest ripple that a reconstruction still keeps with weight one half. For the near-field camera it is the larger root $q_c$ of $q_c\,e^{-q_c} = 1/\pi\,\mathrm{SNR}$.'
    chapter: '3.7'
    anchor: step-3-the-filter-keeps-a-ripple-while-it-stands-above-its-noise
  - term: fixed-point iteration
    definition: 'A way to solve an equation written as $q = g(q)$: guess $q$, put the guess into $g$, and take the result as the next guess. It settles down when the slope of $g$ is smaller than one in size.'
    chapter: '3.7'
    anchor: step-4-solving-the-cut-off-needs-a-logarithm-of-a-logarithm
  - term: iterated logarithm
    definition: 'The logarithm of a logarithm, such as $\ln\ln(\pi\,\mathrm{SNR})$. It grows extremely slowly: 2.1 at a signal-to-noise ratio of a thousand and 4.3 at $10^{30}$.'
    chapter: '3.7'
    anchor: step-4-solving-the-cut-off-needs-a-logarithm-of-a-logarithm
  - term: Lambert W function
    definition: 'The inverse of the function $w\,e^w$. For values between $-1/e$ and $0$ it has two real branches, $\mathrm{W}_0$ above $-1$ and $\mathrm{W}_{-1}$ below it.'
    chapter: '3.7'
    anchor: step-4-solving-the-cut-off-needs-a-logarithm-of-a-logarithm
  - term: pupil
    definition: 'The opening of an imaging system. A filter that keeps every ripple whose wavevector lies inside a circle acts as a round pupil, and draws a point as $2J_1(u)/u$.'
    chapter: '3.7'
    anchor: step-5-the-picture-of-a-point-is-the-pattern-of-a-round-opening
  - term: point-spread function
    definition: 'The picture that an imaging system or a reconstruction draws of a single point.'
    chapter: '3.5'
  - term: full width at half maximum
    definition: 'The distance between the two points, one on each side of a peak, where a curve has fallen to half its peak value.'
    chapter: '3.5'
  - term: amplitude image
    definition: 'A picture that is linear in the data, so that the picture of two sources is the sum of their pictures. The near-field reconstruction, a surface density, is one.'
    chapter: '3.7'
    anchor: step-6-the-blur-is-the-width-of-the-picture-at-half-its-height
  - term: intensity image
    definition: 'A picture of the energy arriving at each point, the square of an amplitude, as a photograph of light records it. The Airy pattern $(2J_1(u)/u)^2$ is the intensity image of a round pupil.'
    chapter: '3.7'
    anchor: step-6-the-blur-is-the-width-of-the-picture-at-half-its-height
  - term: "Sparrow's criterion"
    definition: 'Two equal points are told apart once the picture of the pair dips between them, which happens when their midpoint lies beyond the inflection point of each point''s picture.'
    chapter: '3.7'
    anchor: step-7-an-exact-calculation-reproduces-the-papers-table
  - term: angular blur
    definition: 'The width of the picture of a point divided by its distance, as an angle. For the near-field camera it is $4.43/q_c$ radians, the same at every distance.'
    chapter: '3.7'
    anchor: step-6-the-blur-is-the-width-of-the-picture-at-half-its-height
  - term: ripple
    definition: 'A pattern across a sheet that varies as $\cos(\mathbf k\cdot\mathbf a)$ with position $\mathbf a$. Any pattern on the sheet is a sum of ripples, by Fourier analysis.'
    chapter: '3.7'
    anchor: step-2-each-ripple-stands-above-its-noise-by-a-factor-that-depends-on-two-numbers
  - term: wavenumber
    definition: 'The length $k$ of the wavevector of a ripple: $2\pi$ divided by the distance between crests, in m⁻¹.'
    chapter: '3.7'
    anchor: step-2-each-ripple-stands-above-its-noise-by-a-factor-that-depends-on-two-numbers
  - term: inflection point
    definition: 'A point where a curve stops curving downward and starts curving upward, or the reverse: its second derivative changes sign there.'
    chapter: '3.7'
    anchor: step-7-an-exact-calculation-reproduces-the-papers-table
  - term: force
    definition: 'A push or a pull. A force $\mathbf F$ on a body of mass $m$ gives it the acceleration $\mathbf F/m$. It is a vector, measured in newtons, $1\,\mathrm N = 1\,\mathrm{kg\,m\,s^{-2}}$.'
    chapter: '1.2'
    anchor: gravity-pulls-with-a-force-proportional-to-both-masses
  - term: gravitational constant
    definition: 'The constant $G = 6.674 \times 10^{-11}\,\mathrm{m^3\,kg^{-1}\,s^{-2}}$ in Newton''s law of gravitation, by which two masses $M$ and $m$ a distance $r$ apart attract with the force $GMm/r^2$.'
    chapter: '1.2'
    anchor: gravity-pulls-with-a-force-proportional-to-both-masses
  - term: inverse-square law
    definition: 'Newton''s law that the pull of gravity between two bodies falls as the square of the distance between them: twice as far, four times weaker.'
    chapter: '1.2'
    anchor: gravity-pulls-with-a-force-proportional-to-both-masses
  - term: gravitational field
    definition: 'The pull of gravity on a small test mass divided by its mass: an acceleration, in m s⁻², at each point. It does not depend on the test mass, so it describes the place.'
    chapter: '1.2'
    anchor: the-field-is-the-pull-per-unit-mass-and-fields-add
  - term: test mass
    definition: 'A small body put at a point to feel the pull of gravity there, small enough that its own pull does not move the bodies it measures.'
    chapter: '1.2'
    anchor: the-field-is-the-pull-per-unit-mass-and-fields-add
  - term: superposition
    definition: 'The rule that the pull of many bodies is the vector sum of the pulls each would exert alone. For gravity it means that fields add, and so do potentials.'
    chapter: '1.2'
    anchor: the-field-is-the-pull-per-unit-mass-and-fields-add
  - term: density
    definition: 'Mass per unit volume at a point, in kilograms per cubic metre.'
    role: matter
    chapter: '1.2'
    anchor: the-field-is-the-pull-per-unit-mass-and-fields-add
  - term: partial derivative
    definition: 'The rate at which a function of several variables changes when one variable changes and the others are held fixed, written $\partial_i f = \partial f/\partial x_i$.'
    chapter: '1.2'
    anchor: the-gradient-points-uphill
  - term: directional derivative
    definition: 'The rate, per metre, at which a function changes as we move from a point along a unit vector $\hat u$. It equals $\hat u\cdot\nabla f$.'
    chapter: '1.2'
    anchor: the-gradient-points-uphill
  - term: equipotential
    definition: 'A surface on which the potential has the same value everywhere. The field crosses it at right angles, toward lower potential; around a point mass the equipotentials are spheres.'
    role: field
    chapter: '1.2'
    anchor: equipotentials
  - term: work
    definition: 'The energy a force gives to a body as the body moves: $\mathbf F\cdot\mathrm d\mathbf x$ for a small step, summed along the path, in joules.'
    chapter: '1.2'
    anchor: the-work-done-by-gravity-depends-only-on-the-ends-of-the-path
  - term: conservative force
    definition: 'A force whose work between two points is the same along every path joining them. Gravity is one: its work on a mass $m$ from $A$ to $B$ is $-m[\Phi(B) - \Phi(A)]$.'
    chapter: '1.2'
    anchor: the-work-done-by-gravity-depends-only-on-the-ends-of-the-path
  - term: potential energy
    definition: 'The energy a body has because of where it is. In gravity it is $m\Phi$, the body''s mass times the potential, in joules.'
    chapter: '1.2'
    anchor: the-work-done-by-gravity-depends-only-on-the-ends-of-the-path
  - term: kinetic energy
    definition: 'The energy of motion, $\tfrac12 mv^2$ for a body of mass $m$ moving at speed $v$, in joules.'
    chapter: '1.2'
    anchor: the-work-done-by-gravity-depends-only-on-the-ends-of-the-path
  - term: vector
    definition: 'A quantity with a size and a direction, drawn as an arrow. Its three components change in one fixed way, $a''_i = R_{ij}a_j$, when the axes are turned.'
    chapter: '1.1'
    anchor: a-vector-is-an-arrow-and-its-components-are-its-shadows-on-three-axes
  - term: scalar
    definition: 'A quantity that is a single number with no direction, such as a mass or the length of an arrow. It stays the same when the axes are turned.'
    chapter: '1.1'
    anchor: a-vector-is-an-arrow-and-its-components-are-its-shadows-on-three-axes
  - term: unit vector
    definition: 'A vector of length one. Dividing a vector by its length gives the unit vector in its direction.'
    chapter: '1.1'
    anchor: a-vector-is-an-arrow-and-its-components-are-its-shadows-on-three-axes
  - term: component
    definition: 'One of the three numbers that describe a vector in chosen axes: the length of its shadow on one axis, $a_1 = \mathbf a\cdot\mathbf e_1$.'
    chapter: '1.1'
    anchor: a-vector-is-an-arrow-and-its-components-are-its-shadows-on-three-axes
  - term: index
    definition: 'A small letter, such as $i$ in $a_i$, that stands for any one of the three directions 1, 2 and 3.'
    chapter: '1.1'
    anchor: an-index-stands-for-all-three-directions
  - term: summation convention
    definition: 'The rule, introduced by Einstein, that an index appearing twice in one product is summed over its three values, so that $a_ib_i$ means $a_1b_1 + a_2b_2 + a_3b_3$.'
    chapter: '1.1'
    anchor: an-index-stands-for-all-three-directions
  - term: Kronecker delta
    definition: 'The table $\delta_{ij}$, equal to 1 when $i = j$ and 0 otherwise: the identity matrix. In a sum it replaces one index by another, $\delta_{ij}a_j = a_i$.'
    chapter: '1.1'
    anchor: an-index-stands-for-all-three-directions
  - term: free index
    definition: 'An index that appears once in each term of an equation. The equation then holds for each of its three values, so it is a list of three equations.'
    chapter: '1.1'
    anchor: a-table-of-nine-numbers-turns-one-arrow-into-another
  - term: dummy index
    definition: 'An index that appears twice in one term, and so is summed. Its letter can be changed without changing the sum.'
    chapter: '1.1'
    anchor: a-table-of-nine-numbers-turns-one-arrow-into-another
  - term: symmetric
    definition: 'Said of a table equal to its own transpose, $T_{ij} = T_{ji}$. A symmetric $3\times3$ table has six independent entries; the tidal tensor is one.'
    chapter: '1.1'
    anchor: the-trace-and-the-symmetric-and-antisymmetric-parts
  - term: antisymmetric
    definition: 'Said of a table that changes sign when its rows and columns are exchanged, $A_{ij} = -A_{ji}$. Its diagonal is zero, it has three independent entries, and it carries a vector, $w_k = \tfrac12\epsilon_{kij}A_{ij}$.'
    chapter: '1.1'
    anchor: the-trace-and-the-symmetric-and-antisymmetric-parts
  - term: outer product
    definition: 'The table $a_ib_j$ made from two vectors. Applied to a third vector $\mathbf c$, it gives $\mathbf a$ times the number $\mathbf b\cdot\mathbf c$.'
    chapter: '1.1'
    anchor: a-table-built-from-two-arrows
  - term: projector
    definition: 'A table that flattens every arrow onto a plane or a line and leaves arrows already there unchanged, such as $P_{ij} = \delta_{ij} - \hat n_i\hat n_j$, which removes the part along $\hat n$.'
    chapter: '1.1'
    anchor: a-table-built-from-two-arrows
  - term: orthogonal matrix
    definition: 'A matrix whose transpose is its inverse, $R^{\mathsf T}R = 1$. The table that describes turned axes is one, and it leaves lengths and angles unchanged.'
    chapter: '1.1'
    anchor: turning-the-axes-changes-the-components-not-the-arrow
  - term: cross product
    definition: 'The vector $\mathbf a\times\mathbf b$, at right angles to both $\mathbf a$ and $\mathbf b$, of length $|\mathbf a||\mathbf b|\sin\vartheta$, given by the right-hand rule. In components, $(\mathbf a\times\mathbf b)_i = \epsilon_{ijk}a_jb_k$.'
    chapter: '1.1'
    anchor: the-cross-product-is-written-with-the-levi-civita-symbol
  - term: cyclic order
    definition: 'One of the orders 1, 2, 3 and 2, 3, 1 and 3, 1, 2 of the three indices, each made from the last by moving the first number to the end.'
    chapter: '1.1'
    anchor: the-cross-product-is-written-with-the-levi-civita-symbol
  - term: Levi-Civita symbol
    definition: 'The table $\epsilon_{ijk}$ with $\epsilon_{123} = +1$: $+1$ for the cyclic orders of 1, 2, 3, $-1$ for the other orders, and 0 when two indices are equal. It writes cross products in index notation.'
    chapter: '1.1'
    anchor: the-cross-product-is-written-with-the-levi-civita-symbol
  - term: angular velocity
    definition: 'A vector along the axis of a turning body, by the right-hand rule, whose length is the angle turned per second. A point at position $\mathbf r$ moves with velocity $\boldsymbol\Omega\times\mathbf r$.'
    chapter: '1.1'
    anchor: the-ground-at-the-equator
  - term: flux
    definition: 'The amount of a field that crosses a surface: the part of the field perpendicular to each small patch, times the patch''s area, added over the surface. For gravity it is measured in m³ s⁻².'
    chapter: '1.3'
    anchor: flux-counts-how-much-field-crosses-a-surface
  - term: closed surface
    definition: 'A surface with no edge that encloses a region of space, such as a sphere, the six faces of a box, or the skin of a potato.'
    chapter: '1.3'
    anchor: flux-counts-how-much-field-crosses-a-surface
  - term: outward normal
    definition: 'At a point of a closed surface, the unit vector perpendicular to the surface that points out of the enclosed region.'
    chapter: '1.3'
    anchor: flux-counts-how-much-field-crosses-a-surface
  - term: surface integral
    definition: 'The sum of a quantity over the small patches of a surface, in the limit in which the patches become very small. The flux is a surface integral.'
    chapter: '1.3'
    anchor: flux-counts-how-much-field-crosses-a-surface
  - term: solid angle
    definition: 'How large a patch looks from a point: the area it covers on a sphere of radius 1 centred on the point. Measured in steradians; the whole sky is $4\pi$.'
    chapter: '1.3'
    anchor: solid-angle-measures-how-large-a-patch-looks
  - term: steradian
    definition: 'The unit of solid angle, a pure number: an area on a sphere of radius 1. The whole sphere of directions is $4\pi$ steradians.'
    chapter: '1.3'
    anchor: solid-angle-measures-how-large-a-patch-looks
  - term: "Gauss's law"
    definition: 'The flux of gravity out of any closed surface is $-4\pi G$ times the mass inside it, $\oint\mathbf g\cdot\mathrm{d}\mathbf A = -4\pi G M_{\mathrm{enc}}$. Mass outside the surface adds nothing.'
    chapter: '1.3'
    anchor: the-flux-out-of-a-closed-surface-counts-the-mass-inside
  - term: enclosed mass
    definition: 'The mass inside a closed surface. Gauss''s law says that it alone sets the flux of gravity out of the surface.'
    role: matter
    chapter: '1.3'
    anchor: the-flux-out-of-a-closed-surface-counts-the-mass-inside
  - term: divergence
    definition: 'The flux of a field out of a small region per unit of its volume, as the region shrinks to a point: $\nabla\cdot\mathbf g = \partial_i g_i$. Positive where more field leaves than enters.'
    chapter: '1.3'
    anchor: divergence-is-the-outflow-per-unit-volume
  - term: divergence theorem
    definition: 'The flux of a smooth vector field out of a closed surface equals the integral of its divergence over the region inside: $\oint_S\mathbf g\cdot\mathrm{d}\mathbf A = \int_V\nabla\cdot\mathbf g\,\mathrm{d}V$.'
    chapter: '1.3'
    anchor: the-divergence-theorem-adds-up-the-boxes
  - term: Laplacian
    definition: 'The sum of the three second derivatives of a function along the axes, $\nabla^2 f = \partial_i\partial_i f$: the divergence of its gradient. Of the potential, it is the trace of the tide.'
    chapter: '1.3'
    anchor: poissons-equation-is-gausss-law-at-every-point
  - term: "Poisson's equation"
    definition: 'The law $\nabla^2\Phi = 4\pi G\rho$: Gauss''s law at each point. The density at a point fixes how the potential curves there.'
    chapter: '1.3'
    anchor: poissons-equation-is-gausss-law-at-every-point
  - term: "Laplace's equation"
    definition: 'Poisson''s equation in empty space, $\nabla^2\Phi = 0$. It holds everywhere between a scene and the camera.'
    chapter: '1.3'
    anchor: poissons-equation-is-gausss-law-at-every-point
  - term: empty space
    definition: 'A region with no matter in it, where the density is zero and the potential obeys Laplace''s equation. The paper calls it vacuum.'
    chapter: '1.3'
    anchor: poissons-equation-is-gausss-law-at-every-point
  - term: delta function
    definition: 'The distribution $\delta^3(\mathbf x)$ defined by $\int\delta^3(\mathbf x) f(\mathbf x)\,\mathrm{d}^3x = f(0)$ for every smooth $f$. It is the density of a unit point mass at the origin.'
    chapter: '1.3'
    anchor: a-point-mass-is-density-gathered-at-one-point
  - term: distribution
    definition: 'A rule that turns each smooth function into a number, in the way that integrating against an ordinary density does. The delta function is the rule that turns $f$ into $f(0)$.'
    chapter: '1.3'
    anchor: a-point-mass-is-density-gathered-at-one-point
  - term: spherically symmetric
    definition: 'Unchanged by every rotation about a centre. A body is spherically symmetric when its density depends only on the distance from its centre.'
    chapter: '1.3'
    anchor: outside-a-round-body-only-its-mass-counts
  - term: shell theorem
    definition: 'The field of a spherically symmetric body at the distance $r$ from its centre is that of a point mass at the centre holding all the mass within $r$. A shell and a ball of equal mass pull alike outside, and a hollow shell has no field inside.'
    chapter: '1.3'
    anchor: outside-a-round-body-only-its-mass-counts
  - term: moment of inertia
    definition: 'How hard it is to set a body spinning about an axis: the sum of each piece''s mass times the square of its distance from the axis. A uniform ball has $0.4\,MR^2$; the Earth, denser toward its centre, has $0.331\,MR^2$.'
    chapter: '1.3'
    anchor: the-outside-of-the-earth-cannot-tell-a-core-from-a-uniform-ball
  - term: surface density
    definition: 'The mass per unit area of a thin layer, in kilograms per square metre. A uniform infinite sheet pulls with $2\pi G\sigma$ at every height.'
    role: matter
    chapter: '1.3'
    anchor: a-uniform-sheet-pulls-equally-at-every-height
  - term: pillbox
    definition: 'A short cylinder that stands across a sheet, used as the closed surface in Gauss''s law to find the field of the sheet.'
    chapter: '1.3'
    anchor: a-uniform-sheet-pulls-equally-at-every-height
  - term: independent component
    definition: 'One of a set of numbers that can each be chosen freely and that together fix a table. A symmetric $3\times3$ table has six; one that is also trace-free has five.'
    chapter: '1.5'
    anchor: a-tidal-table-is-symmetric-so-six-numbers-are-enough
  - term: eigen-axes
    definition: 'The three directions, at right angles, of the eigenvectors of a symmetric table. Along each, a tide is a pure stretch or a pure squeeze, and in axes along them the table is diagonal.'
    chapter: '1.5'
    anchor: the-same-five-numbers-counted-by-axes-and-strengths
  - term: trace part
    definition: 'The part $\tfrac13\delta_{ij}T_{kk}$ of a symmetric table, which treats every direction alike. For a tide it changes the volume of a cloud of free dust and not its shape.'
    chapter: '1.5'
    anchor: every-symmetric-table-splits-into-a-part-that-changes-size-and-a-part-that-changes-shape
  - term: trace-free part
    definition: 'What is left of a symmetric table when its trace part is removed, $T_{ij} - \tfrac13\delta_{ij}T_{kk}$. For a tide it changes the shape of a cloud of free dust and not its volume.'
    chapter: '1.5'
    anchor: every-symmetric-table-splits-into-a-part-that-changes-size-and-a-part-that-changes-shape
  - term: contraction
    definition: 'The dot product of two tables, $D\!:\!T = D_{ij}T_{ij}$, the sum of the products of their matching entries. It does not change when the axes turn.'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - term: Frobenius norm
    definition: 'The length of a table, $|T| = \sqrt{T_{ij}T_{ij}}$. For a symmetric trace-free table it is the length of the arrow made by its five coefficients.'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - term: orthonormal basis
    definition: 'A set of tables (or arrows) of length one, each at right angles to the others in the sense of the contraction, from which every table of the kind can be built. Five tables $b^A$ form one for the symmetric trace-free tables.'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - term: coefficient
    definition: 'The component of a table along one table of a basis, read off by contraction: $c_A = b^A_{ij}T_{ij}$.'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - term: tidal weight
    definition: 'The table $\delta_{ij} - 3\hat n_i\hat n_j$ with which matter in the direction $\hat n$ adds to the tide at the pixel. It averages to zero over the sky.'
    chapter: '1.5'
    anchor: averaged-over-the-sky-the-tidal-weight-vanishes
  - term: tidal column
    definition: 'The mass along one line of sight from the pixel, each part weighted by the inverse of its distance, $S(\hat n) = \int\rho\,\mathrm{d}r/r$, in kg m⁻³. A pixel reads only its quadrupole over the whole sky.'
    chapter: '1.5'
    anchor: averaged-over-the-sky-the-tidal-weight-vanishes
  - term: isotropic
    definition: 'Said of a table whose entries are the same in every set of turned axes, such as $\delta_{ij}$, $\int\hat n_i\hat n_j\,\mathrm{d}\Omega$ and $\Pi_{ijkl}$.'
    chapter: '1.5'
    anchor: the-average-over-the-sky-by-symmetry-and-in-full
  - term: degree
    definition: 'The number of indices of a symmetric table, and of the pattern it makes on the sky. A trace-free table of degree $\ell$ holds $2\ell + 1$ numbers.'
    chapter: '1.5'
    anchor: patterns-of-higher-degree-hold-7-9-and-more-numbers
  - term: dipole
    definition: 'A pattern on the sky of degree 1, $\mathbf a\cdot\hat n$, larger on one side than on the opposite side. It holds three numbers.'
    chapter: '1.5'
    anchor: patterns-of-higher-degree-hold-7-9-and-more-numbers
  - term: quadrupole
    definition: 'A pattern on the sky of degree 2, $\hat n_iT_{ij}\hat n_j$ with $T$ symmetric and trace-free, the same in opposite directions. It holds five numbers; a pixel reads the quadrupole of the tidal column.'
    chapter: '1.5'
    anchor: patterns-of-higher-degree-hold-7-9-and-more-numbers
  - term: momentum
    definition: 'Mass times velocity, $\mathbf p = m\mathbf v$, in kg m s⁻¹. A force changes it at the rate $\mathbf F = \mathrm d\mathbf p/\mathrm dt$.'
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - term: "Newton's third law"
    definition: 'When two bodies act on each other, the force of the first on the second is equal in size and opposite in direction to the force of the second on the first.'
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - term: centre of mass
    definition: 'The average of the positions of the parts of a body, each weighted by its mass. It moves as one particle of the whole mass, pushed only by outside forces.'
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - term: conservation of momentum
    definition: 'The total momentum of a system that no outside force acts on stays the same, because the forces between its parts cancel in pairs.'
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - term: mass dipole
    definition: 'The integral $\int\rho\,\mathbf x\,\mathrm dV = M\mathbf x_{\rm cm}$ of a body, in kg m. It vanishes about the centre of mass, so the field of a body described about that point has no dipole part.'
    role: matter
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - term: conservation of energy
    definition: 'For a body that only gravity acts on, the kinetic energy plus the potential energy, $\tfrac12mv^2 + m\Phi$, stays the same.'
    chapter: '1.6'
    anchor: work-changes-kinetic-energy-and-a-steady-field-keeps-the-energy-fixed
  - term: impulse
    definition: 'The integral of a force over the time it acts, $\mathbf J = \int\mathbf F\,\mathrm dt$, equal to the change of momentum.'
    chapter: '1.6'
    anchor: work-changes-kinetic-energy-and-a-steady-field-keeps-the-energy-fixed
  - term: angular momentum
    definition: 'The moment of momentum about a point, $\mathbf L = \mathbf x\times\mathbf p$, in kg m² s⁻¹. Torque changes it.'
    chapter: '1.6'
    anchor: angular-momentum-stays-fixed-when-the-force-points-at-a-centre
  - term: torque
    definition: 'How strongly a force twists a body about a point: $\mathbf x\times\mathbf F$, in newton metres. It is the rate of change of angular momentum.'
    chapter: '1.6'
    anchor: angular-momentum-stays-fixed-when-the-force-points-at-a-centre
  - term: central force
    definition: 'A force that points along the line from a body to a fixed centre, toward it or away from it. It exerts no torque about the centre, so it keeps the angular momentum fixed.'
    chapter: '1.6'
    anchor: angular-momentum-stays-fixed-when-the-force-points-at-a-centre
  - term: conservation of angular momentum
    definition: 'The total angular momentum of a system that nothing outside twists stays the same in size and direction.'
    chapter: '1.6'
    anchor: angular-momentum-stays-fixed-when-the-force-points-at-a-centre
  - term: gyroscope
    definition: 'A wheel spun fast about its axis of symmetry on bearings that twist it as little as possible. Its axis keeps its direction relative to the distant stars, so it holds a frame from turning.'
    chapter: '1.6'
    anchor: angular-momentum-stays-fixed-when-the-force-points-at-a-centre
  - term: rigid body
    definition: 'A body whose parts keep their distances from one another. When it turns with angular velocity $\boldsymbol\Omega$, each point moves at $\boldsymbol\Omega\times\mathbf x$.'
    chapter: '1.6'
    anchor: a-turning-body-keeps-the-spread-of-its-mass-in-a-table-of-inertia
  - term: inertia tensor
    definition: 'The symmetric table $I_{ij} = \int\rho\,(r^2\delta_{ij} - x_ix_j)\,\mathrm dV$, in kg m², that gives a turning rigid body''s angular momentum, $L_i = I_{ij}\Omega_j$, and its kinetic energy, $\tfrac12\Omega_iI_{ij}\Omega_j$.'
    chapter: '1.6'
    anchor: a-turning-body-keeps-the-spread-of-its-mass-in-a-table-of-inertia
  - term: principal axes
    definition: 'The three perpendicular eigenvectors of a body''s inertia tensor. Spun about one of them, the body has its angular momentum along the axis.'
    chapter: '1.6'
    anchor: a-turning-body-keeps-the-spread-of-its-mass-in-a-table-of-inertia
  - term: moment-of-inertia factor
    definition: 'The moment of inertia of a round body divided by $MR^2$: 0.4 for a uniform ball, $\tfrac23$ for a thin shell, 0.3307 for the Earth. The smaller it is, the more of the mass lies near the centre.'
    chapter: '1.6'
    anchor: a-round-body-has-the-same-moment-about-every-axis
  - term: harmonic function
    definition: 'A function $h$ with $\nabla^2h = 0$, a solution of Laplace''s equation. The field outside a body is built only from the integrals of its density against harmonic functions.'
    chapter: '1.6'
    anchor: the-moment-of-inertia-tells-a-cored-planet-from-a-uniform-one
  - term: inertial frame
    definition: 'A frame in which a body that nothing pushes or pulls keeps its speed and its direction. Its axes do not turn relative to the distant stars.'
    chapter: '1.6'
    anchor: in-a-turning-frame-two-extra-accelerations-appear
  - term: turning frame
    definition: 'A frame whose axes turn at an angular velocity $\boldsymbol\Omega$ relative to an inertial frame, such as a laboratory on the turning Earth.'
    chapter: '1.6'
    anchor: in-a-turning-frame-two-extra-accelerations-appear
  - term: Coriolis acceleration
    definition: 'The acceleration $-2\boldsymbol\Omega\times\mathbf v$ that a body moving with velocity $\mathbf v$ in a turning frame appears to have, at right angles to its motion. For 1 m/s on the Earth it is about $1.5\times10^{-4}\,\mathrm{m\,s^{-2}}$.'
    chapter: '1.6'
    anchor: in-a-turning-frame-two-extra-accelerations-appear
  - term: centrifugal acceleration
    definition: 'The acceleration $\Omega^2\mathbf x_\perp$ that every body in a turning frame appears to have, straight away from the axis and growing with the distance from it: $0.034\,\mathrm{m\,s^{-2}}$ on the equator.'
    chapter: '1.6'
    anchor: in-a-turning-frame-two-extra-accelerations-appear
  - term: complex number
    definition: 'A number $u = x + iy$, with $x$ and $y$ ordinary numbers and $i^2 = -1$. It is a point of a plane that can be multiplied by another such point.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - term: real part
    definition: 'The ordinary number $x$ in the complex number $u = x + iy$, written $\mathrm{Re}\,u$.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - term: imaginary part
    definition: 'The ordinary number $y$ in the complex number $u = x + iy$, written $\mathrm{Im}\,u$.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - term: complex plane
    definition: 'The plane in which the complex number $x + iy$ is drawn as the point $(x, y)$: 1 is one step along the first axis and $i$ one step along the second.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - term: modulus
    definition: 'The distance $|u| = \sqrt{x^2 + y^2}$ of the complex number $u = x + iy$ from the centre of the complex plane.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - term: argument
    definition: 'The angle $\arg u$ of a complex number, measured anticlockwise from the positive real axis and fixed only up to whole turns. Multiplying two complex numbers adds their arguments.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - term: complex conjugate
    definition: 'The mirror image $u^* = x - iy$ of $u = x + iy$ in the real axis, also written $\bar u$. A number times its conjugate is the square of its modulus.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - term: "Euler's formula"
    definition: '$e^{i\theta} = \cos\theta + i\sin\theta$: the complex number of modulus 1 and argument $\theta$ is an exponential, so turns combine by multiplication.'
    chapter: '1.5b'
    anchor: eulers-formula-a-turn-is-an-exponential
  - term: polar form
    definition: 'A complex number written by its modulus and argument, $u = re^{i\theta}$. For example $3 + 4i = 5e^{0.927i}$.'
    chapter: '1.5b'
    anchor: eulers-formula-a-turn-is-an-exponential
  - term: phasor
    definition: 'The fixed complex number $\tilde q = Ae^{i\alpha}$ that holds the amplitude and the phase of a steady oscillation, $q(t) = \mathrm{Re}[\tilde q\,e^{-i\omega t}]$, in the paper''s sign convention.'
    chapter: '1.5b'
    anchor: a-steady-oscillation-is-a-turning-complex-number
  - term: spin
    definition: 'In this tutorial, the power $n$ of $e^{-i\theta}$ by which a quantity is multiplied when the axes turn by $\theta$ about an axis that points toward the viewer, anticlockwise as the viewer sees them. An arrow has spin one, a pattern of stretch and squeeze spin two.'
    chapter: '1.5b'
  - term: shear
    definition: 'The part of a tide in a plane that changes the shape of a ring, held as one complex number, $s = (\mathcal E_{xx} - \mathcal E_{yy}) + 2i\,\mathcal E_{xy}$.'
    role: curv
    chapter: '1.5b'
  - term: polarization
    definition: 'One of the independent patterns of a wave across its direction of travel. Light has two, arrows 90° apart; a gravitational wave has two, patterns of stretch and squeeze 45° apart.'
    chapter: '1.5b'
  - term: zero of a field
    definition: 'A point where the field vanishes. The zeros of the shear above two equal buried masses stand exactly as far apart as the masses.'
    chapter: '1.5b'
    anchor: where-the-shear-vanishes-its-axes-make-half-a-turn-round-the-zero
  - term: phase winding
    definition: 'The number of whole turns that the phase of a complex field makes along a small circle round one of its zeros. Round a zero of the shear the phase turns once, so the axes of stretch and squeeze turn by half a turn.'
    chapter: '1.5b'
    anchor: where-the-shear-vanishes-its-axes-make-half-a-turn-round-the-zero
  - term: complex vector
    definition: 'A vector whose three components are complex numbers, such as $\mathbf m = (1, i, 0)/\sqrt2$.'
    chapter: '1.5b'
    anchor: complex-vectors-a-direction-whose-square-is-zero
  - term: Hermitian product
    definition: 'The product $\mathbf a\cdot\mathbf b^* = a_ib_i^*$ of two complex vectors, with the second conjugated. Its value for $\mathbf a$ with itself is the square of the length of $\mathbf a$.'
    chapter: '1.5b'
    anchor: complex-vectors-a-direction-whose-square-is-zero
  - term: null vector
    definition: 'A complex vector that is not zero but whose dot product with itself, taken without a conjugate, is zero, such as $\mathbf m = (1, i, 0)/\sqrt2$.'
    chapter: '1.5b'
    anchor: complex-vectors-a-direction-whose-square-is-zero
  - term: gravitational wave
    definition: 'A ripple in space, sent out by moving masses, that travels at the speed of light and stretches and squeezes everything it passes through.'
    chapter: '0.1'
  - term: magnetic part
    definition: 'The second kind of tide, made by moving masses. It does not stretch or squeeze; it turns gyroscopes at neighbouring points slightly relative to one another. In empty space it is five numbers.'
    role: curv
    chapter: '0.1'
    anchor: the-tide-at-a-point-is-a-table-of-numbers-ten-in-all
  - term: near field
    definition: 'The region close to a source, within about a sixth of the wavelength it would radiate ($r \ll \lambda/2\pi$), where its tide follows it at once and falls at least as fast as one over the distance cubed. Also called the near zone.'
    chapter: '0.1'
    anchor: near-a-source-a-pixel-feels-its-pull-and-far-away-its-waves
  - term: wave zone
    definition: 'The region far from a source, beyond about a sixth of its wavelength, where its tide arrives as a gravitational wave and falls as one over the distance.'
    chapter: '0.1'
    anchor: near-a-source-a-pixel-feels-its-pull-and-far-away-its-waves
  - term: thermal glow
    definition: 'The gravitational waves sent out by the jiggling atoms of warm matter, at very high frequencies. For a body at 300 K the glow, counted per unit frequency, peaks at $1.76 \times 10^{13}$ Hz, a wavelength of 17 μm.'
    chapter: '0.1'
    anchor: near-a-source-a-pixel-feels-its-pull-and-far-away-its-waves
  - term: graviton
    definition: 'The smallest packet of gravitational-wave energy, as the photon is of light.'
    chapter: '0.3'
    anchor: only-a-changing-lopsidedness-sends-out-waves
  - term: compactness
    definition: 'Newton''s constant times a body''s mass, divided by its radius and by the square of the speed of light, $GM/Rc^2$: a pure number that says how strongly the body curves space. About $7 \times 10^{-10}$ for the Earth and one half at a black hole''s horizon.'
    chapter: '0.4'
    anchor: no-lens-can-be-made-so-the-camera-computes-its-pictures
  - term: line of sight
    definition: 'The straight line from the camera in one direction. In the near field, the picture in each direction shows the mass along that line, each part weighted by one over its distance.'
    chapter: '0.2'
    anchor: the-camera-weighs-what-it-sees-through-anything
  - term: blind spot
    definition: 'Two scenes that the camera cannot tell apart at any sensitivity, such as a hollow shell and a solid ball of the same mass seen from outside.'
    chapter: '0.2'
    anchor: the-outside-of-a-body-does-not-settle-its-inside
  - term: evanescent
    definition: 'Fading with distance as $e^{-kz}$: in empty space, a ripple of the pull with crests $2\pi/k$ apart weakens this way with the height $z$, so fine detail fades fastest.'
    chapter: '0.2'
    anchor: fine-detail-fades-with-distance-much-faster-than-coarse-detail
  - term: noise
    definition: 'Small random changes in an instrument''s reading that are present even when there is nothing to measure.'
    chapter: '0.2'
    anchor: the-blur-shrinks-only-with-the-number-of-digits-of-the-sensitivity
  - term: signal-to-noise ratio
    definition: 'The size of a signal divided by the typical size of the noise, a pure number. Chapter 3.7 gives the exact form the paper uses for the near-field camera.'
    chapter: '0.2'
    anchor: the-blur-shrinks-only-with-the-number-of-digits-of-the-sensitivity
  - term: blur
    definition: 'The width of the camera''s best picture of a single point, as an angle seen from the camera. In the near field it is 24° at a signal-to-noise ratio of a thousand.'
    chapter: '0.2'
    anchor: the-blur-shrinks-only-with-the-number-of-digits-of-the-sensitivity
  - term: bit
    definition: 'The answer to one yes-or-no question, the unit of information.'
    chapter: '0.2'
    anchor: a-blurred-picture-can-still-give-a-precise-measurement
  - term: quadrupole moment
    definition: 'The measure of how far a body''s mass is drawn out along some axis, like a rugby ball or a dumbbell, rather than spread evenly as in a sphere. A body sends out gravitational waves when its quadrupole moment changes.'
    chapter: '0.3'
    anchor: only-a-changing-lopsidedness-sends-out-waves
  - term: diffraction limit
    definition: 'The rule that a wave cannot show details much smaller than its own wavelength. A camera of width $D$ resolves angles of about $\lambda/D$.'
    chapter: '0.3'
    anchor: a-slow-body-is-far-smaller-than-its-waves-so-it-is-a-point
  - term: circular polarization
    definition: 'A wave whose pattern of stretch and squeeze turns round as it passes, as the wave of a turning pair does when seen along its axis.'
    chapter: '0.3'
    anchor: a-point-still-shows-which-way-it-turns
  - term: linear polarization
    definition: 'A wave whose pattern of stretch and squeeze only pulses along fixed directions, as the wave of a turning pair does when seen edge-on.'
    chapter: '0.3'
    anchor: a-point-still-shows-which-way-it-turns
  - term: circular fraction
    definition: 'The share of a wave''s signal that is circularly polarized, $V/I$, a pure number between $-1$ and $+1$. Its sign gives the sense in which the source turns, and its size the tilt of the axis.'
    chapter: '0.3'
    anchor: a-point-still-shows-which-way-it-turns
  - term: viscosity
    definition: 'The internal friction with which matter resists the sliding of neighbouring layers past one another, measured in pascal seconds. Water''s everyday viscosity is about $10^{-3}$ Pa s.'
    chapter: '0.3'
    anchor: matter-is-transparent-so-warm-matter-glows-throughout
  - term: "Kirchhoff's law"
    definition: 'The rule that a body which absorbs a kind of radiation also gives it off when it is warm, and the better it absorbs, the more it gives off.'
    chapter: '0.3'
    anchor: matter-is-transparent-so-warm-matter-glows-throughout
  - term: picture element
    definition: 'One part of a picture that can be told apart from its neighbours. In a picture made by counting gravitons, each needs about 2500 counts for a ten per cent difference to stand five standard deviations above the counting noise.'
    chapter: '0.3'
    anchor: a-first-image-the-sun-at-midnight-and-how-few-gravitons-arrive
  - term: orbit
    definition: 'The path of a body that moves round another under gravity alone. A circle, an ellipse, or, for a body that is not caught, an open curve.'
    chapter: '1.8'
    anchor: a-circular-orbit-is-a-fall-that-keeps-missing
  - term: period
    definition: 'The time a repeating motion takes to come back to where it started: for an orbit, the time of one turn.'
    chapter: '1.8'
    anchor: a-circular-orbit-is-a-fall-that-keeps-missing
  - term: "Kepler's third law"
    definition: 'The square of the period of an orbit is proportional to the cube of its size: $T = 2\pi\sqrt{a^3/GM}$.'
    chapter: '1.8'
    anchor: a-circular-orbit-is-a-fall-that-keeps-missing
  - term: "Kepler's second law"
    definition: 'The line from the centre to an orbiting body sweeps equal areas in equal times, at the rate $L/2m$. It holds for every central force.'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - term: "Kepler's first law"
    definition: 'Under gravity alone a bound orbit is an ellipse with the central mass at one focus.'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - term: bound
    definition: 'A body or system is bound when its total energy is negative, so that no part can escape to a great distance.'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - term: escape speed
    definition: 'The speed at which a bodys total energy is zero, $\sqrt{2GM/r}$; at the Earths surface $11.2\,\mathrm{km\,s^{-1}}$.'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - term: semi-major axis
    definition: 'Half the longest diameter of an elliptical orbit. It alone fixes the orbits energy and period.'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - term: eccentricity
    definition: 'The pure number that fixes the shape of an orbit: 0 for a circle, between 0 and 1 for an ellipse, 1 or more for an open orbit.'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - term: flyby
    definition: 'An encounter in which a mass arrives from far away, passes a body and leaves again.'
    chapter: '1.8'
    anchor: a-fast-passing-mass-gives-every-part-of-a-body-a-sideways-kick
  - term: impact parameter
    definition: 'The distance between a point and the straight line along which a passing mass moves.'
    chapter: '1.8'
    anchor: a-fast-passing-mass-gives-every-part-of-a-body-a-sideways-kick
  - term: impulse approximation
    definition: 'Treating a fast pass as a set of sudden kicks: the passing mass moves on a straight line, and the parts of the body it passes do not move until it has gone.'
    chapter: '1.8'
    anchor: a-fast-passing-mass-gives-every-part-of-a-body-a-sideways-kick
  - term: projected surface density
    definition: 'The density of a body added up along a direction, in kilograms per square metre: the mass that lies over each point of a plane at right angles to it.'
    role: matter
    chapter: '1.8'
    anchor: what-a-pass-leaves-inside-a-body-is-a-weighted-sum-of-its-projected-mass
  - term: recoil
    definition: 'The kinetic energy of a body moving as a whole, $\tfrac12MV_{\rm cm}^2$, as distinct from the motion of its parts relative to its centre of mass.'
    chapter: '1.8'
    anchor: what-a-pass-leaves-inside-a-body-is-a-weighted-sum-of-its-projected-mass
  - term: internal energy
    definition: 'The kinetic energy of the parts of a body relative to its centre of mass: the total kinetic energy minus the recoil.'
    chapter: '1.8'
    anchor: what-a-pass-leaves-inside-a-body-is-a-weighted-sum-of-its-projected-mass
  - term: virial theorem
    definition: 'For a bound system held by gravity, twice the time average of the kinetic energy equals minus the time average of the potential energy, $2\langle K\rangle = -\langle U\rangle$. Chapter 1.8 states it; chapter 12.1 derives it.'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - term: state
    definition: 'Everything needed to predict the motion of a system, given the forces: the position and the momentum of each of its parts.'
    chapter: '1.7'
    anchor: a-state-is-a-position-and-a-momentum
  - term: phase space
    definition: 'The space of all states of a system, with one axis for each coordinate and one for each momentum: $6N$ axes for $N$ particles. The state at one moment is a point in it, and its motion a curve.'
    chapter: '1.7'
    anchor: a-state-is-a-position-and-a-momentum
  - term: Hamiltonian
    definition: 'The energy of a system written as a function of its positions and momenta, $H$, in joules. For a cart on a spring, $p^2/2m + \tfrac12kq^2$.'
    chapter: '1.7'
    anchor: a-state-is-a-position-and-a-momentum
  - term: action
    definition: 'A quantity measured in joule seconds, an energy times a time. The area that a periodic motion encloses in phase space is one: $2\pi E/\omega$ for an oscillator.'
    chapter: '1.7'
    anchor: a-state-is-a-position-and-a-momentum
  - term: "Hamilton's equations"
    definition: 'The laws of motion in phase space, $\dot q = \partial H/\partial p$ and $\dot p = -\partial H/\partial q$. For particles in a potential they are Newton''s second law, written as two equations of first order.'
    chapter: '1.7'
    anchor: hamiltons-equations-are-newtons-law-split-in-two
  - term: Poisson bracket
    definition: 'The combination $\{F, G\} = \sum_a(\partial F/\partial\mathbf x_a\cdot\partial G/\partial\mathbf p_a - \partial F/\partial\mathbf p_a\cdot\partial G/\partial\mathbf x_a)$ of two quantities. Any quantity changes in time at the rate $\{F, H\}$.'
    chapter: '1.7'
    anchor: the-poisson-bracket-gives-the-rate-of-change-of-anything
  - term: generator
    definition: 'A quantity $G$ read as the source of a motion of the state, along which every quantity changes at the rate $\mathrm dF/\mathrm ds = \{F, G\}$. The energy generates motion in time, the momentum a slide, the angular momentum a turn.'
    chapter: '1.7'
    anchor: every-quantity-generates-a-motion-and-a-symmetry-gives-a-constant
  - term: constant of motion
    definition: 'A quantity that stays the same along every motion of a system. A quantity is one exactly when its Poisson bracket with the energy is zero.'
    chapter: '1.7'
    anchor: every-quantity-generates-a-motion-and-a-symmetry-gives-a-constant
  - term: symmetry
    definition: 'A motion of the state that leaves the energy of a system unchanged, such as a slide of every part when the forces depend only on differences of positions.'
    chapter: '1.7'
    anchor: every-quantity-generates-a-motion-and-a-symmetry-gives-a-constant
  - term: "Noether's theorem"
    definition: 'Each symmetry of a system gives a constant of motion, its generator. In Hamilton''s form: $G$ is constant exactly when $\{G, H\} = 0$, which is exactly when the motion $G$ generates leaves $H$ unchanged.'
    chapter: '1.7'
    anchor: every-quantity-generates-a-motion-and-a-symmetry-gives-a-constant
  - term: generators of rotation
    definition: 'The three fixed tables $(L_k)_{ij} = -\epsilon_{kij}$. A small turn changes an arrow by $\delta a_i = \theta_k(L_k)_{ij}a_j = (\boldsymbol\theta\times\mathbf a)_i$, and a finite one is $\exp(\theta\,\hat u\cdot L)$.'
    chapter: '1.7'
    anchor: every-quantity-generates-a-motion-and-a-symmetry-gives-a-constant
  - term: kick
    definition: 'A force that acts for so short a time that the body does not move while it acts. A kick of impulse $\mathbf J$ changes the kinetic energy by $\mathbf v\cdot\mathbf J + J^2/2m$.'
    chapter: '1.7'
    anchor: a-sudden-kick-changes-the-kinetic-energy-in-two-parts
  - term: impulsive tide
    definition: 'A tide that acts for an instant, with the potential $-\epsilon\,g(\mathbf x)\,\delta(t)$. It gives each part of a body the impulse $\epsilon m\nabla g$ where it stands and leaves the energy $\epsilon\dot Q_g + \tfrac12\epsilon^2\int\rho|\nabla g|^2\,\mathrm dV$.'
    chapter: '1.7'
    anchor: an-impulsive-tide-is-the-motion-generated-by-a-moment-of-the-mass
  - term: moment of the mass
    definition: 'The integral $Q_h = \int\rho\,h\,\mathrm dV$ of a body''s density against a function $h$. For $h$ harmonic these are the numbers that the steady field outside the body holds.'
    chapter: '1.7'
    anchor: an-impulsive-tide-is-the-motion-generated-by-a-moment-of-the-mass
  - term: SI units
    definition: 'The international system of units, built on the metre, the kilogram and the second. The paper uses it throughout and writes the constants $G$, $c$, $\hbar$ and $k_B$ out in every formula.'
    chapter: '0.6'
    anchor: every-number-says-what-it-measures-in-what-unit-and-against-what
  - term: electronvolt
    definition: 'The energy an electron gains in crossing one volt, $1\,\mathrm{eV} = 1.602 \times 10^{-19}\,\mathrm{J}$. It is the typical energy of heat, $k_BT$, at 11,600 K.'
    chapter: '0.6'
    anchor: every-number-says-what-it-measures-in-what-unit-and-against-what
  - term: angular frequency
    definition: 'A rate counted in radians per second, $2\pi$ times the number of cycles per second. The $k_BT$ of 300 K divided by $\hbar$ is the angular frequency $3.9 \times 10^{13}\,\mathrm{s^{-1}}$, or $6 \times 10^{12}$ cycles a second.'
    chapter: '0.6'
    anchor: every-number-says-what-it-measures-in-what-unit-and-against-what
  - term: scientific notation
    definition: 'A way of writing a number as a number between 1 and 10 times a power of ten, as $9.3 \times 10^{-9}$ for 0.0000000093.'
    chapter: '0.6'
    anchor: powers-of-ten-turn-the-widest-ranges-into-steps
  - term: order of magnitude
    definition: 'A factor of ten, one step on a scale of powers of ten. The person''s tide is between four and five orders of magnitude larger than the Moon''s.'
    chapter: '0.6'
    anchor: powers-of-ten-turn-the-widest-ranges-into-steps
  - term: astronomical unit
    definition: 'The mean distance from the Earth to the Sun, $1\,\mathrm{AU} = 1.496 \times 10^{11}\,\mathrm{m}$, which light crosses in 499 seconds.'
    chapter: '0.6'
    anchor: the-sky-has-its-own-units
  - term: light-year
    definition: 'The distance light travels in a year, $9.46 \times 10^{15}\,\mathrm{m}$.'
    chapter: '0.6'
    anchor: the-sky-has-its-own-units
  - term: parsec
    definition: 'An astronomer''s unit of distance, $1\,\mathrm{pc} = 3.26$ light-years $= 3.09 \times 10^{16}\,\mathrm{m}$. A kiloparsec, kpc, is a thousand parsecs.'
    chapter: '0.6'
    anchor: the-sky-has-its-own-units
  - term: solar mass
    definition: 'The mass of the Sun, $M_\odot = 1.989 \times 10^{30}\,\mathrm{kg}$, used as a unit for stars and black holes.'
    chapter: '0.6'
    anchor: the-sky-has-its-own-units
  - term: magnitude
    definition: 'In astronomy, a measure of brightness on a scale where five magnitudes are a factor of 100 and a larger magnitude is fainter. Thirty magnitudes are a factor of $10^{12}$.'
    chapter: '0.6'
    anchor: the-sky-has-its-own-units
  - term: symbol collision
    definition: 'One letter used for two different quantities, such as $\rho$ for a density and, in Section VIII of the paper, for a signal-to-noise ratio. The unit and the section tell them apart.'
    chapter: '0.6'
    anchor: each-symbol-has-one-meaning-with-a-few-known-collisions
  - term: limit
    definition: 'In reading an equation, the value it gives when one input grows very large or very small. Taking a limit, or a special case whose answer is known, is the fourth step of reading an equation.'
    chapter: '0.6'
    anchor: an-equation-can-be-read-before-it-is-derived
  - term: route
    definition: 'One of the tutorial''s named paths: the chapters to read, in order, to reach one part of the paper. The routes are listed on the tutorial''s home page.'
    chapter: '0.6'
    anchor: routes-lead-through-the-tutorial-to-each-part-of-the-paper
  - term: depth
    definition: 'How fully a chapter treats a result. Depth A: derived in full. Depth B: sketched, with what the sketch skips named. Depth C: stated and explained, without proof.'
    chapter: '0.6'
    anchor: routes-lead-through-the-tutorial-to-each-part-of-the-paper
  - term: gravitational lens
    definition: 'A mass that bends passing light, or passing gravitational waves, by its gravity, used to bring them to a focus. Only a body as compact as a black hole bends strongly enough to make a useful one.'
    chapter: '0.4'
    anchor: no-lens-can-be-made-so-the-camera-computes-its-pictures
  - term: beamforming
    definition: 'Forming the picture in one direction by shifting the record of each sensor in an array by the delay with which a wave from that direction reaches it, and adding the records, so that waves from that direction add in step and others cancel. Its sharpness is about the wavelength over the width of the array.'
    chapter: '0.4'
    anchor: no-lens-can-be-made-so-the-camera-computes-its-pictures
  - term: spin two
    definition: 'The behaviour of a pattern of stretch and squeeze under turning: a half turn gives it back, a quarter turn swaps stretch and squeeze, and an eighth of a turn changes plus into cross. An arrow, which a half turn reverses, has spin one.'
    chapter: '0.4'
    anchor: ten-numbers-are-more-than-one-wave-needs
  - term: invariant
    definition: 'A combination of a field''s components that every observer at the same point finds the same, however the observer is turned and however it moves. The ten numbers of a pixel give four.'
    chapter: '0.4'
    anchor: the-ten-numbers-regroup-into-four-invariants-three-angles-and-a-velocity
  - term: rest frame of a field
    definition: 'The frame of the one observer for whom the stretch and the twist of the field at a point line up along the same axes. Three of a pixel''s ten numbers give its velocity; for masses at rest it is their frame.'
    chapter: '0.4'
    anchor: the-ten-numbers-regroup-into-four-invariants-three-angles-and-a-velocity
  - term: principal null directions
    definition: 'Four directions on the sky around a point along which the gravitational field there takes its simplest form. They all coincide for a single wave and fall in two pairs for a single round body at rest; light has two.'
    chapter: '0.4'
    anchor: four-special-directions-sort-every-reading
  - term: Petrov classification
    definition: 'The sorting of gravitational fields at a point by the pattern of their four principal null directions: type N for one wave, type D for one round body, type I when all four are separate.'
    chapter: '0.4'
    anchor: four-special-directions-sort-every-reading
  - term: aberration
    definition: 'The shift between where a moving body is now and where its light shows it, about its speed across the line of sight divided by the speed of light, in radians. The tide of a steadily moving body shows no such shift.'
    chapter: '0.4'
    anchor: the-field-shows-a-moving-body-where-it-is-now
  - term: multipole moments
    definition: 'The list of weighted totals of a body''s mass that its field outside depends on at any one time: the total mass, the place of its centre, its quadrupole moment and finer details, each step reaching a camera weaker by the body''s size over its distance.'
    chapter: '0.5'
    anchor: one-reading-shows-only-a-list-of-weighted-totals
  - term: hair
    definition: 'Any detail of a body that its gravitational field outside could show, beyond its mass, its spin and its electric charge. By the no-hair theorem a black hole has none.'
    chapter: '0.5'
    anchor: the-list-is-short-and-a-black-holes-is-the-shortest
  - term: first order
    definition: 'Said of an effect that grows in proportion to a small quantity: the pull of a body on a small mass doubles when the small mass doubles.'
    chapter: '0.5'
    anchor: the-bodys-reply-to-a-pull-reveals-its-inside
  - term: second order
    definition: 'Said of an effect that grows as the square of a small quantity: the energy a small mass leaves in a body quadruples when the small mass doubles. The shell theorem holds at first order only.'
    chapter: '0.5'
    anchor: the-bodys-reply-to-a-pull-reveals-its-inside
  - term: quadrupolar tide
    definition: 'The tide of a distant mass, which stretches a body along one line and squeezes it across that line. It is a tide of degree two: along every line out from the centre, the kick it gives grows in proportion to the distance.'
    chapter: '0.5'
    anchor: the-bodys-reply-to-a-pull-reveals-its-inside
  - term: octupolar tide
    definition: 'The finer part of a tide that a nearer mass adds, because it stretches the side of a body that faces it more than the far side. It is a tide of degree three, and in a round body it weighs each piece by the fourth power of its distance from the centre.'
    chapter: '0.5'
    anchor: the-reply-can-be-read-by-weighing-the-body-or-by-watching-the-passer
  - term: horizon
    definition: 'The surface of a black hole from which nothing, not even light, can escape. A changing tide loses energy through it, as if it had friction.'
    chapter: '0.5'
    anchor: a-black-hole-replies-with-friction-and-a-temperature
  - term: fluctuation–dissipation theorem
    definition: 'The exact link between the random trembling of a warm body and the friction it shows when pushed: the trembling divided by the friction gives its temperature.'
    chapter: '0.5'
    anchor: a-black-hole-replies-with-friction-and-a-temperature
  - term: holographic principle
    definition: 'The idea, from attempts at a quantum theory of gravity, that everything inside a region of space can in principle be learnt at its boundary.'
    chapter: '0.5'
    anchor: a-black-hole-replies-with-friction-and-a-temperature
  - term: gravity gradiometer
    definition: 'An instrument that measures the tide, the change of gravity from one point to the next. The best laboratory one resolves 0.02 eötvös in a second.'
    chapter: R1
    anchor: what-the-premise-asks-existing-instruments-nearly-supply
  - term: gravitational compass
    definition: 'A cluster of free masses whose positions are read against one another, proposed in the 1950s and 1960s to measure the curvature of spacetime, the tide, piece by piece.'
    chapter: R1
    anchor: what-the-premise-asks-existing-instruments-nearly-supply
  - term: standard quantum limit
    definition: 'The smallest uncertainty in the position of a mass watched for a time that quantum mechanics allows when the watching is the only disturbance, $\sqrt{\hbar\tau/m}$: $3 \times 10^{-16}$ m for a gram watched for a second.'
    chapter: R1
    anchor: what-the-premise-asks-existing-instruments-nearly-supply
  - term: random variable
    definition: 'A quantity whose value is drawn anew each time it is measured, such as the reading of an instrument.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - term: probability density
    definition: 'For a random quantity $x$, the function $p(x)$ such that $p(x)\,\mathrm{d}x$ is the probability that $x$ falls between $x$ and $x + \mathrm{d}x$. Its integral is one.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - term: mean
    definition: 'The average of a random quantity over many draws, written $\langle x\rangle$.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - term: variance
    definition: 'The mean square of the departure from the mean, $\langle(x - \langle x\rangle)^2\rangle$. Variances of independent quantities add.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - term: standard deviation
    definition: 'The square root of the variance, the typical size of a random departure from the mean, written $\sigma$ with a subscript naming its quantity.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - term: signal
    definition: 'The part of a reading that the instrument is meant to measure, as distinct from its noise.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - term: bias
    definition: 'A fixed offset that is the same in every reading. Averaging does not reduce it, so it must be measured and subtracted, as the Earth''s own tide is.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - term: Gaussian distribution
    definition: 'The bell-shaped distribution fixed by a mean and a standard deviation. A Gaussian reading lies within one, two and three standard deviations of its mean 68.3%, 95.4% and 99.73% of the time.'
    chapter: '3.1'
    anchor: most-noise-follows-the-gaussian-bell
  - term: cumulative probability
    definition: 'The probability $P(Z < x)$ that a random quantity $Z$ falls below a given number $x$.'
    chapter: '3.1'
    anchor: most-noise-follows-the-gaussian-bell
  - term: central limit theorem
    definition: 'The theorem that a sum of many independent random numbers with finite variance, shifted by its mean and divided by its standard deviation, approaches the standard Gaussian distribution.'
    chapter: '3.1'
    anchor: most-noise-follows-the-gaussian-bell
  - term: independent
    definition: 'Said of two random quantities when the value of one tells nothing about the other: their joint density is the product of their own.'
    chapter: '3.1'
    anchor: averaging-independent-readings-shrinks-the-noise-as-a-square-root
  - term: square-root law
    definition: 'Averaging $N$ independent readings divides their standard deviation by $\sqrt N$, so a signal-to-noise ratio grows as the square root of the observing time.'
    chapter: '3.1'
    anchor: averaging-independent-readings-shrinks-the-noise-as-a-square-root
  - term: covariance
    definition: 'The mean product of the departures of two random quantities from their means. It is zero for independent quantities.'
    chapter: '3.1'
    anchor: averaging-independent-readings-shrinks-the-noise-as-a-square-root
  - term: correlation
    definition: 'The covariance of two random quantities divided by both their standard deviations, a pure number between $-1$ and $1$.'
    chapter: '3.1'
    anchor: covariance-describes-noise-that-two-readings-share
  - term: covariance matrix
    definition: 'The table of the covariances of a set of readings, with their variances on its diagonal.'
    chapter: '3.1'
    anchor: covariance-describes-noise-that-two-readings-share
  - term: uncorrelated
    definition: 'Said of two random quantities whose covariance is zero. They may still depend on each other, as $x$ and $x^2$ do.'
    chapter: '3.1'
    anchor: covariance-describes-noise-that-two-readings-share
  - term: Poisson distribution
    definition: 'The distribution of a count of independent random arrivals with mean $\lambda$: $P(N) = \lambda^N e^{-\lambda}/N!$. Its variance equals its mean.'
    chapter: '3.1'
    anchor: rare-events-are-counted-with-the-poisson-distribution
  - term: counting noise
    definition: 'The spread of a count of random arrivals about its mean, the square root of the mean: a count of 100 varies by about 10.'
    chapter: '3.1'
    anchor: rare-events-are-counted-with-the-poisson-distribution
  - term: spherical coordinates
    definition: 'The distance $r$ from the origin, the polar angle $\vartheta$ from the $z$ axis and the azimuth $\varphi$ round it. A small patch of sky has the solid angle $\mathrm d\Omega = \sin\vartheta\,\mathrm d\vartheta\,\mathrm d\varphi$, and a small volume is $r^2\,\mathrm dr\,\mathrm d\Omega$.'
    chapter: '2.2'
    anchor: a-direction-is-two-angles-and-a-small-patch-of-sky-has-the-solid-angle-sinvarthetamathrmdvarthetamathrmdvarphi
  - term: polar angle
    definition: 'The angle $\vartheta$ between a direction and the $z$ axis, from 0 at the north pole to $\pi$ at the south pole.'
    chapter: '2.2'
    anchor: a-direction-is-two-angles-and-a-small-patch-of-sky-has-the-solid-angle-sinvarthetamathrmdvarthetamathrmdvarphi
  - term: azimuth
    definition: 'The angle $\varphi$ of a direction round the $z$ axis, measured in the $xy$ plane from the $x$ axis.'
    chapter: '2.2'
    anchor: a-direction-is-two-angles-and-a-small-patch-of-sky-has-the-solid-angle-sinvarthetamathrmdvarthetamathrmdvarphi
  - term: Laplacian on the sphere
    definition: 'The part $\nabla_\Omega^2$ of the Laplacian that differentiates only with respect to the two angles, so that it acts on patterns on the sky. It has no unit.'
    chapter: '2.2'
    anchor: the-laplacian-splits-into-a-part-along-the-radius-and-a-part-on-the-sphere
  - term: homogeneous polynomial
    definition: 'A polynomial whose terms all have the same degree, such as $xy$ or $x^2 + z^2$. A harmonic one of degree $\ell$ is $r^\ell$ times a pattern of degree $\ell$.'
    chapter: '2.2'
    anchor: each-pattern-of-one-degree-gives-two-harmonic-functions-the-solid-harmonics
  - term: solid harmonic
    definition: 'A harmonic function $r^\ell Y$ or $Y/r^{\ell+1}$, with $Y$ a pattern of degree $\ell$. Inside an empty ball about the origin the potential is a sum of the first kind only, outside all matter a sum of the second only, and in an empty shell a sum of both.'
    chapter: '2.2'
    anchor: each-pattern-of-one-degree-gives-two-harmonic-functions-the-solid-harmonics
  - term: Legendre polynomial
    definition: 'The polynomial $P_\ell(\mu)$ that multiplies $t^\ell$ in the expansion of $(1 - 2t\mu + t^2)^{-1/2}$. With $\mu = \cos\vartheta$ it is the pattern of degree $\ell$ that is unchanged by turns about the $z$ axis.'
    chapter: '2.2'
    anchor: the-patterns-symmetric-about-an-axis-are-the-legendre-polynomials-and-the-inverse-distance-generates-them
  - term: generating function
    definition: 'A function whose expansion in powers of a variable $t$ has a family of functions as its coefficients. The inverse distance $(1 - 2t\mu + t^2)^{-1/2}$ generates the Legendre polynomials.'
    chapter: '2.2'
    anchor: the-patterns-symmetric-about-an-axis-are-the-legendre-polynomials-and-the-inverse-distance-generates-them
  - term: axially symmetric
    definition: 'Unchanged when turned about an axis. The axially symmetric pattern of degree $\ell$ about a direction $\hat{\mathbf x}$ is $P_\ell(\hat{\mathbf x}\cdot\hat n)$.'
    chapter: '2.2'
    anchor: the-patterns-symmetric-about-an-axis-are-the-legendre-polynomials-and-the-inverse-distance-generates-them
  - term: orthogonal
    definition: 'Two patterns $f$ and $g$ on the sky are orthogonal when $\oint f^*g\,\mathrm d\Omega = 0$, the integral that plays the part of a dot product. Patterns of different degree are always orthogonal.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - term: orthonormal
    definition: 'Orthogonal to one another and each of unit length, as the spherical harmonics are: $\oint Y_{\ell m}^*Y_{\ell''m''}\,\mathrm d\Omega = \delta_{\ell\ell''}\delta_{mm''}$.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - term: spherical harmonic
    definition: 'One of the basic patterns $Y_{\ell m}$ on the sky, $2\ell + 1$ of each degree $\ell$, labelled by the order $m$ and depending on the azimuth through $e^{im\varphi}$. Every pattern on the sky is a sum of them.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - term: order
    definition: 'The whole number $m$, from $-\ell$ to $\ell$, that labels a spherical harmonic within its degree: the pattern changes with the azimuth as $e^{im\varphi}$.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - term: associated Legendre function
    definition: 'The function $P_\ell^m(\mu) = (-1)^m(1 - \mu^2)^{m/2}\,\mathrm d^mP_\ell/\mathrm d\mu^m$ that gives the dependence of $Y_{\ell m}$ on the polar angle.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - term: completeness
    definition: 'The property of the spherical harmonics that every pattern on the sky is a sum of them, with an error whose average square goes to zero as more degrees are added. Stated in chapter 2.2 without proof.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - term: addition theorem
    definition: 'The identity $\sum_m Y_{\ell m}^*(\hat n)Y_{\ell m}(\hat n'') = \tfrac{2\ell + 1}{4\pi}P_\ell(\hat n\cdot\hat n'')$, which turns a sum over the orders of one degree into one Legendre polynomial.'
    chapter: '2.2'
    anchor: the-addition-theorem-turns-a-sum-over-m-into-one-legendre-polynomial
  - term: harmonic polynomial
    definition: 'A polynomial in the coordinates whose Laplacian is zero, such as $x^2 - y^2$ or $xy$. A quadratic $T_{ij}x_ix_j$ is harmonic exactly when its table is trace-free; in each degree $\ell$ there are $2\ell + 1$ independent ones.'
    chapter: '2.1'
    anchor: the-harmonic-quadratics-are-the-trace-free-tables
  - term: mean value property
    definition: 'The value of a harmonic function at the centre of any sphere inside its region equals its average over that sphere.'
    chapter: '2.1'
    anchor: the-value-at-the-centre-of-a-sphere-is-the-average-over-the-sphere
  - term: maximum principle
    definition: 'A harmonic function that is not constant takes its largest and smallest values only on the boundary of its region, never inside it.'
    chapter: '2.1'
    anchor: in-empty-space-the-potential-has-no-peak-and-no-pit
  - term: saddle
    definition: 'A point where a function rises along some directions and falls along others. In empty space a point where the gravitational field vanishes and the tide does not is a saddle of the potential; where both vanish, the maximum principle still forbids a pit.'
    chapter: '2.1'
    anchor: in-empty-space-the-potential-has-no-peak-and-no-pit
  - term: "Earnshaw's theorem"
    definition: 'No arrangement of masses, or of electric charges, can hold a free body at rest stably by inverse-square forces alone, because the potential has no minimum in empty space.'
    chapter: '2.1'
    anchor: in-empty-space-the-potential-has-no-peak-and-no-pit
  - term: boundary
    definition: 'The closed surface that encloses a region of space, written $\partial V$ for the region $V$.'
    chapter: '2.1'
    anchor: in-empty-space-the-potential-has-no-peak-and-no-pit
  - term: "Green's first identity"
    definition: 'The rule $\int_V(\nabla u\cdot\nabla v + u\nabla^2v)\,\mathrm dV = \oint_{\partial V}u\nabla v\cdot\mathrm d\mathbf A$: the divergence theorem applied to $u\nabla v$.'
    chapter: '2.1'
    anchor: greens-identities-move-a-laplacian-from-one-function-to-the-other
  - term: "Green's second identity"
    definition: 'The rule $\int_V(u\nabla^2v - v\nabla^2u)\,\mathrm dV = \oint_{\partial V}(u\nabla v - v\nabla u)\cdot\mathrm d\mathbf A$, which moves a Laplacian from one function to the other inside an integral.'
    chapter: '2.1'
    anchor: greens-identities-move-a-laplacian-from-one-function-to-the-other
  - term: boundary condition
    definition: 'Values of a function, or of its slope, prescribed on the boundary of a region.'
    chapter: '2.1'
    anchor: the-values-on-a-closed-surface-fix-the-potential-inside
  - term: uniqueness
    definition: 'A function harmonic in a bounded region is fixed by its values on the boundary. Outside a closed surface, the potential made by the matter inside it is fixed by its values on the surface and its fall to zero far away.'
    chapter: '2.1'
    anchor: the-values-on-a-closed-surface-fix-the-potential-inside
  - term: analytic
    definition: 'Equal, round every point, to the sum of its Taylor series. Every harmonic function is analytic.'
    chapter: '2.1'
    anchor: a-harmonic-function-is-fixed-by-its-values-in-any-small-ball
  - term: unique continuation
    definition: 'Two functions harmonic in a connected region that agree in any small ball agree everywhere in it. Noise, not the theorem, limits what a real camera recovers.'
    chapter: '2.1'
    anchor: a-harmonic-function-is-fixed-by-its-values-in-any-small-ball
  - term: Cauchy–Riemann equations
    definition: 'The equations $\partial_xu = \partial_yv$ and $\partial_yu = -\partial_xv$ obeyed by the real and imaginary parts of a holomorphic function $u + iv$; they make both parts harmonic in the plane.'
    chapter: '2.1'
    anchor: the-harmonic-quadratics-are-the-trace-free-tables
  - term: holomorphic
    definition: 'A function of the complex variable $w = x + iy$ that has a derivative in $w$ at every point of a region, such as any polynomial in $w$.'
    chapter: '2.1'
    anchor: the-harmonic-quadratics-are-the-trace-free-tables
  - term: "Green's function"
    definition: 'The potential of a single point source of unit strength: a solution of $\nabla^2\mathcal G = \delta^3(\mathbf x - \mathbf y)$. In all space, falling to zero far away, it is $-1/4\pi|\mathbf x - \mathbf y|$, and every potential is a sum of such terms.'
    chapter: '2.4'
    anchor: the-potential-of-one-point-builds-every-potential
  - term: reciprocity
    definition: 'The symmetry $\mathcal G(\mathbf x, \mathbf y) = \mathcal G(\mathbf y, \mathbf x)$ of a Green''s function: the potential at one point of a unit mass at another is unchanged when the two points are swapped.'
    chapter: '2.4'
    anchor: the-potential-of-one-point-builds-every-potential
  - term: linear
    definition: 'Said of an equation, such as Poisson''s, in which a sum of solutions for two sources is the solution for the sum of the sources, and a multiple of a solution is a solution for the same multiple of its source.'
    chapter: '2.4'
    anchor: the-potential-of-one-point-builds-every-potential
  - term: "Green's representation formula"
    definition: 'The formula that writes a function harmonic in a region from its values and its normal slope on the boundary, $\Phi(\mathbf x) = \oint(\Phi\nabla\mathcal G - \mathcal G\nabla\Phi)\cdot\mathrm d\mathbf A$.'
    chapter: '2.4'
    anchor: inside-an-empty-region-the-values-on-its-boundary-write-the-potential
  - term: Dirichlet problem
    definition: 'The problem of finding a function harmonic in a region from its values on the boundary.'
    chapter: '2.4'
    anchor: inside-an-empty-region-the-values-on-its-boundary-write-the-potential
  - term: "Dirichlet Green's function"
    definition: 'A Green''s function of a region that vanishes on the region''s boundary.'
    chapter: '2.4'
    anchor: inside-an-empty-region-the-values-on-its-boundary-write-the-potential
  - term: Poisson kernel
    definition: 'The weight on the boundary that gives a harmonic function inside a region from its values on the boundary: the outward slope of the Dirichlet Green''s function. For a plane it is $z/2\pi(a^2 + z^2)^{3/2}$; for a ball, $(R^2 - s^2)/4\pi R|\mathbf x - \mathbf s|^3$.'
    chapter: '2.4'
    anchor: inside-an-empty-region-the-values-on-its-boundary-write-the-potential
  - term: method of images
    definition: 'Building a Green''s function that vanishes on a boundary by adding sources, called images, outside the region, placed so that their potential cancels the source''s on the boundary.'
    chapter: '2.4'
    anchor: above-a-flat-camera-a-mirror-image-gives-the-potential-at-every-height
  - term: upward continuation
    definition: 'Computing a potential, or a tide, farther from its sources from its values on a plane, with the half-space Poisson kernel. It smooths away detail finer than the added height.'
    chapter: '2.4'
    anchor: above-a-flat-camera-a-mirror-image-gives-the-potential-at-every-height
  - term: downward continuation
    definition: 'Computing a potential nearer its sources from its values on a plane, the reverse of upward continuation. It sharpens the picture and multiplies the noise of fine detail.'
    chapter: '2.4'
    anchor: above-a-flat-camera-a-mirror-image-gives-the-potential-at-every-height
  - term: Kelvin image
    definition: 'For a point at the distance $s$ from the centre of a sphere of radius $R$, the point on the same ray at the distance $R^2/s$, with the weight $R/s$. Its potential cancels the point''s on the sphere.'
    chapter: '2.4'
    anchor: on-a-sphere-kelvins-image-gives-the-potential-inside-and-the-skin-of-balayage
  - term: balayage
    definition: 'French for sweeping: replacing the mass inside a region by a skin on its boundary that has the same field everywhere outside. For a point mass $m$ inside a ball the skin has the surface density $m(R^2 - s^2)/4\pi R|\mathbf x - \mathbf s|^3$.'
    chapter: '2.4'
    anchor: on-a-sphere-kelvins-image-gives-the-potential-inside-and-the-skin-of-balayage
  - term: retarded Green's function
    definition: 'The Green''s function of the wave equation that delivers the field of each piece of a source late by the time light takes to cross the distance.'
    chapter: '2.4'
    anchor: where-greens-functions-go-next
  - term: multipole expansion
    definition: 'The potential outside a body written as a sum over degrees $\ell$, each term a multipole moment of the body times $Y_{\ell m}/r^{\ell+1}$. Degree $\ell$ is at least $(r/R)^\ell$ times weaker than the monopole, with $R$ the body''s size and $r$ the distance.'
    role: field
    chapter: '2.3'
    anchor: outside-a-body-the-potential-is-a-list-of-moments
  - term: monopole
    definition: 'The multipole moment of degree 0, the total mass. Far from any body only its field, $-GM/r$, is left.'
    role: matter
    chapter: '2.3'
    anchor: outside-a-body-the-potential-is-a-list-of-moments
  - term: octupole
    definition: 'The multipole moments of degree 3, seven numbers. Their potential falls as $1/r^4$ and their tide as $1/r^6$.'
    role: matter
    chapter: '2.3'
    anchor: outside-a-body-the-potential-is-a-list-of-moments
  - term: quadrupole tensor
    definition: 'The symmetric trace-free table $Q_{ij} = \int\rho\,(3x_ix_j - r^2\delta_{ij})\,\mathrm dV$, in kg m², that gives the degree-two part of the potential outside a body. A round body has none.'
    role: matter
    chapter: '2.3'
    anchor: the-first-three-degrees-are-the-mass-the-centre-of-mass-and-a-trace-free-quadrupole
  - term: exterior expansion
    definition: 'The multipole expansion of the potential outside a sphere that holds all the mass, a sum of the fading solid harmonics $Y_{\ell m}/r^{\ell+1}$.'
    chapter: '2.3'
    anchor: round-the-camera-distant-matter-makes-a-sum-of-growing-harmonics
  - term: interior expansion
    definition: 'The potential inside a sphere about the camera that holds no matter, a sum of the growing solid harmonics $r^\ell Y_{\ell m}$. Degree 2 is the uniform tide; degrees 3 and up are tides that change across the camera.'
    chapter: '2.3'
    anchor: round-the-camera-distant-matter-makes-a-sum-of-growing-harmonics
  - term: contact term
    definition: 'The part $\tfrac{4\pi}{3}G\rho\,\delta_{ij}$ of the tide made by the matter at the pixel''s own place. It holds the trace $4\pi G\rho$, keeps the tide finite where the tidal column grows without limit, and corresponds to $-\tfrac{4\pi}{3}\delta_{ij}\delta^3$ in the second derivatives of $1/r$.'
    role: curv
    chapter: '2.3'
    anchor: at-the-cameras-own-place-the-tide-stays-finite-while-the-tidal-column-grows-without-limit
  - term: random process
    definition: 'A quantity whose whole course in time (or across a plane) is drawn at random, such as the noise in a record; each repetition of the experiment gives a different function.'
    chapter: '3.2'
    anchor: a-noisy-record-is-a-random-function-of-time
  - term: stationary
    definition: 'Said of a random process whose statistics do not change with time, so that the covariance of two values depends only on the time between them.'
    chapter: '3.2'
    anchor: a-noisy-record-is-a-random-function-of-time
  - term: autocorrelation
    definition: 'The mean product $\langle n(t)\,n(0)\rangle$ of a stationary noise at two times a lag $t$ apart. At zero lag it is the variance.'
    chapter: '3.2'
    anchor: a-noisy-record-is-a-random-function-of-time
  - term: correlation time
    definition: 'The lag beyond which the autocorrelation of a noise is negligible, so that readings further apart are uncorrelated.'
    chapter: '3.2'
    anchor: a-noisy-record-is-a-random-function-of-time
  - term: power spectral density
    definition: 'The spectrum of a noise: how its variance is shared among frequencies. It is the Fourier transform of the autocorrelation.'
    chapter: '3.2'
    anchor: the-spectrum-says-how-the-noise-is-shared-among-frequencies
  - term: Wiener–Khinchin relation
    definition: 'The statement that the autocorrelation of a stationary noise and its spectrum are a Fourier pair: $C(t) = \int S(\omega)\,e^{-i\omega t}\,\mathrm d\omega/2\pi$.'
    chapter: '3.2'
    anchor: the-spectrum-says-how-the-noise-is-shared-among-frequencies
  - term: two-sided spectrum
    definition: 'A spectrum defined on negative and positive frequencies, sharing the variance between $+\omega$ and $-\omega$. The paper''s spectra are two-sided.'
    chapter: '3.2'
    anchor: the-spectrum-says-how-the-noise-is-shared-among-frequencies
  - term: one-sided spectrum
    definition: 'A spectrum defined on positive frequencies only, in hertz, holding the whole variance there; it is twice the two-sided spectrum. Data sheets usually quote it.'
    chapter: '3.2'
    anchor: the-spectrum-says-how-the-noise-is-shared-among-frequencies
  - term: white noise
    definition: 'Noise whose spectrum is the same at every frequency, or in every ripple across a plane. Values at different times or places are uncorrelated, and its average over a time $\tau$ or an area $A$ has variance $S(0)/\tau$ or $N_0/A$.'
    chapter: '3.2'
    anchor: the-spectrum-says-how-the-noise-is-shared-among-frequencies
  - term: red noise
    definition: 'Noise whose spectrum grows without limit toward zero frequency, such as a slow drift or a random walk: its correlation time is longer than any observation, and its average does not shrink as the square-root law says. Noise that is only strongest at low frequencies, with a finite spectrum at zero frequency, is not red in this sense: it still averages down once the observing time is much longer than its correlation time.'
    chapter: '3.2'
    anchor: the-spectrum-says-how-the-noise-is-shared-among-frequencies
  - term: spatial noise density
    definition: 'The constant $N_0$, in s⁻⁴ m², that describes white noise spread over the plane of an array: the noise averaged over an area $A$ has variance $N_0/A$.'
    chapter: '3.2'
    anchor: the-variance-of-noise-spread-over-a-plane-falls-as-one-over-the-area
  - term: shot noise
    definition: 'The noise of arrivals at independent random times, such as photons or gravitons: its spectrum is flat and equal to the mean rate, which gives the Poisson spread of a count.'
    chapter: '3.2'
    anchor: randomly-placed-masses-are-a-noise-too
  - term: jointly Gaussian
    definition: 'Said of noise when every set of its readings has a joint Gaussian distribution, as when independent pixels each carry Gaussian noise. Sums of such readings, such as the ripples of a map, are jointly Gaussian too, and jointly Gaussian quantities that are uncorrelated are independent.'
    chapter: '3.2'
    anchor: the-variance-of-noise-spread-over-a-plane-falls-as-one-over-the-area
  - term: prior
    definition: 'A description of the expected statistics of a scene before any reading is taken. The paper''s prior for the near-field camera is a sheet of point masses dropped at random, one in each area $z^2$.'
    chapter: '3.2'
    anchor: randomly-placed-masses-are-a-noise-too
  - term: confined
    definition: 'Said of a function that is zero outside a body, with its gradient continuous, so that both vanish on the surface. Adding the Laplacian of a confined function, divided by $4\pi G$, to a body changes nothing outside it.'
    chapter: '2.5'
    anchor: a-confined-laplacian-added-to-a-body-changes-nothing-outside
  - term: inverse problem
    definition: 'A problem that asks for causes from their effects, such as a density from its field.'
    chapter: '2.5'
    anchor: a-confined-laplacian-added-to-a-body-changes-nothing-outside
  - term: exterior inverse problem
    definition: 'Finding a body''s density from its field outside. It has many answers, because a confined Laplacian can be added to any of them.'
    chapter: '2.5'
    anchor: a-confined-laplacian-added-to-a-body-changes-nothing-outside
  - term: impossibility result
    definition: 'Two scenes, built explicitly, that a camera cannot tell apart at any sensitivity: the paper''s main device for saying what it cannot see.'
    chapter: '2.5'
    anchor: a-confined-laplacian-added-to-a-body-changes-nothing-outside
  - term: inner product
    definition: 'For two functions in a body, $\langle f, g\rangle = \int f\,g\,\mathrm dV$, the dot product with one entry for each point. Two functions are orthogonal when it is zero.'
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - term: harmonic part
    definition: 'The part $\rho_h$ of a density that is harmonic in the body, in the split $\rho = \rho_h + \nabla^2\psi/4\pi G$. The field outside fixes it completely and sees nothing else.'
    role: matter
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - term: harmonic projection
    definition: 'The harmonic density closest to a given density, in the sense of the smallest $\int(\rho - \rho_h)^2\,\mathrm dV$. It is the harmonic part.'
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - term: null space
    definition: 'Of the field outside a body: the densities $\nabla^2\psi/4\pi G$, with $\psi$ confined, that change no reading outside it.'
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - term: least assuming picture
    definition: 'Of all the interiors with a given field outside, the one with the smallest $\int\rho^2\,\mathrm dV$, which is the harmonic part. It has its densest and lightest points on the surface, so it never shows a core.'
    chapter: '2.5'
    anchor: the-least-assuming-interior-is-the-harmonic-part-and-it-never-shows-a-core
  - term: reproducing kernel
    definition: 'For a ball, the function $K(\mathbf x, \mathbf s)$ whose integral against any harmonic function over the ball gives that function''s value at $\mathbf s$; also called the harmonic Bergman kernel. A nugget''s flush is its mass times this kernel.'
    chapter: '2.5'
    anchor: the-harmonic-part-of-a-nugget-is-a-flush-on-the-near-wall
  - term: flush
    definition: 'The paper''s word for the harmonic part of a nugget inside a ball: the nugget''s mass spread through the ball, densest at the wall nearest the nugget, with the same field outside.'
    role: matter
    chapter: '2.5'
    anchor: the-harmonic-part-of-a-nugget-is-a-flush-on-the-near-wall
  - term: skin
    definition: 'The paper''s word for the balayage of a nugget: its mass spread over the ball''s surface, thickest over the nugget, with the same field outside.'
    role: matter
    chapter: '2.5'
    anchor: the-nugget-the-flush-and-the-skin-differ-only-in-what-the-outside-cannot-read
  - term: phase of a ripple
    definition: 'The angle $\alpha$, in radians, in a ripple $\cos(kx + \alpha)$: it shifts the crests along the line, so that the crest that would stand at $x = 0$ stands at $x = -\alpha/k$.'
    chapter: '2.6'
    anchor: a-ripple-in-space-is-a-turning-number-as-an-oscillation-in-time-is
  - term: complex amplitude
    definition: 'The complex number in front of a ripple $e^{ikx}$: its modulus gives the size of the ripple and its argument the shift of its crests. A real pattern has conjugate amplitudes at $k$ and $-k$.'
    chapter: '2.6'
    anchor: a-ripple-in-space-is-a-turning-number-as-an-oscillation-in-time-is
  - term: Fourier series
    definition: 'A pattern that repeats with period $L$, written as a sum of the ripples that repeat with it: $f = \sum_n c_n e^{2\pi inx/L}$.'
    chapter: '2.6'
    anchor: a-repeating-pattern-is-a-sum-of-ripples
  - term: Fourier coefficient
    definition: 'The amount $c_n$ of one ripple in a Fourier series: the average over a period of the pattern times the complex conjugate of the ripple.'
    chapter: '2.6'
    anchor: a-repeating-pattern-is-a-sum-of-ripples
  - term: Gibbs phenomenon
    definition: 'The overshoot of a Fourier series next to a jump: it narrows as more ripples are added, and its peak falls slowly toward 9% of the jump but never below. It is the ringing left when the finest ripples of a sharp edge are cut away.'
    chapter: '2.6'
    anchor: a-repeating-pattern-is-a-sum-of-ripples
  - term: Fourier transform
    definition: 'How much of each ripple a pattern on an endless line or plane holds. In this tutorial, $\tilde f(k) = \int f\,e^{-ikx}\,\mathrm dx$ in space and $\tilde f(\omega) = \int f\,e^{i\omega t}\,\mathrm dt$ in time, the paper''s convention.'
    chapter: '2.6'
    anchor: on-an-endless-line-the-sum-becomes-an-integral
  - term: inverse transform
    definition: 'The integral that adds the ripples back into the pattern: $f(x) = \int\tilde f(k)\,e^{ikx}\,\mathrm dk/2\pi$. The factor $2\pi$ always goes with the integral over wavenumbers or frequencies.'
    chapter: '2.6'
    anchor: on-an-endless-line-the-sum-becomes-an-integral
  - term: wavevector
    definition: 'The vector $\boldsymbol k$ of a ripple $e^{i\boldsymbol k\cdot\boldsymbol a}$ on a plane, in m⁻¹. It points across the crests, and its length is the wavenumber.'
    chapter: '2.6'
    anchor: across-a-plane-a-ripples-wavevector-points-across-its-crests
  - term: convolution
    definition: 'The blur of a pattern $f$ by a weight $g$: $(g * f)(x) = \int g(x - x'')\,f(x'')\,\mathrm dx''$, each value replaced by a weighted average of its neighbours.'
    chapter: '2.6'
    anchor: a-blur-multiplies-each-ripple-by-a-number
  - term: kernel
    definition: 'The weight $g$ of a blur or of any convolution: $g(x - x'')$ says how much the value at $x''$ counts in the result at $x$.'
    chapter: '2.6'
    anchor: a-blur-multiplies-each-ripple-by-a-number
  - term: convolution theorem
    definition: 'The transform of a convolution is the product of the transforms, $\widetilde{g * f} = \tilde g\,\tilde f$: a blur multiplies each ripple by its own number and mixes none of them.'
    chapter: '2.6'
    anchor: a-blur-multiplies-each-ripple-by-a-number
  - term: power of a pattern
    definition: 'The integral of the square of a pattern, $\int|f|^2\,\mathrm dx$, a name taken from circuits.'
    chapter: '2.6'
    anchor: the-power-of-a-pattern-is-the-same-counted-point-by-point-or-ripple-by-ripple
  - term: "Parseval's theorem"
    definition: 'The power of a pattern is the same counted point by point or ripple by ripple: $\int|f|^2\,\mathrm dx = \int|\tilde f|^2\,\mathrm dk/2\pi$. Different ripples share no power.'
    chapter: '2.6'
    anchor: the-power-of-a-pattern-is-the-same-counted-point-by-point-or-ripple-by-ripple
  - term: aliasing
    definition: 'The confusion, on pixels a distance $b$ apart, of ripples whose wavenumbers differ by $2\pi/b$: they take the same value at every pixel. A ripple finer than $\pi/b$ cannot be told apart from one inside the range from $-\pi/b$ to $\pi/b$.'
    chapter: '2.6'
    anchor: an-area-holds-a-countable-number-of-ripples
  - term: convergence in the mean
    definition: 'The sense in which the Fourier series of any pattern with a finite integral of its square approaches it: the integral of the squared difference goes to zero, though the sum may miss the pattern at some points.'
    chapter: '2.6'
    anchor: a-repeating-pattern-is-a-sum-of-ripples
  - term: uncertainty relation
    definition: 'No pattern is narrow both along the line and in wavenumber: treating $|f|^2$ and $|\tilde f|^2$ as distributions, the product of their standard deviations is at least $\tfrac12$, and a Gaussian reaches that bound.'
    chapter: '2.6'
    anchor: on-an-endless-line-the-sum-becomes-an-integral
  - term: parameter
    definition: 'An unknown number of a scene, such as a mass or a depth, that readings are used to measure.'
    chapter: '3.3'
    anchor: the-likelihood-scores-each-scene-by-how-well-it-explains-the-data
  - term: likelihood
    definition: 'The probability density of the readings that were recorded, seen as a function of the unknown parameters of the scene. It scores each candidate scene by how probable it would have made the data.'
    chapter: '3.3'
    anchor: the-likelihood-scores-each-scene-by-how-well-it-explains-the-data
  - term: maximum-likelihood estimate
    definition: 'The value of a parameter that makes the likelihood largest. With independent Gaussian noise it is the least-squares fit.'
    chapter: '3.3'
    anchor: the-likelihood-scores-each-scene-by-how-well-it-explains-the-data
  - term: hypothesis
    definition: 'One possible answer to a question about a scene, made complete enough to predict every reading.'
    chapter: '3.3'
    anchor: choosing-between-two-scenes-comes-down-to-one-gaussian-number
  - term: hypothesis test
    definition: 'A rule that picks one of several hypotheses from the data. Between two equally likely ones, the rule with the fewest errors picks the one with the larger likelihood.'
    chapter: '3.3'
    anchor: choosing-between-two-scenes-comes-down-to-one-gaussian-number
  - term: likelihood ratio
    definition: 'The likelihood of one hypothesis divided by that of another. The best test between two equally likely hypotheses compares it with one.'
    chapter: '3.3'
    anchor: choosing-between-two-scenes-comes-down-to-one-gaussian-number
  - term: error probability
    definition: 'The chance that a test picks the wrong hypothesis. Between two scenes whose predicted readings lie $D$ noise standard deviations apart, the best test errs with probability $P(Z > D/2)$.'
    chapter: '3.3'
    anchor: choosing-between-two-scenes-comes-down-to-one-gaussian-number
  - term: estimator
    definition: 'Any rule that turns the readings into a value of a parameter, such as the maximum-likelihood fit.'
    chapter: '3.3'
    anchor: the-fisher-information-measures-how-sharply-the-likelihood-peaks
  - term: unbiased estimator
    definition: 'An estimator whose mean over the noise is the true value of the parameter, whatever that value is.'
    chapter: '3.3'
    anchor: the-fisher-information-measures-how-sharply-the-likelihood-peaks
  - term: Fisher information
    definition: 'The sum over the readings of the squared rate at which each predicted reading changes with a parameter, in units of the noise. It measures how sharply the likelihood peaks.'
    chapter: '3.3'
    anchor: the-fisher-information-measures-how-sharply-the-likelihood-peaks
  - term: score
    definition: 'The slope of the logarithm of the likelihood with respect to a parameter, at its true value. Its mean is zero and its variance is the Fisher information.'
    chapter: '3.3'
    anchor: the-fisher-information-measures-how-sharply-the-likelihood-peaks
  - term: Cauchy–Schwarz inequality
    definition: 'For any two random quantities, the square of their covariance is at most the product of their variances. It is why a correlation lies between $-1$ and 1.'
    chapter: '3.3'
    anchor: the-fisher-information-measures-how-sharply-the-likelihood-peaks
  - term: Cramér–Rao bound
    definition: 'The variance of any unbiased estimate of a parameter is at least one over its Fisher information, or, with several parameters, the diagonal entry of the inverse Fisher matrix.'
    chapter: '3.3'
    anchor: the-fisher-information-measures-how-sharply-the-likelihood-peaks
  - term: Fisher matrix
    definition: 'The Fisher information of several parameters at once: a symmetric table whose entries pair the rates at which the predicted readings change with each parameter.'
    chapter: '3.3'
    anchor: an-unknown-we-do-not-want-can-only-enlarge-the-error-of-one-we-do
  - term: nuisance parameter
    definition: 'An unknown that must be fitted although it is not wanted. It can only enlarge the error of the parameters that are wanted, and it does so when it changes the data in a similar way.'
    chapter: '3.3'
    anchor: an-unknown-we-do-not-want-can-only-enlarge-the-error-of-one-we-do
  - term: signal-to-noise ratio of the whole pattern
    definition: 'For one point mass below a flat camera that fills its plane, how many noise standard deviations separate its data from those of an empty scene: $\mathcal R = (\sqrt{3\pi}/4)\,\mathrm{SNR}$.'
    chapter: '3.3'
    anchor: one-mass-a-metre-away-is-placed-to-a-millimetre
  - term: radiometer equation
    definition: 'For a random signal far below the noise, watched for a time $T$, the separation from no signal is $D^2 \approx T\int(S_s/S_n)^2\,\mathrm d\omega/2\pi$ over positive frequencies: $D = (S_s/S_n)\sqrt{BT}$ over a band of $B$ hertz.'
    chapter: '3.3'
    anchor: a-tremor-far-below-the-noise-can-still-be-detected
  - term: separation of variables
    definition: 'Looking for a solution as a product of functions of one variable each, such as $\cos(\mathbf k\cdot\mathbf a)\,f(h)$, so that an equation in several variables falls apart into equations in one.'
    chapter: '2.7'
    anchor: in-empty-space-a-ripple-can-only-fade
  - term: boundary condition at infinity
    definition: 'A condition that a solution must meet far away, such as a potential staying bounded far above all its sources. It removes the growing solution $e^{kh}$ and keeps the fading one.'
    chapter: '2.7'
    anchor: in-empty-space-a-ripple-can-only-fade
  - term: noise amplification
    definition: 'The growth of the noise when a fade is undone: dividing a ripple of the data by its fade $e^{-kz}$ multiplies its noise by $e^{kz}$, so the finest ripples are lost first.'
    chapter: '2.7'
    anchor: undoing-the-fade-multiplies-the-noise
