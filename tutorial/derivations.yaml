# here, labelled Derivation.
#
#   eq:x: { chapter: '7.2', section: <anchor> }     the chapter (its id in parts.yaml) derives the equation, under
#                                                  the level-two heading with that anchor (section is optional)
#   eq:x: { chapter: ..., section: ..., stated: true }
#                                                  the book states the equation without deriving it, and the
#                                                  chapter shows it there; its note is labelled Background
#
# A chapter named here must be published and derive or show the equation where it is named: with {{paper eq:x}}, a
# display written out, or a margin note linking /paper/#eq:x. A paper equation missing from this file gets a
# Background note at the first chapter that shows or links it. The unit tests check that every chapter and anchor
# exists and that every entry is a paper equation.
#
# First written from the ledger tables of the reading chapters, which the book's rewrite removed (commit c9df34e),
# then checked against the chapters; when an equation is newly derived, add it here.

