# The symbols a reader can click for their card (keyed in TeX by \sym{key}{...}), and the symbol index.
# Fields: key, title, tex (as it is set, with its role colour), role (matter, field, curv, obs, light, or none),
# kind (one line: what sort of object), meaning (one paragraph, $...$ for mathematics), chapter (the defining
# chapter's id) and, optionally, anchor (a section id within it).
# TeX goes in single quotes, so that backslashes stay as they are.
symbols:
  - key: tidal-tensor
    title: Tidal tensor
    tex: '\curv{\mathcal{E}}_{ij}'
    role: curv
    kind: A symmetric table of nine numbers, trace-free in empty space and then five of them independent; unit s⁻²
    meaning: 'How the pull of gravity changes from one point to the next. Two free balls a distance $\xi$ apart along a direction $j$ drift apart, or together, with relative acceleration $-\mathcal{E}_{ij}\xi_j$. It is what one pixel of the camera measures.'
    chapter: '1.4'
  - key: potential
    title: Gravitational potential
    tex: '\field{\Phi}'
    role: field
    kind: A number at each point; an energy per unit mass, in J/kg
    meaning: 'The energy per kilogram that a small body has because of where it is. Near a body of mass $M$ it is $\Phi = -GM/r$. Its gradient gives the pull of gravity, and its second derivatives give the tide.'
    chapter: '1.2'
  - key: density
    title: Mass density
    tex: '\matter{\rho}'
    role: matter
    kind: A number at each point; mass per unit volume, in kg/m³
    meaning: 'How much mass there is in each cubic metre. It is the source of the potential, through Poisson''s equation $\nabla^2\Phi = 4\pi G\rho$.'
    chapter: '1.3'
  - key: mass
    title: Mass
    tex: '\matter{M}'
    role: matter
    kind: A number; in kilograms
    meaning: 'The mass of a whole body, the integral of its density over its volume.'
    chapter: '1.2'
  - key: separation
    title: Separation of two free masses
    tex: '\xi^i'
    role: none
    kind: A vector; in metres
    meaning: 'The small displacement from one free test mass to a neighbour. The tide changes it; the ring of test masses that is the paper''s pixel is a circle of such separations.'
    chapter: '1.4'
  - key: velocity
    title: Velocity of the observer
    tex: '\obs{v}'
    role: obs
    kind: A vector; in m/s
    meaning: 'How fast the one who measures is moving, and in which direction, relative to the frame in which the scene is described. In chapter 6.1 it is the steady velocity of one inertial frame through another, such as the pixel''s $0.6c$ through the room, or a body''s through the pixel''s frame.'
    chapter: '6.1'
    anchor: every-observer-measures-the-same-speed-of-light
  - key: electric-field
    title: Electric field
    tex: '\light{E}'
    role: light
    kind: A vector at each point; in V/m
    meaning: 'The force per unit charge on a charge at rest. In light it is one half of the wave; the magnetic field $B$ is the other.'
    chapter: '6.6'
    anchor: the-electric-and-magnetic-fields-are-defined-by-the-force-on-a-test-charge
  - key: mean-density
    title: Mean density
    tex: '\matter{\bar\rho}'
    role: matter
    kind: A number for a whole body; in kg/m³
    meaning: 'The mass of a body divided by its volume. With the angular size $\theta$ it sets the tide the body raises, $2GM/r^3 = (8\pi G/3)\bar\rho\,\theta^3$.'
    chapter: '1.4'
    anchor: tidal-brightness-is-density-times-the-cube-of-angular-size
  - key: angular-size
    title: Angular size
    tex: '\theta'
    role: none
    kind: A pure number, R/r; in radians for a distant body
    meaning: 'The radius $R$ of a body divided by its distance $r$. For a distant body it is the angle between the line to its centre and the line to its edge. At the same density, a body that looks twice as wide raises a tide eight times as strong.'
    chapter: '1.4'
    anchor: tidal-brightness-is-density-times-the-cube-of-angular-size
  - key: snr
    title: Signal-to-noise ratio of the array
    tex: '\mathrm{SNR}'
    role: none
    kind: A pure number
    meaning: 'The peak tide $2Gm/z^3$ of a point mass $m$ at depth $z$, divided by the noise of the tide averaged over a square patch of side $z$, $\sqrt{N_0}/z$. So $\mathrm{SNR} = 2Gm/(z^2\sqrt{N_0})$. It is the one number on which the blur of a near-field picture depends.'
    chapter: '3.7'
    anchor: step-1-one-number-measures-the-camera
  - key: kz
    title: Fineness of a ripple
    tex: 'q'
    role: none
    kind: A pure number, q = kz
    meaning: 'The wavenumber $k$ of a ripple of the scene times its depth $z$ below the sensors. A ripple with $q = 1$ has crests $2\pi z$ apart. Laplace''s equation fades it by $e^{-q}$ on its way to the camera, so only $q$, and never $k$ or $z$ alone, decides whether it survives.'
    chapter: '3.7'
    anchor: step-2-each-ripple-stands-above-its-noise-by-a-factor-that-depends-on-two-numbers
  - key: ripple-ratio
    title: Ratio of a ripple to its noise
    tex: 's'
    role: none
    kind: A pure number
    meaning: 'How far one ripple of the scene stands above its own noise in the data, $s = \pi\,\mathrm{SNR}\,q\,e^{-q}$ for the near-field camera. The best reconstruction keeps the ripple with weight $s^2/(1+s^2)$.'
    chapter: '3.7'
    anchor: step-2-each-ripple-stands-above-its-noise-by-a-factor-that-depends-on-two-numbers
  - key: wiener-filter
    title: Wiener filter
    tex: 'H'
    role: none
    kind: A pure number between 0 and 1 for each ripple
    meaning: 'The weight with which the best linear reconstruction keeps each ripple, $H = s^2/(1+s^2)$. It is close to one for ripples well above their noise and close to zero for ripples buried in it. (In Section XII of the paper, $H$ is a number of bits.)'
    chapter: '3.5'
    anchor: independent-ripples-can-be-filtered-one-at-a-time
  - key: cutoff
    title: Cut-off
    tex: 'q_c'
    role: none
    kind: A pure number
    meaning: 'The finest ripple the best reconstruction still keeps with weight one half, the larger root of $q_c\,e^{-q_c} = 1/\pi\,\mathrm{SNR}$. It is 10.4 at a signal-to-noise ratio of a thousand and 74.5 at $10^{30}$, close to $\ln(\pi\,\mathrm{SNR}) + \ln\ln(\pi\,\mathrm{SNR})$.'
    chapter: '3.7'
    anchor: step-3-the-filter-keeps-a-ripple-while-it-stands-above-its-noise
  - key: lambert-w
    title: Lambert W function, lower branch
    tex: '\mathrm{W}_{-1}'
    role: none
    kind: A function of one real number between −1/e and 0
    meaning: 'The inverse of $v\,e^v$: $\mathrm{W}(y)$ is the $v$ with $v\,e^v = y$. For $y$ between $-1/e$ and $0$ there are two solutions; the lower branch $\mathrm{W}_{-1}$ gives the one below $-1$, and the cut-off is $q_c = -\mathrm{W}_{-1}(-1/\pi\,\mathrm{SNR})$.'
    chapter: '3.7'
    anchor: step-4-solving-the-cut-off-needs-a-logarithm-of-a-logarithm
  - key: angular-blur
    title: Angular blur
    tex: '\Delta\theta'
    role: none
    kind: An angle, in radians
    meaning: 'The full width at half maximum of the picture of a point, divided by its depth. For a near-field array as wide as the scene is deep, $\Delta\theta = 4.43/q_c$: 24° at a signal-to-noise ratio of a thousand. (The paper also uses $\Delta\theta$ for the blur of a wave image, $\lambda/D$.)'
    chapter: '3.7'
    anchor: step-6-the-blur-is-the-width-of-the-picture-at-half-its-height
  - key: surface-density
    title: Surface density
    tex: '\matter{\sigma}'
    role: matter
    kind: A number at each point of a sheet; mass per unit area, in kg/m²
    meaning: 'How much mass a thin sheet holds in each square metre. The near-field camera''s scene is described as a surface density at a depth $z$. (In Part 3, $\sigma$ never stands for a standard deviation.)'
    chapter: '2.7'
    anchor: a-thin-sheet-makes-each-ripple-of-the-potential-on-its-own
  - key: noise-density
    title: Spatial noise density
    tex: 'N_0'
    role: none
    kind: A number; in s⁻⁴ m²
    meaning: 'The strength of white noise spread over the plane of the sensors. Averaged over a patch of area $A$, the noise of the tide has variance $N_0/A$, so over a square of side $z$ its standard deviation is $\sqrt{N_0}/z$.'
    chapter: '3.2'
    anchor: the-variance-of-noise-spread-over-a-plane-falls-as-one-over-the-area
  - key: test-mass
    title: Test mass
    tex: '\matter{m}'
    role: matter
    kind: A number; in kilograms
    meaning: 'The mass of a small body put at a point to feel the pull of gravity there, small enough that its own pull does not move the bodies it measures. The pull on it divided by $m$ is the gravitational field.'
    chapter: '1.2'
    anchor: gravity-pulls-with-a-force-proportional-to-both-masses
  - key: gravitational-constant
    title: Gravitational constant
    tex: 'G'
    role: none
    kind: A constant of nature; in m³ kg⁻¹ s⁻²
    meaning: 'The constant in Newton''s law of gravitation, $G = 6.674 \times 10^{-11}\,\mathrm{m^3\,kg^{-1}\,s^{-2}}$. Two masses $M$ and $m$ a distance $r$ apart attract each other with the force $GMm/r^2$.'
    chapter: '1.2'
    anchor: gravity-pulls-with-a-force-proportional-to-both-masses
  - key: gravitational-field
    title: Gravitational field
    tex: '\boldsymbol{g}'
    role: none
    kind: A vector at each point; an acceleration, in m s⁻²
    meaning: 'The pull of gravity on a small test mass, divided by its mass: the acceleration with which a free body at that point falls. It is the downhill slope of the potential, $\vect g = -\nabla\Phi$, and the fields of many bodies add as vectors. Near a point mass $M$ it is $-GM\vect x/r^3$.'
    chapter: '1.2'
    anchor: the-field-is-the-pull-per-unit-mass-and-fields-add
  - key: nabla
    title: Gradient
    tex: '\nabla'
    role: none
    kind: An operator; it turns a number at each point into a vector at each point
    meaning: 'The gradient $\nabla f$ of a function $f$ of position is the vector of its three partial derivatives, $(\nabla f)_i = \partial_i f$. It points in the direction in which $f$ grows fastest, and its length is that fastest rate. The rate along a unit vector $\hat u$ is $\hat u\cdot\nabla f$.'
    chapter: '1.2'
    anchor: the-gradient-points-uphill
  - key: unit-vector
    title: Unit vector
    tex: '\hat{\vect x}'
    role: none
    kind: A vector of length one; no unit
    meaning: 'A vector divided by its own length, so that only its direction is left: $\hat{\vect x} = \vect x/r$ for the position $\vect x$ at distance $r$, and $\hat x_i\hat x_i = 1$. The paper writes $\hat n$ for the unit vector from a pixel toward a source (in Sections V and XI, from a source toward the field point).'
    chapter: '1.1'
    anchor: an-index-stands-for-all-three-directions
  - key: kronecker-delta
    title: Kronecker delta
    tex: '\delta_{ij}'
    role: none
    kind: A table of nine pure numbers, the identity matrix
    meaning: 'The dot product of two unit vectors along the axes, $\delta_{ij} = \vect e_i\cdot\vect e_j$: 1 when $i = j$ and 0 otherwise. In a sum it replaces one index by another, $\delta_{ij}a_j = a_i$, and its trace is $\delta_{ii} = 3$.'
    chapter: '1.1'
    anchor: an-index-stands-for-all-three-directions
  - key: projector
    title: Projector across a direction
    tex: 'P_{ij}'
    role: none
    kind: A symmetric table of nine pure numbers
    meaning: 'The table $P_{ij} = \delta_{ij} - \hat n_i\hat n_j$, which flattens every arrow onto the plane at right angles to $\hat n$: it sends $\hat n$ to zero and leaves arrows in the plane unchanged, and $P_{ij}P_{jk} = P_{ik}$. The paper uses it to keep the directions across the line to a source of waves.'
    chapter: '1.1'
    anchor: a-table-built-from-two-arrows
  - key: rotation
    title: Rotation of the axes
    tex: 'R_{ij}'
    role: none
    kind: An orthogonal table of nine pure numbers
    meaning: 'The components of the new axes in the old ones, $R_{ij} = \vect e''_i\cdot\vect e_j$. Its transpose is its inverse, $R^{\mathsf T}R = 1$. When the axes turn, a vector changes as $a''_i = R_{ij}a_j$ and a tensor as $T'' = RTR^{\mathsf T}$, so dot products and traces stay the same.'
    chapter: '1.1'
    anchor: turning-the-axes-changes-the-components-not-the-arrow
  - key: levi-civita
    title: Levi-Civita symbol
    tex: '\epsilon_{ijk}'
    role: none
    kind: A table of 27 pure numbers, each +1, −1 or 0
    meaning: 'The symbol with $\epsilon_{123} = +1$, $+1$ for the cyclic orders of 1, 2, 3, $-1$ for the others, and $0$ when two indices are equal. It writes the cross product, $(\vect a\times\vect b)_i = \epsilon_{ijk}a_jb_k$, and two of them sharing an index give Kronecker deltas, $\epsilon_{kij}\epsilon_{klm} = \delta_{il}\delta_{jm} - \delta_{im}\delta_{jl}$.'
    chapter: '1.1'
    anchor: the-cross-product-is-written-with-the-levi-civita-symbol
  - key: generators
    title: Generators of rotations
    tex: '(L_k)_{ij}'
    role: none
    kind: Three antisymmetric tables of pure numbers
    meaning: 'The tables $(L_k)_{ij} = -\epsilon_{kij}$. A small turn by the angle vector $\boldsymbol\theta$ changes a vector by $\delta a_i = \theta_k(L_k)_{ij}a_j$, which is $\boldsymbol\theta\times\vect a$. The paper uses them, with an imaginary angle, to boost the curvature that a moving pixel reads.'
    chapter: '1.7'
    anchor: every-quantity-generates-a-motion-and-a-symmetry-gives-a-constant
  - key: angular-velocity
    title: Angular velocity
    tex: '\boldsymbol\Omega'
    role: none
    kind: A vector; in radians per second, s⁻¹
    meaning: 'A vector along the axis of a turning body, pointing by the right-hand rule, whose length is the angle turned per second. A point at position $\vect x$, measured from a point on the axis, moves with velocity $\boldsymbol\Omega\times\vect x$. For the Earth $|\boldsymbol\Omega| = 7.29\times10^{-5}\,\mathrm{s^{-1}}$, so the ground at the equator moves at 465 m/s. The spin of a body is set plain; the angular velocity of a turning frame, the observer''s own turning (chapter 1.6), takes the observer''s colour.'
    chapter: '1.1'
    anchor: the-ground-at-the-equator
  - key: solid-angle
    title: Solid angle
    tex: '\mathrm{d}\Omega'
    role: none
    kind: A pure number; in steradians (sr)
    meaning: 'The area that a patch covers on a sphere of radius 1 centred on the point from which it is seen. A small patch of area $\mathrm{d}A$ at distance $r$, tilted by the angle $\alpha$ from the line of sight, covers $\mathrm{d}\Omega = \cos\alpha\,\mathrm{d}A/r^2$. The whole sky is $4\pi$ sr; the Moon covers $6.4\times10^{-5}$ sr. (In the paper $\Omega$ alone is also a rate of turning.)'
    chapter: '1.3'
    anchor: solid-angle-measures-how-large-a-patch-looks
  - key: enclosed-mass
    title: Enclosed mass
    tex: '\matter{M}_{\mathrm{enc}}'
    role: matter
    kind: A number for a region; in kilograms
    meaning: 'The mass inside a closed surface, $\int_V \rho\,\mathrm{d}V$. By Gauss''s law the flux of gravity out of the surface is $-4\pi G M_{\mathrm{enc}}$, whatever the shape of the surface and however the mass is arranged inside.'
    chapter: '1.3'
    anchor: the-flux-out-of-a-closed-surface-counts-the-mass-inside
  - key: delta-function
    title: Delta function
    tex: '\delta^3'
    role: none
    kind: A distribution, not a function; in m⁻³
    meaning: 'The rule $\int\delta^3(\vect x)\,f(\vect x)\,\mathrm{d}^3x = f(0)$ for every smooth $f$. A point mass $M$ at $\vect x_0$ has the density $M\,\delta^3(\vect x - \vect x_0)$, and $\nabla^2(1/r) = -4\pi\,\delta^3(\vect x)$. Not to be confused with the Kronecker delta $\delta_{ij}$.'
    chapter: '1.3'
    anchor: a-point-mass-is-density-gathered-at-one-point
  - key: frobenius-norm
    title: Frobenius norm
    tex: '|T|'
    role: none
    kind: A number for a table; in the units of its entries (s⁻² for a tide)
    meaning: 'The length of a table, $|T| = \sqrt{T_{ij}T_{ij}}$, the square root of the sum of the squares of its nine entries. Turning the axes does not change it. For a symmetric trace-free table it is $\sqrt{c_1^2 + \dots + c_5^2}$; for the person one metre away $|\mathcal{E}| = \sqrt6\,GM/r^3 = 1.14\times10^{-8}\,\mathrm{s^{-2}}$.'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - key: stf-basis
    title: Orthonormal basis of symmetric trace-free tables
    tex: 'b^A_{ij}'
    role: none
    kind: Five symmetric trace-free tables of pure numbers, labelled A = 1, …, 5
    meaning: 'Three off-diagonal shapes, $(\vect e_x\vect e_y + \vect e_y\vect e_x)/\sqrt2$ and its two companions, with $\mathrm{diag}(1,-1,0)/\sqrt2$ and $\mathrm{diag}(-1,-1,2)/\sqrt6$. They satisfy $b^A_{ij}b^B_{ij} = \delta^{AB}$, and every symmetric trace-free table is $c_A b^A_{ij}$. The index $A$ counts tables, not directions.'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - key: stf-coefficient
    title: Coefficient along a basis table
    tex: 'c_A'
    role: none
    kind: Five numbers; in the units of the table (s⁻² for a tide)
    meaning: 'The component of a symmetric trace-free table along the basis table $b^A$, read off by contraction, $c_A = b^A_{ij}\mathcal{E}_{ij}$. The five are the five numbers of the tide, and $\sum_A c_A^2 = \mathcal{E}_{ij}\mathcal{E}_{ij}$. An entry off the diagonal is a coefficient divided by $\sqrt2$.'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - key: stf-projector
    title: Symmetric trace-free projector
    tex: '\Pi_{ijkl}'
    role: none
    kind: An isotropic table of 81 pure numbers
    meaning: 'The table $\Pi_{ijkl} = \tfrac12(\delta_{ik}\delta_{jl} + \delta_{il}\delta_{jk}) - \tfrac13\delta_{ij}\delta_{kl}$. Applied to any table it keeps the trace-free part of its symmetric part, and it sends $\delta_{kl}$ to zero. Its trace $\Pi_{ijij} = 5$ counts the five numbers it keeps, and $\Pi_{ijkl} = b^A_{ij}b^A_{kl}$ (stated in chapter 1.5 without proof).'
    chapter: '1.5'
    anchor: the-five-numbers-are-the-components-of-a-vector-with-its-own-length
  - key: degree
    title: Degree of a pattern
    tex: '\ell'
    role: none
    kind: A whole number, with no unit
    meaning: 'The number of indices of a symmetric table, and the degree of the pattern $T_{i_1\cdots i_\ell}\hat n_{i_1}\cdots\hat n_{i_\ell}$ it makes on the sky: 0 a constant, 1 a dipole, 2 a quadrupole. A trace-free table of degree $\ell$ holds $2\ell + 1$ numbers. (In the paper $\ell$ also names a mean free path and a path length.)'
    chapter: '1.5'
    anchor: patterns-of-higher-degree-hold-7-9-and-more-numbers
  - key: force
    title: Force
    tex: '\vect F'
    role: none
    kind: A vector; in newtons, N = kg m s⁻²
    meaning: 'A push or a pull. It changes a body''s momentum at the rate $\vect F = \mathrm d\vect p/\mathrm dt$, so a force $\vect F$ on a mass $m$ gives it the acceleration $\vect F/m$.'
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - key: momentum
    title: Momentum
    tex: '\vect p'
    role: none
    kind: A vector; in kg m s⁻¹
    meaning: 'Mass times velocity, $\vect p = m\vect v$. Forces change it; the total momentum of a body changes only by outside forces, because the forces between its parts cancel in pairs.'
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - key: centre-of-mass
    title: Centre of mass
    tex: '\vect x_{\rm cm}'
    role: none
    kind: A position; in metres
    meaning: 'The average of the positions of a body''s parts, each weighted by its mass. It moves as one particle carrying the whole mass, pushed only by outside forces, $M\ddot{\vect x}_{\rm cm} = \sum\vect F^{\rm out}$.'
    chapter: '1.6'
    anchor: force-changes-momentum-and-forces-inside-a-body-cancel
  - key: kinetic-energy
    title: Kinetic energy
    tex: 'K'
    role: none
    kind: A number; in joules
    meaning: 'The energy of motion, $\tfrac12 mv^2$ for a body, $\tfrac12\Omega_iI_{ij}\Omega_j$ for a turning rigid body. A kick of impulse $\vect J$ changes it by $\vect v\cdot\vect J + J^2/2m$.'
    chapter: '1.6'
    anchor: work-changes-kinetic-energy-and-a-steady-field-keeps-the-energy-fixed
  - key: impulse
    title: Impulse
    tex: '\vect J'
    role: none
    kind: A vector; in newton seconds, the unit of momentum
    meaning: 'The integral of a force over the time it acts, $\vect J = \int\vect F\,\mathrm dt$, equal to the change of momentum it causes. (In the paper $\vect J$ is also the current column and a momentum density.)'
    chapter: '1.6'
    anchor: work-changes-kinetic-energy-and-a-steady-field-keeps-the-energy-fixed
  - key: angular-momentum
    title: Angular momentum
    tex: '\vect L'
    role: none
    kind: A vector; in kg m² s⁻¹
    meaning: 'The moment of momentum about a point, $\vect L = \vect x\times\vect p$. Torque changes it; it stays fixed under a central force and for any body that nothing outside twists. The Earth''s is $5.8\times10^{33}\,\mathrm{kg\,m^2\,s^{-1}}$.'
    chapter: '1.6'
    anchor: angular-momentum-stays-fixed-when-the-force-points-at-a-centre
  - key: inertia-tensor
    title: Inertia tensor
    tex: 'I_{ij}'
    role: none
    kind: A symmetric table of nine numbers; in kg m²
    meaning: 'The table $I_{ij} = \int\rho\,(r^2\delta_{ij} - x_ix_j)\,\mathrm dV$ that turns a rigid body''s angular velocity into its angular momentum, $L_i = I_{ij}\Omega_j$. Its eigenvectors are the body''s principal axes. (In the paper $I_{ij}$ is the second moment $\int\rho\,x_ix_j\,\mathrm dV$.)'
    chapter: '1.6'
    anchor: a-turning-body-keeps-the-spread-of-its-mass-in-a-table-of-inertia
  - key: moment-of-inertia
    title: Moment of inertia
    tex: 'I'
    role: none
    kind: A number; in kg m²
    meaning: 'How hard it is to set a body spinning about an axis: $\int\rho\,s^2\,\mathrm dV$, with $s$ the distance from the axis. For a round body $I = \tfrac23\int\rho\,r^2\,\mathrm dV$: $\tfrac25MR^2$ for a uniform ball, $\tfrac23MR^2$ for a thin shell, $0.331\,MR^2$ for the Earth. (The paper writes it $C$ in Section VIII, where $I$ is an invariant.)'
    chapter: '1.6'
    anchor: a-round-body-has-the-same-moment-about-every-axis
  - key: imaginary-unit
    title: Imaginary unit
    tex: 'i'
    role: none
    kind: A number with no unit
    meaning: 'The number whose square is $-1$. In the complex plane it is one step along the second axis, and multiplying by it turns every point by a quarter turn. A complex number is $z = x + iy$.'
    chapter: '1.5b'
    anchor: a-complex-number-is-a-point-of-the-plane-that-can-be-multiplied
  - key: shear
    title: Shear of the tide in a plane
    tex: '\curv{s}'
    role: curv
    kind: A complex number; in s⁻²
    meaning: 'The part of the tide in a plane that changes the shape of a ring, held as one complex number, $s = (\mathcal E_{xx} - \mathcal E_{yy}) + 2i\,\mathcal E_{xy}$. The squeeze axis lies at half its argument, and the two eigenvalues in the plane differ by $|s|$. Turning the axes by $\theta$ multiplies it by $e^{-2i\theta}$: it has spin two. (Chapter 3.7 uses $s$ for a different quantity, the ratio of a ripple to its noise.)'
    chapter: '1.5b'
    anchor: a-tide-across-a-direction-is-one-complex-number-and-turning-the-axes-turns-it-back-by-twice-the-angle
  - key: complex-place
    title: Place on the camera's plane, as a complex number
    tex: 'w'
    role: none
    kind: A complex number; in metres
    meaning: 'A place on the plane of a camera, written as $w = x + iy$. The shear at the place $w$ of one point mass below the origin, at the distance $r$, is $s = -3GMw^2/r^5$. (The paper also writes $w$ for an eigenvalue of $\mathcal W$.)'
    chapter: '1.5b'
    anchor: the-shear-of-one-mass-is-a-square
  - key: wave-polarizations
    title: Polarization amplitudes of a wave's tide
    tex: '\curv{\mathcal{E}}_+,\ \curv{\mathcal{E}}_\times'
    role: curv
    kind: Two numbers; in s⁻²
    meaning: 'The tides of the two patterns of a gravitational wave across its direction of travel: the table in that plane is $\begin{pmatrix}\mathcal E_+ & \mathcal E_\times\\ \mathcal E_\times & -\mathcal E_+\end{pmatrix}$, and its shear is $2(\mathcal E_+ + i\mathcal E_\times)$. The two patterns differ by a turn of 45°. They are not the strains $h_+$ and $h_\times$, which are pure numbers.'
    chapter: '1.5b'
  - key: null-vector
    title: Complex null vector
    tex: '\vect{m}'
    role: none
    kind: A complex vector with no unit
    meaning: 'The vector $\vect m = (\vect e_1 + i\vect e_2)/\sqrt2$ across a wave travelling along $\hat k = \vect e_1\times\vect e_2$. It has $\vect m\cdot\vect m = 0$, $\vect m\cdot\vect m^* = 1$ and $\hat k\times\vect m = -i\vect m$. Light''s field in a wave is a multiple of $\vect m$, and gravity''s a multiple of the square $\vect m\vect m^{\mathsf T}$.'
    chapter: '1.5b'
    anchor: complex-vectors-a-direction-whose-square-is-zero
  - key: weyl-complex
    title: The complex tidal table
    tex: '\curv{\mathcal{W}}'
    role: curv
    kind: A symmetric trace-free table of complex numbers (five complex numbers); in s⁻²
    meaning: 'The paper''s one complex table for the ten numbers a pixel reads, $\mathcal W = \mathcal E + i\mathcal B$, with the tide $\mathcal E$ as its real part and the magnetic part $\mathcal B$ as its imaginary part. For a plane wave it is a square, $\mathcal W = 2(\mathcal E_+ - i\mathcal E_\times)\,\vect m\vect m^{\mathsf T}$. Chapter 9.3 studies it.'
    chapter: '1.5b'
    anchor: complex-vectors-a-direction-whose-square-is-zero
  - key: orbital-period
    title: Period of an orbit
    tex: 'T'
    role: none
    kind: A number; in seconds
    meaning: 'The time of one turn of an orbit. For a circle of radius $r$ round a mass $M$, $T = 2\pi\sqrt{r^3/GM}$, Kepler''s third law; for an ellipse, $r$ becomes the semi-major axis $a$. In terms of the tide, $T = 2\pi\sqrt{2/|\mathcal E_{xx}|}$. (In chapters on heat, $T$ is a temperature.)'
    chapter: '1.8'
    anchor: a-circular-orbit-is-a-fall-that-keeps-missing
  - key: semi-major-axis
    title: Semi-major axis
    tex: 'a'
    role: none
    kind: A length; in metres
    meaning: 'Half the longest diameter of an elliptical orbit. It alone sets the orbit''s energy, $E = -GMm/2a$, and its period, $T = 2\pi\sqrt{a^3/GM}$. (The paper uses $a$ for several other things; see each chapter.)'
    chapter: '1.8'
    anchor: energy-and-angular-momentum-fix-the-size-and-shape-of-an-orbit
  - key: passing-mass
    title: Passing mass
    tex: '\matter{\mu}'
    role: matter
    kind: A number; in kilograms
    meaning: 'A mass that flies past a body on a nearly straight line at the speed $V$, in the paper''s Section XIII. (In Sections IV and VI the paper writes $\mu$ for the rigidity of a solid.)'
    chapter: '1.8'
    anchor: a-fast-passing-mass-gives-every-part-of-a-body-a-sideways-kick
  - key: flyby-constant
    title: Strength of a pass
    tex: 'C'
    role: none
    kind: A constant; in m² s⁻¹
    meaning: 'The constant $C = 2G\mu/V$ of a mass $\mu$ passing at the speed $V$. A part of a body at the distance $B$ from the path receives the sideways velocity $C/B$, toward the path, wherever it lies along it.'
    chapter: '1.8'
    anchor: a-fast-passing-mass-gives-every-part-of-a-body-a-sideways-kick
  - key: projected-density
    title: Projected surface density
    tex: '\matter{\Sigma}'
    role: matter
    kind: A number at each point of a plane; mass per unit area, in kg/m²
    meaning: 'The density of a body added up along a direction, $\Sigma(\vect s) = \int\rho\,\mathrm dz$: the mass that lies over each square metre of a plane at right angles to that direction. The energy a passing mass leaves in a body is a weighted integral of it, the paper''s Eq. (pass).'
    chapter: '1.8'
    anchor: what-a-pass-leaves-inside-a-body-is-a-weighted-sum-of-its-projected-mass
  - key: hamiltonian
    title: Hamiltonian
    tex: 'H'
    role: none
    kind: A function of the positions and momenta; in joules
    meaning: 'The energy of a system written in terms of the positions and momenta of its parts, for particles $H = \sum_a p_a^2/2m_a + V$. Hamilton''s equations $\dot q = \partial H/\partial p$, $\dot p = -\partial H/\partial q$ move the state, and every quantity changes at the rate $\dot F = \{F, H\}$. (The paper also uses $H$ for the Wiener filter, a count of bits and the profile of an impulsive wave.)'
    chapter: '1.7'
    anchor: a-state-is-a-position-and-a-momentum
  - key: poisson-bracket
    title: Poisson bracket
    tex: '\{F, G\}'
    role: none
    kind: An operation on two quantities; unit that of $FG$ divided by a joule second
    meaning: 'The sum $\sum_a(\partial F/\partial\vect x_a\cdot\partial G/\partial\vect p_a - \partial F/\partial\vect p_a\cdot\partial G/\partial\vect x_a)$, in the paper''s order. It gives the rate of change of any quantity, $\dot F = \{F, H\}$, and the motion a quantity generates, $\mathrm dF/\mathrm ds = \{F, G\}$. The basic brackets are $\{x_i, p_j\} = \delta_{ij}$.'
    chapter: '1.7'
    anchor: the-poisson-bracket-gives-the-rate-of-change-of-anything
  - key: mass-moment
    title: Moment of the mass
    tex: 'Q_h'
    role: none
    kind: A number; in kilograms times the unit of $h$
    meaning: 'The integral of the density against a function of position, $Q_h = \int\rho\,h\,\mathrm dV = \sum_a m_ah(\vect x_a)$. For $h$ harmonic these are the numbers the steady field outside a body holds. Its rate of change is $\dot Q_h = \sum_a\vect p_a\cdot\nabla h(\vect x_a)$, and an impulsive tide of profile $g$ is the motion generated by $Q_g$.'
    chapter: '1.7'
    anchor: an-impulsive-tide-is-the-motion-generated-by-a-moment-of-the-mass
  - key: impulse-strength
    title: Strength of an impulsive tide
    tex: '\epsilon'
    role: none
    kind: A number; its product with the profile $g$ is in m² s⁻¹
    meaning: 'The strength of the impulsive tide whose potential is $-\epsilon\,g(\vect x)\,\delta(t)$. Each part of mass $m$ receives the impulse $\epsilon m\nabla g$, so $\epsilon\nabla g$ is the velocity it gains. Not the Levi-Civita symbol $\epsilon_{ijk}$, which has three indices.'
    chapter: '1.7'
    anchor: an-impulsive-tide-is-the-motion-generated-by-a-moment-of-the-mass
  - key: speed-of-light
    title: Speed of light
    tex: 'c'
    role: none
    kind: A constant of nature; in m s⁻¹
    meaning: 'The speed of light in empty space, $c = 2.998 \times 10^{8}\,\mathrm{m\,s^{-1}}$, which is also the speed of gravitational waves. The paper writes it out in every formula, so that $GM/c^2$ is a length and $c/2\pi f$ the edge of the near zone at frequency $f$.'
    chapter: '0.6'
    anchor: every-number-says-what-it-measures-in-what-unit-and-against-what
  - key: hbar
    title: Reduced Planck constant
    tex: '\hbar'
    role: none
    kind: A constant of nature; in J s
    meaning: 'Planck''s constant divided by $2\pi$, $\hbar = 1.055 \times 10^{-34}\,\mathrm{J\,s}$, read "h-bar". It sets the size of quantum effects: a quantum of a wave of angular frequency $\omega$ carries the energy $\hbar\omega$.'
    chapter: '0.6'
    anchor: every-number-says-what-it-measures-in-what-unit-and-against-what
  - key: boltzmann
    title: Boltzmann's constant
    tex: 'k_B'
    role: none
    kind: A constant of nature; in J K⁻¹
    meaning: 'The constant $k_B = 1.381 \times 10^{-23}\,\mathrm{J\,K^{-1}}$ that turns a temperature into an energy. The product $k_BT$ is the typical energy of one jiggle of heat at the temperature $T$: 25.9 meV at 300 K.'
    chapter: '0.6'
    anchor: every-number-says-what-it-measures-in-what-unit-and-against-what
  - key: solar-mass
    title: Solar mass
    tex: 'M_\odot'
    role: none
    kind: A unit of mass; in kilograms
    meaning: 'The mass of the Sun, $M_\odot = 1.989 \times 10^{30}\,\mathrm{kg}$, the astronomer''s unit for stars and black holes. Formulas often need the product $GM_\odot = 1.327 \times 10^{20}\,\mathrm{m^3\,s^{-2}}$.'
    chapter: '0.6'
    anchor: the-sky-has-its-own-units
  - key: magnetic-tide
    title: Magnetic part of the tide
    tex: '\curv{\mathcal{B}}_{ij}'
    role: curv
    kind: A table of nine numbers, symmetric and trace-free in empty space and then five of them independent; unit s⁻²
    meaning: 'The second kind of tide, made by moving masses. It does not stretch or squeeze a ring of free balls; it makes gyroscopes at nearby points turn slightly relative to one another. Near slow matter it is smaller than $\mathcal{E}_{ij}$ by about $v/c$, and in a gravitational wave the two are equal in size. The paper defines it as $\tfrac12 c^2\epsilon_{ipq}R_{pqj0}$; chapter 7.5 derives it.'
    chapter: R1
    anchor: an-ideal-pixel-reads-ten-numbers-and-must-not-turn
  - key: mean-value
    title: Mean
    tex: '\langle x\rangle'
    role: none
    kind: A number; in the unit of $x$
    meaning: 'The average of a random quantity $x$ over many draws, $\int x\,p(x)\,\mathrm{d}x$. The tutorial writes every mean with angle brackets, never $E[x]$, which would collide with the tide $\mathcal{E}$ and the eötvös.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - key: standard-deviation
    title: Standard deviation
    tex: '\sigma_x'
    role: none
    kind: A number; in the unit of $x$
    meaning: 'The typical size of the random departures of $x$ from its mean, the square root of the variance $\langle(x - \langle x\rangle)^2\rangle$. It is always written with a subscript naming its quantity, such as $\sigma_n$ for the noise; a bare $\sigma$ is a surface density. Averaging $N$ independent readings divides it by $\sqrt N$.'
    chapter: '3.1'
    anchor: a-reading-is-a-signal-plus-a-random-number
  - key: covariance-matrix
    title: Covariance matrix
    tex: 'C_{ab}'
    role: none
    kind: A symmetric table, one row and column for each reading; in the product of the readings' units
    meaning: 'The covariances $\mathrm{Cov}(x_a, x_b)$ of a set of readings, with their variances on the diagonal. A weighted sum $w_a x_a$ has the variance $w_a C_{ab} w_b$.'
    chapter: '3.1'
    anchor: covariance-describes-noise-that-two-readings-share
  - key: poisson-mean
    title: Mean count
    tex: '\lambda'
    role: none
    kind: A pure number
    meaning: 'The mean number of random, independent arrivals in an exposure: the rate times the time (and the area, for a detector of gravitons). The count follows the Poisson distribution $\lambda^N e^{-\lambda}/N!$ and varies by $\sqrt\lambda$. It is not a wavelength.'
    chapter: '3.1'
    anchor: rare-events-are-counted-with-the-poisson-distribution
  - key: polar-angle
    title: Polar angle
    tex: '\vartheta'
    role: none
    kind: An angle; in radians, from 0 to $\pi$
    meaning: 'The angle between a direction and the $z$ axis: 0 at the north pole, $\pi/2$ on the equator, $\pi$ at the south pole. With the azimuth $\varphi$ it fixes a direction, $\hat n = (\sin\vartheta\cos\varphi, \sin\vartheta\sin\varphi, \cos\vartheta)$. Written as a curly theta to keep it apart from the angular size $\theta = R/r$ of the paper''s equation for tidal brightness.'
    chapter: '2.2'
    anchor: a-direction-is-two-angles-and-a-small-patch-of-sky-has-the-solid-angle-sinvarthetamathrmdvarthetamathrmdvarphi
  - key: azimuth
    title: Azimuth
    tex: '\varphi'
    role: none
    kind: An angle; in radians, from 0 to $2\pi$
    meaning: 'The angle of a direction round the $z$ axis, measured in the $xy$ plane from the $x$ axis, anticlockwise as seen from the side toward which $z$ points. Not the potential $\Phi$.'
    chapter: '2.2'
    anchor: a-direction-is-two-angles-and-a-small-patch-of-sky-has-the-solid-angle-sinvarthetamathrmdvarthetamathrmdvarphi
  - key: sphere-laplacian
    title: Laplacian on the sphere
    tex: '\nabla_\Omega^2'
    role: none
    kind: A differential operator on patterns on the sky; no unit
    meaning: 'The part of the Laplacian that acts on the direction alone: $\nabla^2 f = r^{-2}\partial_r(r^2\partial_r f) + r^{-2}\nabla_\Omega^2 f$, with $\nabla_\Omega^2 f = (\sin\vartheta)^{-1}\partial_\vartheta(\sin\vartheta\,\partial_\vartheta f) + (\sin\vartheta)^{-2}\partial_\varphi^2 f$. A pattern of degree $\ell$ has $\nabla_\Omega^2 Y = -\ell(\ell + 1)Y$.'
    chapter: '2.2'
    anchor: the-laplacian-splits-into-a-part-along-the-radius-and-a-part-on-the-sphere
  - key: legendre
    title: Legendre polynomial
    tex: 'P_\ell'
    role: none
    kind: A polynomial of degree $\ell$ in $\mu = \cos\gamma$; no unit
    meaning: 'The coefficient of $t^\ell$ in $(1 - 2t\mu + t^2)^{-1/2}$, so that $1/|\vect x - \vect y| = \sum_\ell r''^\ell P_\ell(\cos\gamma)/r^{\ell+1}$ for $r'' < r$. $P_0 = 1$, $P_1 = \mu$, $P_2 = \tfrac12(3\mu^2 - 1)$, $P_3 = \tfrac12(5\mu^3 - 3\mu)$, and $P_\ell(1) = 1$. $P_\ell(\cos\gamma)$ is the pattern of degree $\ell$ symmetric about an axis; $P_2$ vanishes at 54.7°.'
    chapter: '2.2'
    anchor: the-patterns-symmetric-about-an-axis-are-the-legendre-polynomials-and-the-inverse-distance-generates-them
  - key: spherical-harmonic
    title: Spherical harmonic
    tex: 'Y_{\ell m}'
    role: none
    kind: A complex pattern on the sky; no unit
    meaning: 'The orthonormal patterns of degree $\ell$ and order $m$, $2\ell + 1$ of each degree, which depend on the azimuth through $e^{im\varphi}$ and satisfy $\oint Y_{\ell m}^*Y_{\ell''m''}\,\mathrm d\Omega = \delta_{\ell\ell''}\delta_{mm''}$. For example $Y_{20} = \sqrt{5/16\pi}\,(3\cos^2\vartheta - 1)$. Every pattern on the sky is a sum of them.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - key: order
    title: Order of a pattern
    tex: 'm'
    role: none
    kind: A whole number from $-\ell$ to $\ell$; no unit
    meaning: 'The label of a spherical harmonic within its degree: $Y_{\ell m}$ depends on the azimuth through $e^{im\varphi}$, so its real part goes through $|m|$ whole waves round the $z$ axis. (Elsewhere $m$ is a mass, which chapter 2.2 writes as $M$.)'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - key: harmonic-coefficient
    title: Coefficient of a spherical harmonic
    tex: 'a_{\ell m}'
    role: none
    kind: A complex number, in the unit of the pattern it describes
    meaning: 'How much of $Y_{\ell m}$ a pattern $f$ on the sky holds: $a_{\ell m} = \oint Y_{\ell m}^*f\,\mathrm d\Omega$, and $f = \sum a_{\ell m}Y_{\ell m}$. One pixel reads only the five of degree two of its tidal column.'
    chapter: '2.2'
    anchor: patterns-of-different-degree-are-orthogonal-and-every-pattern-is-a-sum-of-them
  - key: sphere-average
    title: Average over a sphere
    tex: '\bar h(R)'
    role: none
    kind: A number for each radius; in the unit of the function averaged
    meaning: 'The average of a function $h$ over the sphere of radius $R$ about a point, $\frac{1}{4\pi R^2}\oint h\,\mathrm dA$. For a harmonic $h$ it does not depend on $R$ and equals the value at the centre: the mean value property.'
    chapter: '2.1'
    anchor: the-value-at-the-centre-of-a-sphere-is-the-average-over-the-sphere
  - key: boundary
    title: Boundary of a region
    tex: '\partial V'
    role: none
    kind: A closed surface
    meaning: 'The closed surface that encloses a region $V$ of space. A harmonic function takes its largest and smallest values on it, and its values there fix the function inside.'
    chapter: '2.1'
    anchor: in-empty-space-the-potential-has-no-peak-and-no-pit
  - key: greens-function
    title: "Green's function"
    tex: '\mathcal G(\vect x, \vect y)'
    role: none
    kind: A function of two points; in m⁻¹
    meaning: 'The potential of a unit point source at $\vect y$, seen at $\vect x$: $\nabla^2\mathcal G = \delta^3(\vect x - \vect y)$, and in all space $\mathcal G = -1/4\pi|\vect x - \vect y|$. The potential of any body is $\Phi = 4\pi G\int\mathcal G\rho\,\mathrm d^3y$. Written in script to keep it apart from Newton''s constant $G$.'
    chapter: '2.4'
    anchor: the-potential-of-one-point-builds-every-potential
  - key: greens-function-2d
    title: "Green's function in two dimensions"
    tex: '\mathcal G_2'
    role: none
    kind: A function of the distance from an axis; a pure number
    meaning: 'The solution $\mathcal G_2 = \ln r/2\pi$ of $\nabla^2\mathcal G_2 = \delta^2$ in a plane, for scenes that do not change along one direction. A line of $\lambda$ kilograms per metre has the potential $2G\lambda\ln r$ plus a constant.'
    chapter: '2.4'
    anchor: along-a-long-rod-the-greens-function-is-a-logarithm
  - key: line-density
    title: Mass per unit length
    tex: '\matter{\lambda}'
    role: matter
    kind: A number; in kg/m
    meaning: 'The mass of a long rod, rail or line per metre of its length. Elsewhere $\lambda$ is a wavelength.'
    chapter: '2.4'
    anchor: along-a-long-rod-the-greens-function-is-a-logarithm
  - key: dirichlet-greens-function
    title: "Dirichlet Green's function"
    tex: '\mathcal G_D'
    role: none
    kind: A function of two points of a region; in m⁻¹
    meaning: 'A Green''s function of a region that vanishes on its boundary. Its slope along the outward normal on the boundary is the Poisson kernel, which writes a harmonic function inside from its values on the boundary.'
    chapter: '2.4'
    anchor: inside-an-empty-region-the-values-on-its-boundary-write-the-potential
  - key: half-space-kernel
    title: Poisson kernel of the half-space
    tex: 'P_z(\vect a)'
    role: none
    kind: A function of the position across a plane; in m⁻²
    meaning: 'The weight $z/2\pi(a^2 + z^2)^{3/2}$ that continues a potential known on a plane to the height $z$ above it, when no matter lies above: upward continuation. A bell of area 1 and full width $1.53z$; a ripple $\cos kx$ continues to $\cos(kx)\,e^{-kz}$.'
    chapter: '2.4'
    anchor: above-a-flat-camera-a-mirror-image-gives-the-potential-at-every-height
  - key: ball-kernel
    title: Poisson kernel of the ball
    tex: 'P(\vect x, \vect s)'
    role: none
    kind: A function of a point on a sphere and a point inside it; in m⁻²
    meaning: 'The weight $(R^2 - s^2)/4\pi R|\vect x - \vect s|^3$ that gives a harmonic function at $\vect s$ inside a ball of radius $R$ from its values at the points $\vect x$ of the sphere. A mass $m$ at $\vect s$ and a skin of surface density $mP$ on the sphere pull alike outside: balayage. Not the Legendre polynomial $P_\ell$.'
    chapter: '2.4'
    anchor: on-a-sphere-kelvins-image-gives-the-potential-inside-and-the-skin-of-balayage
  - key: multipole-moment
    title: Multipole moment
    tex: '\matter{Q}_{\ell m}'
    role: matter
    kind: A complex number for each degree $\ell$ and order $m$; in kg m^ℓ
    meaning: 'The weighted total $Q_{\ell m} = \int\rho\,r^\ell\,Y_{\ell m}^*\,\mathrm dV$ of a body''s mass against a solid harmonic. Outside the smallest sphere about the origin that holds the body, the potential is $-G\sum\tfrac{4\pi}{2\ell+1}Q_{\ell m}Y_{\ell m}/r^{\ell+1}$, so these numbers are all that the field outside holds. The potential of degree $\ell$ is at most $(R/r)^\ell$ times the monopole''s. Not the quality factor $Q$ of Part 4.'
    chapter: '2.3'
    anchor: outside-a-body-the-potential-is-a-list-of-moments
  - key: quadrupole-tensor
    title: Quadrupole tensor
    tex: '\matter{Q}_{ij}'
    role: matter
    kind: A symmetric trace-free table of five independent numbers; in kg m²
    meaning: 'The table $Q_{ij} = \int\rho\,(3x_ix_j - r^2\delta_{ij})\,\mathrm dV$, which gives the term $-\tfrac12GQ_{ij}x_ix_j/r^5$ of the potential outside a body. It equals $I_{kk}\delta_{ij} - 3I_{ij}$ with $I_{ij}$ the inertia tensor, so a round body has none. The paper''s black-hole $Q_{ij}$ of Section XIV is a sixth of it.'
    chapter: '2.3'
    anchor: the-first-three-degrees-are-the-mass-the-centre-of-mass-and-a-trace-free-quadrupole
  - key: noise-record
    title: Noise of a record
    tex: 'n(t)'
    role: none
    kind: A random function of time, in the unit of the reading (s⁻² for a tide)
    meaning: 'The random part of an instrument''s reading at the time $t$, with mean zero. Across a plane, $n(\vect a)$ is the noise of the reading at the place $\vect a$; its Fourier transform is $\tilde n$.'
    chapter: '3.2'
    anchor: a-noisy-record-is-a-random-function-of-time
  - key: autocorrelation
    title: Autocorrelation
    tex: 'C(t)'
    role: none
    kind: A function of the lag $t$; in the square of the unit of the noise
    meaning: 'The mean product $\langle n(t)\,n(0)\rangle$ of two readings of stationary noise a time $t$ apart. $C(0)$ is the variance; for white noise $C(t) = S(0)\,\delta(t)$. (Not the capacity $C$ of Section IV.)'
    chapter: '3.2'
    anchor: a-noisy-record-is-a-random-function-of-time
  - key: noise-spectrum
    title: Spectrum (power spectral density)
    tex: 'S(\omega)'
    role: none
    kind: A function of the angular frequency; in the square of the unit of the noise per hertz
    meaning: 'How the variance of a noise is shared among frequencies, two-sided as in the paper: $C(t) = \int S(\omega)\,e^{-i\omega t}\,\mathrm d\omega/2\pi$. White noise averaged over a time $\tau$ has variance $S(0)/\tau$. Always written with its argument, because $S(\hat n)$ is the tidal column.'
    chapter: '3.2'
    anchor: the-spectrum-says-how-the-noise-is-shared-among-frequencies
  - key: prior-spectrum
    title: Spectrum of the prior
    tex: 'S_\sigma'
    role: none
    kind: A number; in kg² m⁻²
    meaning: 'The spectrum of the surface density of a sheet of independent point masses $m$, $\nu$ of them per unit area: $S_\sigma = \nu m^2$, the same for every ripple. With one mass per area $z^2$ it is the paper''s prior, $m^2/z^2$.'
    chapter: '3.2'
    anchor: randomly-placed-masses-are-a-noise-too
  - key: number-per-area
    title: Number of masses per unit area
    tex: '\nu'
    role: none
    kind: A number per unit area; in m⁻²
    meaning: 'The mean number of randomly placed point masses in each square metre of a sheet. The count in an area $A$ is a Poisson count with mean $\nu A$. (In Section XIV of the paper, $\nu$ is a black hole''s friction.)'
    chapter: '3.2'
    anchor: randomly-placed-masses-are-a-noise-too
  - key: null-potential
    title: Potential of a confined change of density
    tex: '\field{\psi}'
    role: field
    kind: A number at each point, zero outside the body; an energy per unit mass, in J/kg
    meaning: 'A function that vanishes outside a body together with its gradient. Adding the density $\nabla^2\psi/4\pi G$ to the body changes its potential by $\psi$, so nothing outside changes: this is the paper''s null space.'
    chapter: '2.5'
    anchor: a-confined-laplacian-added-to-a-body-changes-nothing-outside
  - key: inner-product
    title: Inner product of two functions
    tex: '\langle f, g\rangle'
    role: none
    kind: A number; the product of the units of f and g times m³
    meaning: 'The integral $\int f\,g\,\mathrm dV$ over a body, which plays the part of a dot product with one entry for each point. Two functions are orthogonal when it is zero.'
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - key: harmonic-family
    title: The harmonic densities of a body
    tex: '\mathcal H'
    role: none
    kind: A family of functions
    meaning: 'All the densities in a body that are harmonic there, $\nabla^2\rho = 0$. Every member is orthogonal to every member of the null space $\mathcal N$.'
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - key: null-family
    title: The null space of the field outside
    tex: '\mathcal N'
    role: none
    kind: A family of functions
    meaning: 'All the densities $\nabla^2\psi/4\pi G$ with $\psi$ confined to the body: the densities that change no reading outside it. (The paper''s $\mathcal N$ of Section XIII, an energy crossing a front, is another object.)'
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - key: harmonic-part
    title: Harmonic part of a density
    tex: '\matter{\rho}_h'
    role: matter
    kind: A number at each point of a body; in kg/m³
    meaning: 'The harmonic density closest to $\rho$, its harmonic projection: $\rho = \rho_h + \nabla^2\psi/4\pi G$. The field outside fixes it completely, and it is the least assuming picture of the interior.'
    chapter: '2.5'
    anchor: every-density-splits-into-a-harmonic-part-and-a-part-the-outside-cannot-see
  - key: wavenumber
    title: Wavenumber
    tex: 'k'
    role: none
    kind: A number; an angle per unit length, in m⁻¹
    meaning: 'How fast a ripple advances along a line: $2\pi$ divided by the distance between its crests. Crests 10 cm apart have $k = 62.8\ \mathrm{m^{-1}}$. On a plane it is the length of the wavevector, $k = |\vect k|$.'
    chapter: '2.6'
    anchor: a-ripple-in-space-is-a-turning-number-as-an-oscillation-in-time-is
  - key: wavevector
    title: Wavevector
    tex: '\boldsymbol{k}'
    role: none
    kind: A vector in the plane of a ripple; in m⁻¹
    meaning: 'The vector of a ripple $e^{i\boldsymbol k\cdot\boldsymbol a}$ on a plane. It points across the crests, at right angles to them, and its length is the wavenumber, $2\pi$ divided by the distance between crests.'
    chapter: '2.6'
    anchor: across-a-plane-a-ripples-wavevector-points-across-its-crests
  - key: fourier-coefficient
    title: Fourier coefficient
    tex: 'c_n'
    role: none
    kind: A complex number, in the unit of the pattern
    meaning: 'The amount of the ripple $e^{2\pi inx/L}$ in a pattern that repeats with period $L$: $c_n = \frac1L\int_0^L f\,e^{-2\pi inx/L}\,\mathrm dx$. The coefficient $c_0$ is the mean, and a real pattern has $c_{-n} = c_n^*$.'
    chapter: '2.6'
    anchor: a-repeating-pattern-is-a-sum-of-ripples
  - key: fourier-transform
    title: Fourier transform
    tex: '\tilde f'
    role: none
    kind: A complex function of the wavenumber or wavevector; in the unit of the pattern times a length (a line) or an area (a plane)
    meaning: 'How much of each ripple a pattern holds, in this tutorial''s convention: $\tilde f(\boldsymbol k) = \int f\,e^{-i\boldsymbol k\cdot\boldsymbol a}\,\mathrm d^2a$ across a plane, and back again $f = \int\tilde f\,e^{i\boldsymbol k\cdot\boldsymbol a}\,\mathrm d^2k/(2\pi)^2$. In time the signs are reversed, $\tilde f(\omega) = \int f\,e^{i\omega t}\,\mathrm dt$.'
    chapter: '2.6'
    anchor: on-an-endless-line-the-sum-becomes-an-integral
  - key: patch-area
    title: Area of a patch
    tex: 'A'
    role: none
    kind: An area, in m²
    meaning: 'The area of the patch on which ripples are counted. A region $\mathrm d^2k$ of wavevectors holds $A\,\mathrm d^2k/(2\pi)^2$ independent ripples, so an array of pixels $b$ apart holds $A/b^2$ of them, one per pixel.'
    chapter: '2.6'
    anchor: an-area-holds-a-countable-number-of-ripples
  - key: parameter
    title: Parameter
    tex: '\theta'
    role: none
    kind: A number of the scene to be measured, in its own unit
    meaning: 'An unknown number of a scene, such as a mass, a depth or which safe holds the gold, that the readings are used to measure. With several unknowns they are written $\theta_1, \dots, \theta_K$. (Elsewhere $\theta$ is an angular size.)'
    chapter: '3.3'
    anchor: the-likelihood-scores-each-scene-by-how-well-it-explains-the-data
  - key: likelihood
    title: Likelihood
    tex: 'L(\theta)'
    role: none
    kind: A function of the parameter, for fixed data
    meaning: 'The probability density of the readings that were recorded, seen as a function of the parameter $\theta$. For independent Gaussian noise $\ln L = -\sum_i (y_i - f_i(\theta))^2/2\sigma_n^2$ plus a constant. It is not a probability for $\theta$.'
    chapter: '3.3'
    anchor: the-likelihood-scores-each-scene-by-how-well-it-explains-the-data
  - key: scene-separation
    title: Separation of two scenes
    tex: 'D'
    role: none
    kind: A pure number
    meaning: 'How far apart the readings predicted by two scenes lie, in standard deviations of the noise: $D = |\mathbf f_A - \mathbf f_B|/\sigma_n$. The best test between them errs with probability $P(Z > D/2)$. It grows in proportion to the signal-to-noise ratio. (Chapters 2.3 and 3.7 and the paper''s Section IV use $D$ for the width of a camera; the paper''s Figure separation-noise, in Section VIII, uses it for the factor by which a nuisance parameter enlarges an error, which chapter 3.3 writes $1/\sqrt{1 - \gamma^2}$.)'
    chapter: '3.3'
    anchor: choosing-between-two-scenes-comes-down-to-one-gaussian-number
  - key: error-probability
    title: Error probability
    tex: 'P_{\rm err}'
    role: none
    kind: A probability, between 0 and ½
    meaning: 'The chance that a test between two equally likely scenes picks the wrong one. For the best test with Gaussian noise it is $P(Z > D/2)$: 18% for the locked safe at a signal-to-noise ratio of 10.'
    chapter: '3.3'
    anchor: choosing-between-two-scenes-comes-down-to-one-gaussian-number
  - key: fisher
    title: Fisher information
    tex: 'F'
    role: none
    kind: A number; in the inverse square of the unit of the parameter
    meaning: 'How fast the predicted readings change with a parameter, in units of the noise, squared and summed: $F = \sum_i (\partial f_i/\partial\theta)^2/\sigma_n^2$. A change $1/\sqrt F$ moves the predictions by one standard deviation, and no unbiased estimate has a variance below $1/F$.'
    chapter: '3.3'
    anchor: the-fisher-information-measures-how-sharply-the-likelihood-peaks
  - key: fisher-matrix
    title: Fisher matrix
    tex: 'F_{kl}'
    role: none
    kind: A symmetric table, one row and column for each parameter
    meaning: 'The Fisher information of several parameters at once, $F_{kl} = \sum_i (\partial f_i/\partial\theta_k)(\partial f_i/\partial\theta_l)/\sigma_n^2$. The variance of an unbiased estimate of $\theta_1$ is at least $(F^{-1})_{11}$, which is never less than $1/F_{11}$.'
    chapter: '3.3'
    anchor: an-unknown-we-do-not-want-can-only-enlarge-the-error-of-one-we-do
  - key: pattern-snr
    title: Signal-to-noise ratio of the whole pattern
    tex: '\mathcal R'
    role: none
    kind: A pure number
    meaning: 'How many standard deviations of the noise separate the data of one point mass from the data of an empty scene, for a flat camera that fills its plane and reads $d = -\mathcal E_{zz}$: $\mathcal R^2 = N_0^{-1}\int d^2\,\mathrm d^2a$, so $\mathcal R = (\sqrt{3\pi}/4)\,\mathrm{SNR}$. It is 767 at $\mathrm{SNR} = 10^3$.'
    chapter: '3.3'
    anchor: one-mass-a-metre-away-is-placed-to-a-millimetre
  - key: array-reading
    title: Reading of the array
    tex: '\curv{d}'
    role: curv
    kind: A number at each pixel; in s⁻²
    meaning: 'What each pixel of a flat array records: the vertical entry of the tidal tensor with its sign changed, $d = -\mathcal E_{zz}$, so that a mass below gives a positive bump. Across the array its transform is $\tilde d = 2\pi G\,k\,e^{-kz}\,\tilde\sigma + \tilde n$ for a sheet at depth $z$.'
    chapter: '2.7'
    anchor: the-camera-records-a-tide-which-weights-each-ripple-by-k
  - key: rayleigh-quotient
    title: Rayleigh quotient
    tex: 'R_T(\mathbf x)'
    role: none
    kind: A number for each direction; in the unit of the entries of the matrix T
    meaning: 'The ratio $\mathbf x^{\mathsf T}T\mathbf x/\mathbf x^{\mathsf T}\mathbf x$ for a symmetric matrix $T$. It is an average of the eigenvalues of $T$, so it lies between the smallest and the largest, and reaches them along their eigenvectors.'
    chapter: '3.4'
    anchor: the-rayleigh-quotient-finds-the-strongest-and-weakest-directions
  - key: whitening-matrix
    title: Whitening matrix
    tex: 'W'
    role: none
    kind: A matrix; in the inverse of the unit of the readings
    meaning: 'The matrix $W = \Lambda^{-1/2}Q^{\mathsf T}$ built from the eigen-decomposition $C = Q\Lambda Q^{\mathsf T}$ of a noise covariance matrix. The whitened readings $W\mathbf y$ have independent noises of standard deviation one, so they are counted in noise standard deviations.'
    chapter: '3.4'
    anchor: whitening-turns-shared-noise-into-independent-noise-of-unit-size
  - key: design-matrix
    title: Design matrix
    tex: 'A'
    role: none
    kind: A matrix with one row per reading and one column per cell of the scene
    meaning: 'The matrix of a linear camera, $\mathbf y = A\mathbf m + \mathbf n$: column $k$ holds what one kilogram in cell $k$ gives every reading. Its singular value decomposition lists the scene patterns the camera sees and their gains. (Not the patch area $A$ of chapter 2.6.)'
    chapter: '3.4'
    anchor: every-linear-camera-is-a-set-of-patterns-gains-and-blind-spots
  - key: singular-value
    title: Singular value
    tex: 's_i'
    role: none
    kind: A number, never negative; in the unit of the entries of the matrix
    meaning: 'The gain of the $i$th pattern of a matrix: $A\mathbf v_i = s_i\mathbf u_i$, with $\mathbf v_i$ and $\mathbf u_i$ unit vectors. For a whitened camera counted against the prior it is the whitened gain, the $s$ of chapter 3.7 and the paper''s Eq. (19).'
    chapter: '3.4'
    anchor: every-linear-camera-is-a-set-of-patterns-gains-and-blind-spots
  - key: gain
    title: Gain of a reading
    tex: 'T'
    role: none
    kind: A number; in the unit of the reading per unit of the unknown
    meaning: 'The reading that one unit of the unknown produces, in the model $y = Tx + n$. For the flat tidal camera it depends on the ripple, $T(\vect k) = 2\pi G\,k\,e^{-kz}$, in m² kg⁻¹ s⁻². (Elsewhere $T$ is a temperature.)'
    chapter: '3.5'
    anchor: the-best-guess-of-one-number-weighs-the-reading-against-what-was-expected
  - key: point-spread-function
    title: Point-spread function
    tex: 'h(a)'
    role: none
    kind: A function of position; in m⁻¹ on a line
    meaning: 'The mean picture that a linear, shift-invariant reconstruction draws of a single point of unit mass, the inverse transform of its weights: on a row, with $a$ the distance along it, $h(a) = \int H(k)\,e^{ika}\,\mathrm dk/2\pi$. For the ideal low-pass filter it is $\sin(k_ca)/\pi a$.'
    chapter: '3.5'
    anchor: seen-in-space-a-filter-is-a-blur
  - key: cutoff-wavenumber
    title: Cut-off wavenumber
    tex: 'k_c'
    role: none
    kind: A wavenumber; in m⁻¹
    meaning: 'The finest ripple that a low-pass filter keeps. The ideal low-pass filter keeps every ripple with $|k| < k_c$ and none beyond, and blurs a point to a full width of $3.79/k_c$ on a line. For the Wiener filter of the flat camera, $k_c = q_c/z$.'
    chapter: '3.5'
    anchor: seen-in-space-a-filter-is-a-blur
  - key: flow-velocity
    title: Velocity of the matter
    tex: '\vect v(\vect x)'
    role: none
    kind: A vector at each point; in m/s
    meaning: 'The velocity of the matter at each point of a body: its velocity field. A rigidly turning body has $\vect v = \boldsymbol\Omega\times\vect x$. It is set plain, because it describes the scene, not the observer.'
    chapter: '2.8'
    anchor: a-flow-of-mass-is-a-mass-flux-and-mass-is-conserved
  - key: mass-flux
    title: Mass flux
    tex: '\matter{\vect J}'
    role: matter
    kind: A vector at each point; in kg m⁻² s⁻¹
    meaning: 'The density times the velocity, $\vect J = \rho\vect v$: the mass that crosses a unit area per second, and also the momentum per unit volume (the paper''s density of momentum in Section XIII). Mass is conserved, so $\partial\rho/\partial t + \nabla\cdot\vect J = 0$. Not the impulse of chapter 1.6, nor the current column $\vect J(\hat n)$.'
    chapter: '2.8'
    anchor: a-flow-of-mass-is-a-mass-flux-and-mass-is-conserved
  - key: flow-potential
    title: Potential of a flow
    tex: '\field{\vect A}'
    role: field
    kind: A vector at each point; in kg/s
    meaning: 'The mass flux added up as chapter 2.4 adds up the density for the potential: $\vect A(\vect x) = \int\vect J(\vect y)/|\vect x - \vect y|\,\mathrm d^3y$, so that $\nabla^2\vect A = -4\pi\vect J$. Outside a body the magnetic part of the tide is made from its curl (chapter 7.5), so a flow whose $\vect A$ is a gradient outside is silent there.'
    chapter: '2.8'
    anchor: a-flow-has-a-potential-of-its-own-built-like-the-gravitational-one
  - key: current-column
    title: Current column
    tex: '\vect J(\hat n)'
    role: none
    kind: A vector for each direction; in kg m⁻² s⁻¹
    meaning: 'The mass flux along the line of sight in the direction $\hat n$, each part weighted by the inverse of its distance: $\vect J(\hat n) = \int\rho\vect v(r\hat n)\,\mathrm dr/r$. Only its part across the line of sight enters the magnetic part of the tide. The twin of the tidal column $S(\hat n)$, and like it set plain; always written with its direction, so that it is not mistaken for the mass flux at a point.'
    chapter: '2.8'
    anchor: the-current-column-is-the-flow-along-a-line-of-sight-weighted-by-inverse-distance
  - key: stream-function
    title: Stream function
    tex: '\chi'
    role: none
    kind: A number at each point of a meridian plane; in kg/s
    meaning: 'For a steady flow that is the same all round an axis, $2\pi\chi$ at a point is the mass per second crossing upward, along $+z$, through the disc spanned by the circle about the axis through that point (or through any other surface bounded by that circle). The flow in the meridian planes runs along the contours of $\chi$, which is zero on the axis and on the surface of a confined flow. Not the paper''s response functions $\chi_h$.'
    chapter: '2.8'
    anchor: every-steady-flow-round-an-axis-is-a-swirl-plus-rolls
  - key: roll-vector
    title: Vector of a silent flow
    tex: '\vect V'
    role: none
    kind: A vector at each point; in kg/s
    meaning: 'A vector confined to a body, zero outside it with its first derivatives, whose curl of a curl is the flow: $\vect J = \nabla\times\nabla\times\vect V$. The meridional rolls of an axially symmetric flow are of this form, with $\vect V = P\vect x$, and every such flow is silent outside.'
    chapter: '2.8'
    anchor: rolls-are-silent-outside-because-their-potential-there-is-a-gradient
  - key: roll-potential
    title: Potential of the vector of a silent flow
    tex: '\vect W'
    role: none
    kind: A vector at each point; in kg m² s⁻¹
    meaning: 'The vector $\vect V$ added up as a potential, $\vect W(\vect x) = \int\vect V(\vect y)/|\vect x - \vect y|\,\mathrm d^3y$. The flow''s potential is $\vect A = \nabla\times\nabla\times\vect W$, which outside the body is the gradient $\nabla(\nabla\cdot\vect W)$. Not the paper''s complex curvature $\mathcal W$.'
    chapter: '2.8'
    anchor: rolls-are-silent-outside-because-their-potential-there-is-a-gradient
  - key: bessel-j0
    title: Bessel function of order zero
    tex: 'J_0'
    role: none
    kind: A function of a pure number; no unit
    meaning: 'The circular ripple: a ripple averaged over all its directions in a plane, $J_0(u) = \frac1{2\pi}\int_0^{2\pi}e^{iu\cos\varphi}\,\mathrm d\varphi = 1 - u^2/4 + u^4/64 - \dots$. It turns the Fourier transform of a pattern that is the same in every direction into $\tilde f(k) = 2\pi\int_0^\infty f(a)\,J_0(ka)\,a\,\mathrm da$. Its first zeros are 2.405, 5.520 and 8.654.'
    chapter: '3.6'
    anchor: a-pattern-that-looks-the-same-in-every-direction-is-built-from-circular-ripples
  - key: bessel-j1
    title: Bessel function of order one
    tex: 'J_1'
    role: none
    kind: A function of a pure number; no unit
    meaning: 'The function $J_1 = -J_0''$, so that $\frac{\mathrm d}{\mathrm du}(uJ_1) = uJ_0$ and $\int_0^uJ_0(t)\,t\,\mathrm dt = uJ_1(u)$; near zero $J_1(u) \approx u/2$. A round opening of radius $R$ transforms to $\pi R^2\cdot2J_1(kR)/kR$. Its first zeros are 3.832, 7.016 and 10.173.'
    chapter: '3.6'
    anchor: the-function-of-order-one-adds-up-the-circular-ripple-over-a-disc
  - key: entropy
    title: Entropy
    tex: 'H(x)'
    role: none
    kind: A number for an unknown that takes one of several values; in bits
    meaning: 'The uncertainty of an unknown $x$ that takes the value $x_i$ with the probability $p_i$: $H(x) = -\sum_i p_i\log_2 p_i$, the average number of well-chosen yes-or-no questions needed to find it. For $N$ equally likely cases it is $\log_2 N$. Always written with its argument, since the bare $H$ is the Wiener weight (chapter 3.5) and the $H$ of Section XII a number of bits, written $C_{\rm body}$ in chapter 3.8.'
    chapter: '3.8'
    anchor: a-bit-is-the-answer-to-one-yes-or-no-question
  - key: differential-entropy
    title: Differential entropy
    tex: 'h(x)'
    role: none
    kind: A number for a continuous unknown; in bits, shifted by the choice of unit
    meaning: 'The entropy of a continuous number $x$ with density $p(x)$, $h(x) = -\int p\log_2 p\,\mathrm dx$. Naming $x$ to within a bin of width $\Delta$ takes about $h(x) - \log_2\Delta$ bits, so only differences of $h$ are measured. For a Gaussian of standard deviation $\sigma_x$ it is $\tfrac12\log_2(2\pi e\,\sigma_x^2)$, the largest of all densities with that variance.'
    chapter: '3.8'
    anchor: a-number-with-a-spread-has-a-differential-entropy-and-only-its-changes-count
  - key: mutual-information
    title: Mutual information
    tex: 'I(x;y)'
    role: none
    kind: A number for a pair of unknowns; in bits
    meaning: 'What a reading $y$ removes of the uncertainty about $x$: $I(x;y) = h(x) - h(x|y) = h(y) - h(y|x)$. For a reading $y = Tx + n$ in Gaussian noise it is at most $\tfrac12\log_2(1 + s^2)$, with $s = T\sigma_x/\sigma_n$, reached when $x$ is Gaussian. (Not the invariant $I = \mathrm{tr}\,\mathcal W^2$, nor a moment of inertia.)'
    chapter: '3.8'
    anchor: a-number-with-a-spread-has-a-differential-entropy-and-only-its-changes-count
  - key: capacity
    title: Information of a near-field picture
    tex: 'C'
    role: none
    kind: A pure number; bits per area $z^2$ of the scene
    meaning: 'The most bits that a near-field camera''s data carry about a flat scene, per patch of side $z$: $C = \frac1{4\pi}\int_0^\infty q\log_2(1 + \pi^2\mathrm{SNR}^2q^2e^{-2q})\,\mathrm dq$, close to $(q_c^3/3 - q_c^2/2)/4\pi\ln 2$. It is a bound, reached by a scene whose ripples are Gaussian with the prior''s spectrum. It is 37.9 bits at $\mathrm{SNR} = 10^3$ and $1.78\times10^5$ at $10^{70}$. (Not the flyby constant $C$ of chapter 1.8.)'
    chapter: '3.8'
    anchor: a-picture-is-many-ripples-with-independent-noise-and-their-bits-add
  - key: hair-bits
    title: Bits of a body's field
    tex: 'C_{\rm body}'
    role: none
    kind: A pure number; bits
    meaning: 'The bits that the field outside a body holds at one time, read on a sphere of radius $R_c$ about a body of radius $R$ with the monopole at the signal-to-noise ratio $\mathrm{SNR}$: $C_{\rm body} \approx [L^3/3\Lambda^2 + L^2/2\Lambda]/\ln 2$, with the paper''s $L = \ln\mathrm{SNR}$ and $\Lambda = \ln(R_c/R)$. The paper writes it $H$. From three radii at $10^6$ it is about 1200 bits; a black hole at rest gives at most $7\log_2\mathrm{SNR}$.'
    chapter: '3.8'
    anchor: a-bodys-field-at-one-time-holds-about-1200-bits-from-three-radii-away
  - key: line-moment
    title: Moment of masses on a line
    tex: '\matter{\mu}_n'
    role: matter
    kind: A number for each whole number $n$; in kg mⁿ
    meaning: 'For masses $m_i$ at the places $x_i$ of a line, $\mu_n = \sum_i m_ix_i^n$: the total mass for $n = 0$, the mass times the centre of mass for $n = 1$, and the spread for $n = 2$. For positive masses every Hankel matrix of moments, $\mu_{i+j}$ in row $i$ and column $j$, is positive semidefinite. (Not the rigidity $\mu$ or a passing mass.)'
    chapter: '3.9'
    anchor: a-positive-distribution-of-mass-is-fixed-by-a-few-of-its-moments
  - key: complex-quadrupole
    title: Complex quadrupole of a thin layer
    tex: '\matter{Q}_c'
    role: matter
    kind: A complex number; in kg m²
    meaning: 'For a thin layer of surface density $\sigma$ with mass $M$ and centre of mass $w_{\rm cm}$, $Q_c = \int\sigma\,(w'' - w_{\rm cm})^2\,\mathrm d^2w''$, with places written as complex numbers. It holds the two quadrupole numbers within the plane, $(Q_{xx} - Q_{yy} + 2iQ_{xy})/3$, and places the zeros of the shear far above the layer at $w_{\rm cm} \pm i\sqrt{Q_c/M}$.'
    chapter: '3.9'
    anchor: the-zeros-of-the-shear-survive-the-blur
  - key: line-element
    title: Line element
    tex: '\mathrm{d}s^2'
    role: none
    kind: A rule giving a squared length for each small step; here a pure number
    meaning: 'The squared length of a small step of the coordinates. Below a flat camera, measured in units of the depth $z$, it is $\mathrm ds^2 = (\mathrm dx^2 + \mathrm dy^2 + \mathrm dz^2)/z^2$, the line element of hyperbolic space.'
    chapter: '3.9'
    anchor: the-space-below-a-flat-camera-is-hyperbolic
  - key: metric
    title: Metric
    tex: 'g_{ij}'
    role: none
    kind: A symmetric table of numbers at each point
    meaning: 'The table that turns a small step into a squared length, $\mathrm ds^2 = g_{ij}\,\mathrm dx_i\,\mathrm dx_j$. Below a flat camera it is $\delta_{ij}/z^2$. (Not the gravitational field $g$ or a tidal profile $g$.)'
    chapter: '3.9'
    anchor: the-space-below-a-flat-camera-is-hyperbolic
  - key: hyperbolic-laplacian
    title: Laplacian of hyperbolic space
    tex: '\nabla^2_H'
    role: none
    kind: An operator on functions of place
    meaning: 'The Laplace–Beltrami operator of the metric $\delta_{ij}/z^2$: $\nabla^2_Hu = z^2\nabla^2u - z\,\partial_zu$. With $u = z^{1/2}\Phi$, Laplace''s equation becomes $(\nabla^2_H + \tfrac34)u = 0$.'
    chapter: '3.9'
    anchor: the-space-below-a-flat-camera-is-hyperbolic
  - key: lifted-potential
    title: Potential on hyperbolic space
    tex: '\field{u}'
    role: field
    kind: A number at each point below the camera; in J kg⁻¹ m^½
    meaning: 'The potential times the square root of the depth, $u = z^{1/2}\Phi$. It obeys $(\nabla^2_H + \tfrac34)u = 0$ wherever $\nabla^2\Phi = 0$. (Not the scaled radius $u$ of chapters 3.6 and 3.7.)'
    chapter: '3.9'
    anchor: the-space-below-a-flat-camera-is-hyperbolic
  - key: stiffness
    title: Stiffness
    tex: 'k'
    role: none
    kind: A number; in N m⁻¹
    meaning: 'The force a spring pulls back with per metre of stretch, so that its force is $-kq$. With the mass $m$ it sets the natural frequency $\omega_0 = \sqrt{k/m}$. (Not the wavenumber $k$ of chapter 2.6, nor Boltzmann''s constant $k_B$.)'
    chapter: '4.1'
    anchor: a-mass-on-a-spring-swings-at-one-frequency
  - key: natural-frequency
    title: Natural frequency
    tex: '\omega_0'
    role: none
    kind: A number; an angular frequency, in s⁻¹ (radians per second)
    meaning: 'The angular frequency at which an oscillator swings when left alone without friction, $\omega_0 = \sqrt{k/m}$ for a mass on a spring. For chapter 1.7''s cart it is $5\,\mathrm{s^{-1}}$, a period of 1.26 s.'
    chapter: '4.1'
    anchor: a-mass-on-a-spring-swings-at-one-frequency
  - key: damping-rate
    title: Damping rate
    tex: '\Gamma'
    role: none
    kind: A number; a rate, in s⁻¹
    meaning: 'The friction of an oscillator, defined by the law of motion $m\ddot q + m\Gamma\dot q + kq = 0$. The amplitude of a free swing falls as $e^{-\Gamma t/2}$ and its energy as $e^{-\Gamma t}$, and $\Gamma$ is also the full width at half maximum of the oscillator''s line. A subscript $n$ counts modes: $\Gamma_n$ is the damping rate of mode $n$. (Not the greybody factors $\Gamma_\ell$ of Section XIV, which carry the degree $\ell$.)'
    chapter: '4.1'
    anchor: friction-makes-the-swing-die-away-and-the-quality-factor-counts-how-slowly
  - key: damped-frequency
    title: Frequency of a damped swing
    tex: '\omega_d'
    role: none
    kind: A number; an angular frequency, in s⁻¹
    meaning: 'The angular frequency of a dying swing, $\omega_d = \sqrt{\omega_0^2 - \Gamma^2/4}$, a little below the natural frequency. It is imaginary when $Q < \tfrac12$, and then the oscillator does not swing.'
    chapter: '4.1'
    anchor: friction-makes-the-swing-die-away-and-the-quality-factor-counts-how-slowly
  - key: quality-factor
    title: Quality factor
    tex: 'Q'
    role: none
    kind: A pure number
    meaning: 'How slowly an oscillator rings down, $Q = \omega_0/\Gamma$: the energy falls by a factor $e$ in $Q/2\pi$ swings, and $Q$ is also the frequency of the line over its width. In Part 4 a bare $Q$ is always a quality factor; a moment of the mass always carries a subscript ($Q_h$, $Q_{\ell m}$, $Q_{ij}$).'
    chapter: '4.1'
    anchor: friction-makes-the-swing-die-away-and-the-quality-factor-counts-how-slowly
  - key: response-function
    title: Response function
    tex: '\chi(\omega)'
    role: none
    kind: A complex function of the angular frequency; for a cart, in m N⁻¹
    meaning: 'The steady swing per unit of a push that rises and falls at the angular frequency $\omega$, $\tilde q = \chi(\omega)\tilde F$ in phasors. For a damped oscillator $\chi = 1/m(\omega_0^2 - \omega^2 - i\Gamma\omega)$. Its imaginary part, positive in the paper''s convention $e^{-i\omega t}$, takes energy from the push; its real part stores and returns it. The same letter with a time, $\chi(t)$, is the answer to a single blow. (Not the stream function $\chi$ of chapter 2.8.)'
    chapter: '4.1'
    anchor: a-steady-push-gets-a-steady-answer-the-response-function-times-the-push
  - key: mean-power
    title: Average power
    tex: '\bar P'
    role: none
    kind: A number; in watts
    meaning: 'The work a push does per second, averaged over a swing: $\bar P = \tfrac12\omega\,\mathrm{Im}\,\chi(\omega)\,|\tilde F|^2$ for a push of phasor $\tilde F$. Plotted against the frequency it is a line of width $\Gamma$. (Not a projector $P_{ij}$.)'
    chapter: '4.1'
    anchor: only-the-imaginary-part-of-the-response-takes-energy-from-the-push
  - key: wave-field
    title: Wave field
    tex: 'u'
    role: none
    kind: A number at each point and time; for a shear wave, a sideways displacement in metres
    meaning: 'The quantity that obeys the wave equation $\partial_t^2u = c^2\nabla^2u$: in chapter 5.1 the sideways displacement of a sheared solid, and in Part 5 any field that travels as a wave. (Not the paper''s retarded time $u = t - r/c$, nor the scaled radius $u$ of chapters 3.6 and 3.7.)'
    chapter: '5.1'
    anchor: a-shear-in-a-solid-travels-and-its-law-is-the-wave-equation
  - key: shear-speed
    title: Speed of shear waves
    tex: 'c_T'
    role: none
    kind: A speed; in m s⁻¹
    meaning: 'The speed $c_T = \sqrt{\mu/\rho}$ at which a shear travels through a solid of shear modulus $\mu$ and density $\rho$. Steel has $c_T \approx 3000\ \mathrm{m\,s^{-1}}$, a hundred-thousandth of the speed of light.'
    chapter: '4.3'
    anchor: a-solid-carries-two-kinds-of-sound
  - key: angular-frequency
    title: Angular frequency
    tex: '\omega'
    role: none
    kind: A rate; in radians per second (s⁻¹)
    meaning: 'How fast an oscillation turns, $2\pi$ times its frequency $f$. A wave of one frequency varies in time as $e^{-i\omega t}$, and in empty space $\omega = ck$.'
    chapter: '5.1'
    anchor: a-plane-wave-is-a-turning-number-that-travels
  - key: wavelength
    title: Wavelength
    tex: '\lambda'
    role: none
    kind: A length; in metres
    meaning: 'The distance between neighbouring crests of a wave, $\lambda = 2\pi/k = c/f$. A gravitational wave of 1 kHz is 300 km long. (Not an eigenvalue, as in chapter 3.4, nor a mass per length, as in chapter 2.4.)'
    chapter: '5.1'
    anchor: a-plane-wave-is-a-turning-number-that-travels
  - key: frequency
    title: Frequency
    tex: 'f'
    role: none
    kind: A rate; in hertz (cycles per second)
    meaning: 'The number of crests of a wave that pass a fixed point each second, $f = \omega/2\pi$. The wavelength is $\lambda = c/f$.'
    chapter: '5.1'
    anchor: a-plane-wave-is-a-turning-number-that-travels
  - key: decay-rate
    title: Rate of fading across a plane
    tex: '\kappa'
    role: none
    kind: A rate per length; in m⁻¹
    meaning: 'The rate $\kappa = \sqrt{k^2 - \omega^2/c^2}$ at which a ripple of wavenumber $k$ across a plane fades with the height $z$, as $e^{-\kappa z}$, when its crests are closer together than a wavelength. At zero frequency it is $k$, the fade of Laplace''s equation: at zero frequency this is the paper''s cone $\kappa = K$ of its scene transform.'
    chapter: '5.1'
    anchor: a-ripple-finer-than-a-wavelength-across-a-plane-fades-instead-of-travelling
  - key: refractive-index
    title: Refractive index
    tex: 'n'
    role: none
    kind: A pure number
    meaning: 'The speed of a wave in empty space over its phase speed in a medium, $n = ck/\omega$. A slab of thickness $L$ delays the phase by $(n - 1)\omega L/c$. For a gravitational wave in steel at 1 kHz, $n - 1 = 8.3 \times 10^{-14}$. (Not the noise $n(t)$ of chapter 3.2.)'
    chapter: '5.1'
    anchor: a-medium-can-slow-a-wave-and-its-refractive-index-measures-how-much
  - key: absorption-coefficient
    title: Absorption coefficient
    tex: '\alpha'
    role: none
    kind: A rate per length; in m⁻¹
    meaning: 'The fraction of a wave''s energy lost per metre, $\alpha = \Gamma/c$ for a damping rate $\Gamma$. For a gravitational wave in matter of viscosity $\eta$ it is $16\pi G\eta/c^3$, about $10^{-37}\ \mathrm{m^{-1}}$ in water. (Not the phase $\alpha$ of chapter 1.5b.)'
    chapter: '5.1'
    anchor: a-damping-term-makes-a-wave-fade-at-a-fixed-rate-per-metre
  - key: temperature
    title: Temperature
    tex: 'T'
    role: none
    kind: A number; in kelvin
    meaning: 'What two bodies in contact come to share when heat stops flowing between them on average. As an energy, $k_BT = 4.14 \times 10^{-21}\,\mathrm{J}$ at 300 K; heat gives $\tfrac12k_BT$ on average to each quadratic term of a body''s energy, and so $k_BT$ to each mode of vibration. Defined by $1/k_BT = \mathrm d\ln\Omega/\mathrm dE$. (In Part 4 a $T$ without indices is always a temperature; earlier it was also a period, a record''s length and a gain.)'
    chapter: '4.2'
    anchor: temperature-is-what-bodies-in-contact-come-to-share
  - key: state-count
    title: Count of states
    tex: '\Omega(E)'
    role: none
    kind: A pure number, as a function of energy
    meaning: 'The number of states of a large body, its heat bath, that have the energy $E$: the volume of phase space at that energy, cut into cells. Its logarithm grows smoothly, and its slope is $1/k_BT$. (Not a rotation rate or a solid angle.)'
    chapter: '4.2'
    anchor: the-chance-of-a-state-falls-exponentially-with-its-energy
  - key: displacement
    title: Displacement
    tex: '\boldsymbol{u}'
    role: none
    kind: A vector at each point of a solid; in metres
    meaning: 'How far the bit of a solid that sat at $\boldsymbol x$ has moved, to $\boldsymbol x + \boldsymbol u(\boldsymbol x)$. Only the way it changes from point to point, the strain, stretches the material. (Not the paper''s retarded time $u = t - r/c$.)'
    chapter: '4.3'
    anchor: a-deformation-is-a-displacement-field-and-its-strain-is-the-part-that-changes-lengths
  - key: strain-tensor
    title: Strain
    tex: 'u_{ij}'
    role: none
    kind: A symmetric table of pure numbers
    meaning: 'The symmetric part of the derivatives of the displacement, $u_{ij} = \tfrac12(\partial_iu_j + \partial_ju_i)$. A short step along the unit vector $\hat n$ grows by the fraction $u_{ij}\hat n_i\hat n_j$; the trace $u_{kk}$ is the fractional change of volume, and the trace-free part $\tilde u_{ij}$ is a shear. Landau and Lifshitz''s letter, chosen so that $\epsilon_{ijk}$ keeps its meaning.'
    chapter: '4.3'
    anchor: a-deformation-is-a-displacement-field-and-its-strain-is-the-part-that-changes-lengths
  - key: stress-tensor
    title: Stress
    tex: '\matter{T_{ij}}'
    role: matter
    kind: A symmetric table; force per area, in pascals
    meaning: 'The force per area that material exerts across a small face: $T_{ij}\hat n_j\,\mathrm dA$ on a face of area $\mathrm dA$ and normal $\hat n$. A fluid at rest has $T_{ij} = -p\,\delta_{ij}$. The paper''s $T_{kl}$ in its wave-zone formula is the flow of momentum, which for matter at rest is this table with its sign reversed ($+p\,\delta_{kl}$ for a fluid), plus $\rho v_kv_l$ for moving matter (chapter 5.2). (A temperature $T$ has no indices.)'
    chapter: '4.3'
    anchor: stress-is-force-per-area-and-it-too-is-a-symmetric-table
  - key: bulk-modulus
    title: Bulk modulus
    tex: '\matter{K}'
    role: matter
    kind: A number; in pascals
    meaning: 'The pressure needed for each unit of fractional loss of volume, $p = -K\,\delta V/V$: the stiffness of a material against a change of size. The tutorial''s steel has 145 GPa (handbook steels near 160 GPa), water 2.2 GPa. (Not chapter 1.6''s kinetic energy, nor the bold stiffness matrix $\mathbf K$.)'
    chapter: '4.3'
    anchor: in-a-uniform-solid-the-stress-answers-each-part-of-the-strain-with-its-own-modulus
  - key: shear-modulus
    title: Shear modulus
    tex: '\matter{\mu}'
    role: matter
    kind: A number; in pascals
    meaning: 'The rigidity of a material, its stiffness against a change of shape: the trace-free stress is $2\mu$ times the trace-free strain. The tutorial''s steel, with $c_T = 3000\ \mathrm{m\,s^{-1}}$ and $\rho = 7850\ \mathrm{kg\,m^{-3}}$, has $\mu = \rho c_T^2 = 71$ GPa; a liquid at rest has $\mu = 0$. (Not a passing mass, as in chapter 1.8.)'
    chapter: '4.3'
    anchor: in-a-uniform-solid-the-stress-answers-each-part-of-the-strain-with-its-own-modulus
  - key: elastic-energy-density
    title: Elastic energy density
    tex: '\varepsilon_{\rm el}'
    role: none
    kind: A number at each point; in joules per cubic metre
    meaning: 'The energy stored in each cubic metre of a strained solid, $\varepsilon_{\rm el} = \tfrac12K\,u_{kk}^2 + \mu\,\tilde u_{ij}\tilde u_{ij}$, half the stress times the strain. It is positive for every strain in a stable solid.'
    chapter: '4.3'
    anchor: a-strain-stores-energy-half-the-stress-times-the-strain
  - key: compressional-speed
    title: Speed of compressional sound
    tex: 'c_L'
    role: none
    kind: A speed; in m s⁻¹
    meaning: 'The speed $c_L = \sqrt{(K + \tfrac43\mu)/\rho}$ of a sound wave that moves a solid along its direction of travel. It is always faster than shear sound; for steel it is about 1.84 times $c_T$, and in a liquid it is ordinary sound, 1480 m/s in water.'
    chapter: '4.3'
    anchor: a-solid-carries-two-kinds-of-sound
  - key: stiffness-matrix
    title: Stiffness matrix
    tex: '\mathbf K'
    role: none
    kind: A symmetric matrix, one row and column per coordinate; in N m⁻¹
    meaning: 'The table that gives the energy stored in a set of springs, $\tfrac12\mathbf q^{\mathsf T}\mathbf K\mathbf q$, and the force $-\mathbf K\mathbf q$ on the coordinates $\mathbf q$. Its zero directions are the motions that stretch no spring. (Bold, so that it is not the bulk modulus $K$.)'
    chapter: '4.3'
    anchor: masses-on-springs-move-in-normal-modes
  - key: mass-matrix
    title: Mass matrix
    tex: '\mathbf M'
    role: none
    kind: A diagonal matrix; in kilograms
    meaning: 'The table that gives the kinetic energy of a set of masses, $\tfrac12\dot{\mathbf q}^{\mathsf T}\mathbf M\dot{\mathbf q}$, with each mass on the diagonal once for each of its coordinates. The normal modes are the eigenvectors of $\mathbf M^{-1/2}\mathbf K\mathbf M^{-1/2}$. (Bold, so that it is not a mass $M$.)'
    chapter: '4.3'
    anchor: masses-on-springs-move-in-normal-modes
  - key: viscosity
    title: Shear viscosity
    tex: '\matter{\eta}'
    role: matter
    kind: A number; in pascal seconds (Pa s)
    meaning: 'The stress with which a fluid answers a rate of shear: the viscous stress is $2\eta\,\dot{\tilde u}_{ij}$, and between two plates a gap $d$ apart, one sliding at the speed $v$, it is $\eta v/d$. Water has about $10^{-3}$ Pa s, honey about 10 Pa s. At a frequency $\omega$ the friction that counts is $\mathrm{Re}\,\eta(\omega)$. (Not the rapidity or the $\eta_{\mu\nu}$ of Parts 6 and 7, nor the vector $\boldsymbol\eta$ of chapter 13.2.)'
    chapter: '4.4'
    anchor: viscosity-is-a-stress-that-answers-how-fast-a-shape-changes
  - key: static-viscosity
    title: Everyday (static) viscosity
    tex: '\matter{\eta_0}'
    role: matter
    kind: A number; in pascal seconds
    meaning: 'The viscosity felt when a liquid is stirred slowly, the limit of the dynamic viscosity $\eta(\omega)$ as $\omega \to 0$. In Maxwell''s model $\eta_0 = \mu_\infty\tau$.'
    chapter: '4.4'
    anchor: maxwells-model-is-a-liquid-when-slow-and-a-solid-when-fast
  - key: dynamic-viscosity
    title: Dynamic viscosity
    tex: '\matter{\eta(\omega)}'
    role: matter
    kind: A complex function of the angular frequency; in pascal seconds
    meaning: 'The viscosity at the frequency $\omega$, defined by the stress phasor $\tilde T = 2\eta(\omega)(-i\omega U)$ for a shear of phasor $U$. Its real part $\mathrm{Re}\,\eta$ is the friction, which turns work into heat; its imaginary part is stored and returned. For Maxwell''s model $\eta(\omega) = \eta_0/(1 - i\omega\tau)$, so $\mathrm{Re}\,\eta = \eta_0/(1 + \omega^2\tau^2)$.'
    chapter: '4.4'
    anchor: maxwells-model-is-a-liquid-when-slow-and-a-solid-when-fast
  - key: relaxation-time
    title: Relaxation time
    tex: '\tau'
    role: none
    kind: A time; in seconds
    meaning: 'The time in which a held stress dies away by a factor $e$, $\tau = \eta_0/\mu_\infty$ in Maxwell''s model: about 10 ns for honey with an assumed rigidity of 1 GPa. In a metal it is the collision time of the free electrons, $2.5\times10^{-14}$ s in copper. (Not the averaging time of chapter 3.2, the optical depth of chapter 5.5 or the proper time of Part 6.)'
    chapter: '4.4'
    anchor: maxwells-model-is-a-liquid-when-slow-and-a-solid-when-fast
  - key: unrelaxed-modulus
    title: Unrelaxed rigidity
    tex: '\matter{\mu_\infty}'
    role: matter
    kind: A number; in pascals
    meaning: 'The stiffness of a material against a shear too sudden for it to relax, $\mu_\infty = \eta_0/\tau$ in Maxwell''s model. Far above $1/\tau$ the material answers as a solid of this rigidity, and its friction falls as $\mu_\infty^2/\eta_0\omega^2$. For copper''s free electrons it is $\tfrac25nE_F = 38$ GPa.'
    chapter: '4.4'
    anchor: maxwells-model-is-a-liquid-when-slow-and-a-solid-when-fast
  - key: relaxed-modulus
    title: Relaxed rigidity
    tex: '\matter{\mu_0}'
    role: matter
    kind: A number; in pascals
    meaning: 'The stiffness of a material against a slow shear. It is zero for a liquid, including a Maxwell liquid. The difference $\Delta\mu = \mu_\infty - \mu_0$ is the stiffness that relaxes, the paper''s weight of a source of friction, which fixes the total friction in its sum rule.'
    chapter: '4.4'
    anchor: maxwells-model-is-a-liquid-when-slow-and-a-solid-when-fast
  - key: complex-modulus
    title: Complex modulus
    tex: '\matter{\mu(\omega)}'
    role: matter
    kind: A complex function of the angular frequency; in pascals
    meaning: 'The stress per shear at the frequency $\omega$, $\tilde T = 2\mu(\omega)U$, equal to $-i\omega\eta(\omega)$. It runs from the relaxed rigidity $\mu_0$ at low frequency to the unrelaxed $\mu_\infty$ at high frequency, and its imaginary part, $-\omega\,\mathrm{Re}\,\eta$, is negative.'
    chapter: '4.4'
    anchor: maxwells-model-is-a-liquid-when-slow-and-a-solid-when-fast
  - key: effective-friction
    title: Effective friction
    tex: '\matter{\eta_{\rm eff}}'
    role: matter
    kind: A number; in pascal seconds
    meaning: 'The constant friction, the same at every frequency, that would make a body glow with the same total power as its real friction $\mathrm{Re}\,\eta(\omega)$: an average over the glow''s band weighted by the Planck spectrum. The paper''s Table of materials lists it; water''s is $5.4\times10^{-5}$ Pa s and copper''s $1.3\times10^{-4}$ Pa s at 293 K.'
    chapter: '4.4'
    anchor: at-fixed-stiffness-the-more-viscous-liquid-has-less-friction-at-the-frequencies-of-heat
  - key: electron-density
    title: Density of free electrons
    tex: '\matter{n}'
    role: matter
    kind: A number per volume; in m⁻³
    meaning: 'The number of free (conduction) electrons in each cubic metre of a metal: $8.47\times10^{28}\ \mathrm{m^{-3}}$ in copper, one per atom. (Not the refractive index $n$ of chapter 5.1, nor a noise.)'
    chapter: '4.4'
    anchor: a-metals-electrons-relax-like-a-maxwell-liquid-and-their-friction-has-a-ceiling
  - key: fermi-energy
    title: Fermi energy
    tex: 'E_F'
    role: none
    kind: An energy; in joules or electronvolts
    meaning: 'The energy of a metal''s fastest free electrons, $E_F = \tfrac12mv_F^2$. At most two electrons can share a state of motion, so they fill the states from the slowest upward to this energy: 7.0 eV in copper. Stated in chapter 4.4 and derived in chapter 10.3.'
    chapter: '4.4'
    anchor: a-metals-electrons-relax-like-a-maxwell-liquid-and-their-friction-has-a-ceiling
  - key: fermi-speed
    title: Fermi speed
    tex: 'v_F'
    role: none
    kind: A speed; in m s⁻¹
    meaning: 'The speed of the fastest free electrons of a metal, $v_F = \sqrt{2E_F/m}$: $1.57\times10^6\ \mathrm{m\,s^{-1}}$ in copper, half a per cent of the speed of light.'
    chapter: '4.4'
    anchor: a-metals-electrons-relax-like-a-maxwell-liquid-and-their-friction-has-a-ceiling
  - key: principal-value
    title: Principal value
    tex: '\mathrm P'
    role: none
    kind: A rule for an integral; no unit of its own
    meaning: 'Written before an integral whose integrand grows without bound at one point with opposite signs on the two sides, as $1/(\omega'' - \omega)$ does: leave out the interval from $\omega - \delta$ to $\omega + \delta$, integrate over the rest, and let $\delta$ shrink to zero. (Not a power or a projector.)'
    chapter: '4.5'
    anchor: causality-ties-the-stiffness-of-a-response-to-its-friction
  - key: response-sum
    title: Sum of a response
    tex: 'A'
    role: none
    kind: A number; in the unit of the response function times s⁻²
    meaning: 'The constant in a response''s answer to a fast push, $\chi \to -A/\omega^2$, equal by causality to $\tfrac2\pi\int_0^\infty\omega\,\mathrm{Im}\,\chi\,\mathrm d\omega$. For a cart of mass $m$ it is $1/m$; for a body under the tide of shape $h$ it is the paper''s $A = \int\rho\,|\nabla h|^2\,\mathrm dV$. (Not the amplitude of a swing, the area of a patch, a design matrix or a vector potential.)'
    chapter: '4.5'
    anchor: at-the-two-ends-of-the-spectrum-the-relation-becomes-two-sums
  - key: tide-strength
    title: Strength of an applied tide
    tex: 'F'
    role: none
    kind: A number that may change in time; in the unit that makes $Fh$ an energy per kilogram
    meaning: 'The strength of a tide whose potential across a body is $\Phi = -F(t)\,h(\boldsymbol x)$, with $h$ harmonic. The body''s energy in it is $-FQ_h$, so $F$ pushes on the moment $Q_h$. For $h = x$ it is an acceleration; for $h = xy$ it is in s⁻², a tide. (Not a force in newtons.)'
    chapter: '4.5'
    anchor: driven-faster-than-its-bonds-every-body-answers-as-dust
  - key: tide-response
    title: Response to an applied tide
    tex: '\chi_h'
    role: none
    kind: A complex function of the angular frequency; a moment per unit of tide strength
    meaning: 'The response of the moment $Q_h = \int\rho h\,\mathrm dV$ to a tide of potential $-Fh$, $\tilde Q_h = \chi_h\tilde F$; $\chi_{gh}$ is the response of a second moment $Q_g$. Far above every frequency of the body, $\chi_{gh} \to -\int\rho\,\nabla g\cdot\nabla h\,\mathrm dV/\omega^2$, the response of dust, and so $\tfrac2\pi\int_0^\infty\omega\,\mathrm{Im}\,\chi_h\,\mathrm d\omega = \int\rho\,|\nabla h|^2\,\mathrm dV$.'
    chapter: '4.5'
    anchor: driven-faster-than-its-bonds-every-body-answers-as-dust
  - key: thermal-force
    title: Random force of a bath
    tex: 'F_{\rm th}'
    role: none
    kind: A random function of time; a force in newtons, mean zero
    meaning: 'The uneven kicks that the molecules of a bath give a body, in the Langevin equation $m\dot v = -m\Gamma v + F_{\rm th}$. Its spectrum is white, $S_F = 2m\Gamma k_BT$: the kicks are as strong as the friction requires.'
    chapter: '4.6'
    anchor: a-grain-in-water-is-kicked-at-random-and-slowed-by-friction-and-the-two-are-linked
  - key: force-spectrum
    title: Spectrum of the random force
    tex: 'S_F'
    role: none
    kind: A constant (two-sided spectrum of white noise); in N² s
    meaning: 'The strength of a bath''s random kicks, $S_F = 2m\Gamma k_BT$, fixed by equipartition: a body that the bath slows harder must be kicked harder.'
    chapter: '4.6'
    anchor: a-grain-in-water-is-kicked-at-random-and-slowed-by-friction-and-the-two-are-linked
  - key: reading-spectrum
    title: Spectrum of a reading
    tex: 'S_{yy}'
    role: none
    kind: A real, even function of the angular frequency (two-sided); the square of the unit of y times a second
    meaning: 'How the trembling of a reading $y$ of a warm body is shared among frequencies, $\langle y(t)y(0)\rangle = \int S_{yy}e^{-i\omega t}\,\mathrm d\omega/2\pi$. By the fluctuation–dissipation theorem it is $2k_BT\,\mathrm{Im}\,\chi_{yy}/\omega$.'
    chapter: '4.6'
    anchor: the-theorem-holds-for-every-linear-body-at-every-frequency
  - key: reading-response
    title: Response of a reading to its own push
    tex: '\chi_{yy}'
    role: none
    kind: A complex function of the angular frequency; the unit of y per unit of f
    meaning: 'The response of a reading $y$ to the push $f$ that enters the energy as $-fy$, its conjugate push. For a body of modes, $\chi_{yy} = \sum_nc_n^2/(\omega_n^2 - \omega^2 - i\Gamma_n\omega)$, with the same weights $c_n^2$ as the noise of $y$.'
    chapter: '4.6'
    anchor: the-theorem-holds-for-every-linear-body-at-every-frequency
  - key: drive-amplitude
    title: Strength of a conjugate push
    tex: 'f'
    role: none
    kind: A number that may change in time; in the unit that makes fy an energy
    meaning: 'The strength of a push that enters a body''s energy as $-fy$. In the paper''s thermometer it is the amplitude of the shell drive, in kg m², with $y = D\!:\!\mathcal E$. (Not a frequency in hertz.)'
    chapter: '4.6'
    anchor: the-theorem-holds-for-every-linear-body-at-every-frequency
  - key: drive-table
    title: The thermometer's table
    tex: 'D'
    role: none
    kind: A fixed symmetric trace-free table of pure numbers
    meaning: 'The table that picks the combination $y = D\!:\!\mathcal E = D_{ij}\mathcal E_{ij}$ that the pixel reads, and shapes the shell drive $\delta\sigma = -15f\,\hat n\cdot D\cdot\hat n/4\pi a^4$ that pushes on exactly it. (Not 4.3''s matrix $\mathbf M^{-1/2}\mathbf K\mathbf M^{-1/2}$, 3.3''s separation or a camera''s width.)'
    chapter: '4.6'
    anchor: a-push-shaped-like-the-reading-makes-a-thermometer-that-needs-no-model-of-the-body
  - key: love-number
    title: Love number
    tex: 'k_2'
    role: none
    kind: A pure number
    meaning: 'How much a round body yields to a steady tide: it acquires the quadrupole $Q_{ij} = -k_2R^5\mathcal E_{ij}/G$ (with chapter 2.3''s quadrupole $Q_{ij} = \int\rho(3x_ix_j - r^2\delta_{ij})\,\mathrm dV$; a third of that for the trace-free second moment, the paper''s form), so that its new potential at the surface is $k_2$ times the tide''s. A uniform fluid ball has $\tfrac32$, a rigid one 0, the Earth about 0.30 and the steel ball $4\times10^{-16}$. (Not a stiffness or a wavenumber.)'
    chapter: '4.6'
    anchor: the-static-end-of-the-response-is-the-love-number
  - key: surface-gravity
    title: Surface gravity
    tex: 'g_{\rm s}'
    role: none
    kind: A number; an acceleration in m s⁻²
    meaning: 'The pull of gravity at the surface of a body of mass $M$ and radius $R$, $g_{\rm s} = GM/R^2$: 9.81 m s⁻² for the Earth, $2.2\times10^{-7}$ m s⁻² for the steel ball. The paper writes it $g$; the tutorial keeps $g$ for the second profile of a moment and $\boldsymbol g$ for the field.'
    chapter: '4.6'
    anchor: the-static-end-of-the-response-is-the-love-number
  - key: wave-source
    title: Source of a wave field
    tex: 's(\vect x, t)'
    role: none
    kind: A number at each point and time; in the unit of the field per square metre
    meaning: 'The given function on the right of the wave equation with a source, $c^{-2}\partial_t^2u - \nabla^2u = s$, which drives the field $u$. For Newton''s potential at rest, $u = \Phi$ and $s = -4\pi G\rho$; for linearized gravity, $s = 16\pi GT_{ij}/c^4$. (Not the ripple ratio $s$ of chapter 3.7, nor the index $s$ that numbers sources.)'
    chapter: '5.2'
    anchor: a-source-sends-its-news-outward-at-the-speed-of-the-wave
  - key: point-strength
    title: Strength of a point source
    tex: 'b(t)'
    role: none
    kind: A number that changes in time; in the unit of the field times a metre
    meaning: 'The strength of a source at one point, $s = b(t)\,\delta^3(\vect x)$, whose field is $u = b(t - r/c)/4\pi r$. For gravity $b = -4\pi GM$, which cannot change, because mass is conserved. (Not the impact parameter $b$ of chapter 1.8 nor the pixel spacing $b$ of chapter 2.6.)'
    chapter: '5.2'
    anchor: a-source-sends-its-news-outward-at-the-speed-of-the-wave
  - key: retarded-greens-function
    title: Retarded Green's function
    tex: '\mathcal G_{\rm ret}(r, t)'
    role: none
    kind: A function of distance and time; in s⁻¹ m⁻¹
    meaning: 'The field of a single blow of unit strength at one point and the time zero: $\mathcal G_{\rm ret} = \delta(t - r/c)/4\pi r$. It is zero until the news of the blow arrives at the time $r/c$. Integrated over time it is $1/4\pi r$, minus chapter 2.4''s $\mathcal G$, because the wave equation with a source has $-\nabla^2$ on its left side.'
    chapter: '5.2'
    anchor: a-source-sends-its-news-outward-at-the-speed-of-the-wave
  - key: retarded-time
    title: Retarded time
    tex: 't_{\rm ret}'
    role: none
    kind: A time; in seconds
    meaning: 'The time $t - |\vect x - \vect y|/c$ at which a piece of a source at $\vect y$ must act to be felt at $\vect x$ at the time $t$. The paper writes $u = t - r/c$ for it in Sections V and XI; the tutorial keeps $u$ for the field.'
    chapter: '5.2'
    anchor: a-source-sends-its-news-outward-at-the-speed-of-the-wave
  - key: wave-direction
    title: Direction from a source to a field point
    tex: '\hat n'
    role: none
    kind: A vector of length one; no unit
    meaning: 'In the paper''s Sections V and XI, and in chapter 5.2, the unit vector from a source toward the point where its field is measured, along the travel of its waves. Elsewhere the paper''s $\hat n$ points the other way, from the pixel toward the source.'
    chapter: '5.2'
    anchor: far-away-each-direction-carries-one-ripple-of-the-source
  - key: source-transform
    title: Transform of a source in time and space
    tex: '\tilde s(\omega, \vect k)'
    role: none
    kind: A complex number for each frequency and wavevector; the unit of the source times s m³
    meaning: 'The source taken apart into ripples in time and space with the paper''s signs, $\tilde s = \int s\,e^{i\omega t - i\vect k\cdot\vect y}\,\mathrm dt\,\mathrm d^3y$. Far from a source its wave in the direction $\hat n$ is $e^{i\omega r/c}\tilde s(\omega, \omega\hat n/c)/4\pi r$: each direction reads one wavevector, on the sphere $|\vect k| = \omega/c$.'
    chapter: '5.2'
    anchor: far-away-each-direction-carries-one-ripple-of-the-source
  - key: trace-reversed-perturbation
    title: Trace-reversed perturbation
    tex: '\field{\bar h}_{ij}'
    role: field
    kind: A symmetric table of pure numbers at each point and time
    meaning: 'The weak gravitational field written so that, in harmonic gauge, each component obeys the wave equation with the source $16\pi GT_{ij}/c^4$: $\Box\bar h_{ij} = -16\pi GT_{ij}/c^4$ (stated in chapter 5.2; derived in chapter 7.4). The bar marks the trace reversal, not an average.'
    chapter: '5.2'
    anchor: far-away-each-direction-carries-one-ripple-of-the-source
  - key: tt-projector
    title: Transverse trace-free projector
    tex: '\Lambda_{ij,kl}(\hat n)'
    role: none
    kind: A table of pure numbers with four indices
    meaning: 'The projector that keeps, of a symmetric table, only the part across the direction $\hat n$ with no trace: the part a gravitational wave travelling along $\hat n$ can carry. It turns $\bar h_{kl}$ into the paper''s $h^{\rm TT}_{ij}$ (stated in chapter 5.2; chapter 7.6 builds it). (Not $\Lambda = \ln(R_c/R)$ of chapter 3.8, nor a boost.)'
    chapter: '5.2'
    anchor: far-away-each-direction-carries-one-ripple-of-the-source
  - key: source-count
    title: Number of sources
    tex: 'N'
    role: none
    kind: A whole number
    meaning: 'How many equal compact sources make up an array. Close together and in step they radiate $N^2$ times the power of one; far apart or with random phases, $N$ times. (Not the focal ratio or the number radiance.)'
    chapter: '5.2'
    anchor: many-sources-in-step-add-their-amplitudes
  - key: source-phase
    title: Phase of one source
    tex: '\phi_s'
    role: none
    kind: An angle; in radians
    meaning: 'How far the cycle of the source numbered $s$ is shifted: it oscillates as $e^{-i(\omega t + \phi_s)}$.'
    chapter: '5.2'
    anchor: many-sources-in-step-add-their-amplitudes
  - key: array-factor
    title: Array factor
    tex: '\mathcal A(\hat n)'
    role: none
    kind: A complex number for each direction; no unit
    meaning: 'The factor by which the far wave of $N$ equal compact sources exceeds the wave of one: $\mathcal A = \sum_s e^{-i\phi_s - i\omega\hat n\cdot\vect x_s/c}$, the paper''s sum. It is $N$ for sources close together and in step.'
    chapter: '5.2'
    anchor: many-sources-in-step-add-their-amplitudes
  - key: pixel-position
    title: Place of a pixel
    tex: '\vect x_p'
    role: none
    kind: A vector; in metres
    meaning: 'The place of the pixel numbered $p$ in an array. A plane wave from the direction $\hat n$ reaches it earlier than the origin by $\hat n\cdot\vect x_p/c$.'
    chapter: '5.3'
    anchor: delaying-and-adding-the-records-of-many-pixels-points-the-array
  - key: look-direction
    title: Direction from the camera toward a source
    tex: '\hat n'
    role: none
    kind: A vector of length one; no unit
    meaning: 'The unit vector from the camera toward a source, as in the paper''s Sections IV, VII and VIII; the wave travels along $-\hat n$. (In chapter 5.2 and the paper''s Sections V and XI, $\hat n$ points the other way, from a source toward the field point.)'
    chapter: '5.3'
    anchor: delaying-and-adding-the-records-of-many-pixels-points-the-array
  - key: steered-direction
    title: Steered direction
    tex: '\hat n'''
    role: none
    kind: A vector of length one; no unit
    meaning: 'The direction for which an array''s records are delayed and added, so that its picture is formed for that direction. The paper writes it $\hat n$, since its image is a function of it.'
    chapter: '5.3'
    anchor: delaying-and-adding-the-records-of-many-pixels-points-the-array
  - key: steered-array-factor
    title: Array factor of a steered array
    tex: '\mathcal A_{\hat n''}(\hat n)'
    role: none
    kind: A complex number for each pair of directions; no unit
    meaning: 'The sum $\sum_pe^{-ik(\hat n - \hat n'')\cdot\vect x_p}$ over the pixels of an array steered to $\hat n''$, for a wave from $\hat n$. It is chapter 5.2''s array factor $\mathcal A$ with the pixels as sources and the phases $\phi_p = -k\hat n''\cdot\vect x_p$; it reaches $N$ when $\hat n'' = \hat n$.'
    chapter: '5.3'
    anchor: delaying-and-adding-the-records-of-many-pixels-points-the-array
  - key: beam-image
    title: Computed image
    tex: 'I(\hat n'')'
    role: none
    kind: A number for each steered direction; in the square of the unit of the field
    meaning: 'The mean square of the delayed and added records, $\tfrac12|\tilde u|^2|\mathcal A_{\hat n''}(\hat n)|^2$ for one wave of one frequency: the paper''s $I(\hat n)$ of its equation beam. (Not the invariant $\mathrm{tr}\,\mathcal W^2$, the Stokes $I$ or a moment of inertia.)'
    chapter: '5.3'
    anchor: delaying-and-adding-the-records-of-many-pixels-points-the-array
  - key: aperture-width
    title: Width of an aperture
    tex: 'D'
    role: none
    kind: A length; in metres
    meaning: 'The width of an array or a lens, the paper''s $D$. Its picture of a point is about $\lambda/D$ wide: $1.03\lambda/D$ at half height for a round aperture. (Not 3.3''s separation of two scenes nor 4.6''s table $D$.)'
    chapter: '5.3'
    anchor: delaying-and-adding-the-records-of-many-pixels-points-the-array
  - key: pixel-spacing
    title: Spacing of pixels
    tex: 'b'
    role: none
    kind: A length; in metres
    meaning: 'The distance between neighbouring pixels of a row or grid, as in chapter 2.6 and the paper''s Appendix A. Waves can be steered anywhere without grating lobes only if $b \le \lambda/2$. (Not the strength of a point source of chapter 5.2 nor an impact parameter.)'
    chapter: '5.3'
    anchor: gaps-between-pixels-make-copies-of-the-image
  - key: lobe-order
    title: Order of a grating lobe
    tex: 'm'
    role: none
    kind: A whole number; no unit
    meaning: 'The label of a grating lobe, at $\sin\theta - \sin\theta'' = m\lambda/b$. (Not a mass, nor the order of a spherical harmonic.)'
    chapter: '5.3'
    anchor: gaps-between-pixels-make-copies-of-the-image
  - key: source-separation
    title: Separation of two sources
    tex: '\Delta y'
    role: none
    kind: A length; in metres
    meaning: 'The distance between two equal sources at the distance $r$ from a camera, which the paper writes $s$. In step they need $\Delta y \gtrsim 1.4\lambda r/D$ to show a dip of a fifth, out of step about $\lambda r/D$.'
    chapter: '5.3'
    anchor: sources-in-step-blur-more-than-sources-out-of-step
  - key: coherence-time
    title: Coherence time
    tex: '\tau_c'
    role: none
    kind: A time; in seconds
    meaning: 'How long a wave keeps its phase: the correlation time of chapter 3.2 for its field, about $1/\Delta\omega$ for a spectrum $\Delta\omega$ wide. For thermal radiation it is about $\hbar/k_BT$, $2.6 \times 10^{-14}$ s at 293 K, far too short for one moving pixel to image it.'
    chapter: '5.3'
    anchor: one-moving-pixel-can-image-a-steady-source-but-thermal-light-needs-pixels-that-record-together-in-pairs
  - key: strain-polarizations
    title: The two strains of a wave and their amplitudes
    tex: '\field{h}_+,\ \field{h}_\times'
    role: field
    kind: Two numbers that change in time, $h_+(t)$ and $h_\times(t)$, and their amplitudes $h_+$ and $h_\times$; pure numbers
    meaning: 'The two entries of a gravitational wave''s strain across its direction of travel, $h^{\rm TT}_{ij}(t) = h_+(t)e^+_{ij} + h_\times(t)e^\times_{ij}$: the plus pattern stretches along $\vect e_1$ and squeezes along $\vect e_2$, the cross pattern does the same along the diagonals. Written without the $(t)$, as in the paper, they are the amplitudes, the largest values over a cycle. The ring''s pattern is the one complex number $h_+(t) + ih_\times(t)$, multiplied by $e^{-2i\theta}$ when the axes turn by $\theta$. For a rotor seen at the inclination $\iota$ the amplitudes are $A(1 + \cos^2\iota)/2$ and $A\cos\iota$, with $h_+(t) = h_+\cos2\Omega u$ and $h_\times(t) = h_\times\sin2\Omega u$. (Not the tides $\mathcal E_+$, $\mathcal E_\times$, which are $\tfrac12\omega^2$ times them in a steady wave.)'
    chapter: '5.4'
    anchor: a-wave-across-the-line-of-sight-has-two-patterns-of-stretch
  - key: polarization-tensors
    title: Polarization tables
    tex: 'e^+_{ij},\ e^\times_{ij}'
    role: none
    kind: Two fixed symmetric trace-free tables of pure numbers
    meaning: 'In axes $\vect e_1$, $\vect e_2$ across a wave''s direction, $e^+ = \mathrm{diag}(1, -1, 0)$, and $e^\times$ has 1 in the places $12$ and $21$ and zeros elsewhere. Each has $e^A_{ij}e^A_{ij} = 2$, the paper''s normalization, and $e^+_{ij}e^\times_{ij} = 0$.'
    chapter: '5.4'
    anchor: a-wave-across-the-line-of-sight-has-two-patterns-of-stretch
  - key: second-moment
    title: Second moment of the mass
    tex: '\matter{I}_{ij}'
    role: matter
    kind: A symmetric table of nine numbers; in kg m²
    meaning: 'The paper''s $I_{ij} = \int\rho\,x_ix_j\,\mathrm dV$, measured from the centre of mass. Its trace-free part is a third of chapter 2.3''s quadrupole. Far from a compact source the wave is $2G/c^4r$ times the part of $\ddot I_{ij}$ across the line of sight with no trace. (Not chapter 1.6''s inertia tensor, nor Stokes $I$.)'
    chapter: '5.4'
    anchor: projecting-a-turning-quadrupole-onto-the-sky-gives-the-two-amplitudes-of-a-rotor
  - key: moment-difference
    title: Difference of the principal moments
    tex: '\matter{\Delta I}'
    role: matter
    kind: A number; in kg m²
    meaning: 'The difference between a rotor''s two principal second moments in its plane of rotation: $\tfrac12md^2$ for two masses $m$ a distance $d$ apart, $ML^2/12$ for a thin rod. Only this difference sends waves; a wheel turning about its axle has none.'
    chapter: '5.4'
    anchor: projecting-a-turning-quadrupole-onto-the-sky-gives-the-two-amplitudes-of-a-rotor
  - key: inclination
    title: Inclination
    tex: '\iota'
    role: none
    kind: An angle; in degrees or radians
    meaning: 'The angle between a rotor''s spin and the direction from the rotor to the camera: 0 when the spin points at the camera, 90° edge-on, 180° when it points away.'
    chapter: '5.4'
    anchor: projecting-a-turning-quadrupole-onto-the-sky-gives-the-two-amplitudes-of-a-rotor
  - key: rotor-amplitude
    title: Face-on amplitude of a rotor's wave
    tex: '\field{A}'
    role: field
    kind: A pure number
    meaning: 'The paper''s $A = 4G\,\Delta I\,\Omega^2/c^4r$, the strain of each polarization of a rotor''s wave seen along its axis at the distance $r$. Two 1 kg masses 1 m apart at sixteen turns a second give $4.3 \times 10^{-49}$ at the distance of the Moon. (Not the sum $A$ of chapter 4.5 nor an area.)'
    chapter: '5.4'
    anchor: projecting-a-turning-quadrupole-onto-the-sky-gives-the-two-amplitudes-of-a-rotor
  - key: strain-phasors
    title: Phasors of the two polarizations
    tex: '\tilde{\field{h}}_+,\ \tilde{\field{h}}_\times'
    role: field
    kind: Two fixed complex numbers; pure numbers
    meaning: 'The complex amplitudes of a steady wave in the paper''s time dependence $e^{-i\omega t}$: $h_+(t) = \mathrm{Re}[\tilde h_+e^{-i\omega t}]$, and the same for $\times$. Their sizes are the amplitudes and their arguments the phases. The combinations $\tilde h_{\rm a} = \tfrac12(\tilde h_+ - i\tilde h_\times)$ and $\tilde h_{\rm c} = \tfrac12(\tilde h_+ + i\tilde h_\times)$ are the parts that turn anticlockwise (a) and clockwise (c), the two helicities: $h_+(t) + ih_\times(t) = \tilde h_{\rm c}e^{-i\omega t} + \tilde h^*_{\rm a}e^{i\omega t}$. For a rotor, $\tilde h_\times = i\,h_\times$: a quarter cycle behind.'
    chapter: '5.4'
    anchor: two-oscillations-a-quarter-cycle-apart-make-a-pattern-that-turns
  - key: stokes
    title: Stokes parameters
    tex: 'I,\ Q,\ U,\ V'
    role: none
    kind: Four real numbers; squares of strains, pure numbers
    meaning: 'Four numbers built from the two helicities: $I = 2(|\tilde h_{\rm a}|^2 + |\tilde h_{\rm c}|^2)$, $V = 2(|\tilde h_{\rm a}|^2 - |\tilde h_{\rm c}|^2)$ and $Q + iU = 4\tilde h^*_{\rm a}\tilde h_{\rm c}$; in the two polarizations, $I = |\tilde h_+|^2 + |\tilde h_\times|^2$ (twice the sum of the mean squares), $Q = |\tilde h_+|^2 - |\tilde h_\times|^2$, $U = 2\,\mathrm{Re}(\tilde h_+^*\tilde h_\times)$ and $V = 2\,\mathrm{Im}(\tilde h_+^*\tilde h_\times)$. A turn of the axes by $\theta$ leaves $I$ and $V$ as they were and multiplies $Q + iU$ by $e^{-4i\theta}$ (by $e^{-2i\theta}$ for light). The first, $I$, measures the energy flux; $V/I$ is positive when the pattern turns anticlockwise as the camera sees it. (Stokes $I$ is not a second moment, a moment of inertia or the invariant $\mathrm{tr}\,\mathcal W^2$; Stokes $Q$ is not a quality factor.)'
    chapter: '5.4'
    anchor: four-numbers-describe-a-polarization-and-two-of-them-do-not-depend-on-the-axes
  - key: radiance
    title: Radiance (specific intensity)
    tex: 'I_\omega'
    role: none
    kind: A number for each place, direction and frequency; in W m⁻² sr⁻¹ per s⁻¹
    meaning: 'The power that arrives per square metre, per steradian and per unit of angular frequency: a pixel of area $\mathrm dA$ that accepts the cone $\mathrm d\Omega$ and the band $\mathrm d\omega$ receives $I_\omega\,\mathrm dA\,\mathrm d\Omega\,\mathrm d\omega$. It does not change along a ray in empty space. (Not the Stokes $I$, a moment of inertia, the invariant $\mathrm{tr}\,\mathcal W^2$ or the image $I$ of chapter 5.3.)'
    chapter: '5.5'
    anchor: a-pixel-measures-radiance-power-per-area-per-solid-angle-and-per-frequency
  - key: number-radiance
    title: Number radiance
    tex: 'N(\hat n)'
    role: none
    kind: A number for each direction; in gravitons s⁻¹ m⁻² sr⁻¹
    meaning: 'The gravitons that arrive per second, per square metre and per steradian from the direction $\hat n$, added over all frequencies: $N = \int I_\omega/\hbar\omega\,\mathrm d\omega$. With no absorption it is the line integral $\int_0^\infty j_N(s\hat n)\,\mathrm ds$. About $4 \times 10^5$ through the centre of the Sun''s core, at most $1.2 \times 10^{-5}$ looking straight down through the Earth. (Not the focal ratio $N$ of Section VII.)'
    chapter: '5.5'
    anchor: a-pixel-measures-radiance-power-per-area-per-solid-angle-and-per-frequency
  - key: background-radiance
    title: Background radiance
    tex: 'I_{\rm bg}'
    role: none
    kind: A radiance; in W m⁻² sr⁻¹ per s⁻¹
    meaning: 'The radiance that enters a body from behind, along the pixel''s line of sight. A body of optical depth $\tau$ passes $I_{\rm bg}e^{-\tau}$ of it and changes what the pixel receives by $(B_\omega - I_{\rm bg})(1 - e^{-\tau})$.'
    chapter: '5.5'
    anchor: along-a-ray-matter-adds-its-glow-and-takes-a-share-of-what-passes
  - key: emissivity
    title: Emissivity
    tex: 'j_\omega'
    role: none
    kind: A number at each point; in W m⁻³ sr⁻¹ per s⁻¹
    meaning: 'The power that matter sends out per cubic metre, per steradian and per unit of angular frequency. It adds $j_\omega\,\mathrm ds$ to a ray''s radiance over the length $\mathrm ds$. By Kirchhoff''s law, $j_\omega = \alpha B_\omega(T)$.'
    chapter: '5.5'
    anchor: along-a-ray-matter-adds-its-glow-and-takes-a-share-of-what-passes
  - key: energy-emissivity
    title: Energy emissivity
    tex: 'j_E'
    role: none
    kind: A number at each point; in W m⁻³ sr⁻¹
    meaning: 'The emissivity added over all frequencies, $\int j_\omega\,\mathrm d\omega$. For a friction the same at every frequency it is $\alpha\sigma_{\rm SB}T^4/\pi$: $1.7 \times 10^{-35}$ W m⁻³ sr⁻¹ for the placeholder friction at 293 K, so that a cubic metre sends $4\pi j_E = 2.1 \times 10^{-34}$ W.'
    chapter: '5.5'
    anchor: a-materials-brightness-is-its-friction-times-a-power-of-its-temperature
  - key: number-emissivity
    title: Number emissivity
    tex: 'j_N'
    role: none
    kind: A number at each point; in gravitons s⁻¹ m⁻³ sr⁻¹
    meaning: 'The gravitons that matter sends out per second, per cubic metre and per steradian, $\int j_\omega/\hbar\omega\,\mathrm d\omega$. For a friction $\eta$ the same at every frequency, $j_N = 16G\eta\sigma_{\rm SB}T^3/2.70\,k_Bc^3$: $1.5 \times 10^{-15}$ for the placeholder at 293 K.'
    chapter: '5.5'
    anchor: when-nothing-absorbs-a-pixel-adds-the-glow-along-its-line
  - key: optical-depth
    title: Optical depth
    tex: '\tau'
    role: none
    kind: A pure number
    meaning: 'The absorption coefficient added along a path, $\alpha L$ for a uniform slab of thickness $L$. A slab passes the fraction $e^{-\tau}$ of its background; it is thick when $\tau \gg 1$ and thin when $\tau \ll 1$. For gravitational waves through the Earth''s diameter of matter with the placeholder friction, $\tau = 1.6 \times 10^{-30}$. (Not the relaxation time $\tau$ of chapter 4.4.)'
    chapter: '5.5'
    anchor: along-a-ray-matter-adds-its-glow-and-takes-a-share-of-what-passes
  - key: planck-radiance
    title: Planck radiance
    tex: 'B_\omega(T)'
    role: none
    kind: A radiance for each frequency and temperature; in W m⁻² sr⁻¹ per s⁻¹
    meaning: 'The radiance of enclosure radiation at the temperature $T$, the same for walls of any material. For gravitational waves, summed over both polarizations, $B_\omega = \hbar\omega^3/[4\pi^3c^2(e^{\hbar\omega/k_BT} - 1)]$; added over frequency it gives $\sigma_{\rm SB}T^4/\pi$. (Not the magnetic part of the tide $\mathcal B_{ij}$.)'
    chapter: '5.5'
    anchor: a-warm-bodys-glow-over-its-absorption-is-the-radiance-of-an-enclosure-at-its-temperature
  - key: stefan-boltzmann
    title: Stefan–Boltzmann constant
    tex: '\sigma_{\rm SB}'
    role: none
    kind: A constant; in W m⁻² K⁻⁴
    meaning: '$\sigma_{\rm SB} = \pi^2k_B^4/60\hbar^3c^2 = 5.67 \times 10^{-8}$ W m⁻² K⁻⁴, the same for gravitational waves as for light because both have two polarizations. The paper writes a bare $\sigma$; the tutorial keeps a bare $\sigma$ for surface density.'
    chapter: '5.5'
    anchor: a-materials-brightness-is-its-friction-times-a-power-of-its-temperature
  - key: focal-length
    title: Focal length
    tex: 'f'
    role: none
    kind: A length; in metres
    meaning: 'The distance behind a lens at which rays arriving parallel to its axis cross: $R^2/2(n - 1)h$ for a thin lens of radius $R$ and central thickness $h$, and $b^2/2r_s$ for rays passing a mass at the distance $b$. A steel lens 1 m in radius and 1 m thick focuses a 1 kHz wave at $6.0 \times 10^{12}$ m. (Not a frequency.)'
    chapter: '5.5'
    anchor: matter-makes-no-useful-lens-or-mirror-and-gravity-focuses-well-only-when-it-is-very-compact
  - key: focal-ratio
    title: Focal ratio
    tex: 'N'
    role: none
    kind: A pure number
    meaning: 'The focal length over the width of a lens, the paper''s $N = f/2R$ of Section VII. A gravitational lens of radius $R$ needs $r_s/R = 1/4N$; the Earth as a lens has $N = 1/8\mathcal C = 1.8 \times 10^8$. (Not the number radiance $N(\hat n)$.)'
    chapter: '5.5'
    anchor: matter-makes-no-useful-lens-or-mirror-and-gravity-focuses-well-only-when-it-is-very-compact
  - key: schwarzschild-radius
    title: Schwarzschild radius
    tex: 'r_s'
    role: none
    kind: A length; in metres
    meaning: 'The length $r_s = 2GM/c^2$ of a mass $M$: 8.9 mm for the Earth, 3.0 km for the Sun. A ray passing the mass at the distance $b$ is bent by $2r_s/b$. For a black hole it is the radius of the horizon.'
    chapter: '5.5'
    anchor: matter-makes-no-useful-lens-or-mirror-and-gravity-focuses-well-only-when-it-is-very-compact
  - key: line-impact-parameter
    title: Impact parameter of a line of sight
    tex: 'b'
    role: none
    kind: A length; in metres
    meaning: 'The distance by which a line of sight misses the centre of a round body, the paper''s $b$. From the surface of a planet of radius $R$, the line at the angle $\theta$ from straight down has $b = R\sin\theta$: 4095 km for the Earth at $40^\circ$. Chapter 1.8 writes the impact parameter of a passing mass $B$. (Not the spacing of pixels of chapter 5.3 or the exit distance of chapter 2.8.)'
    chapter: '5.6'
    anchor: from-the-surface-of-a-round-planet-each-line-of-sight-is-a-chord
  - key: nadir-angle
    title: Angle from straight down
    tex: '\theta'
    role: none
    kind: An angle; in degrees or radians
    meaning: 'The angle between a camera''s line of sight and the line from the camera to the centre of the planet it stands on. A boundary at the radius $r_0$ shows at $\sin\theta = r_0/R$: $33.1^\circ$ for the top of the Earth''s core. (Not an angular size, nor the unknown of a scene of chapter 3.3.)'
    chapter: '5.6'
    anchor: from-the-surface-of-a-round-planet-each-line-of-sight-is-a-chord
  - key: chord-brightness
    title: Brightness against impact parameter
    tex: 'N(b)'
    role: none
    kind: A number for each line of sight; in gravitons s⁻¹ m⁻² sr⁻¹
    meaning: 'The number radiance of the line of sight that passes the centre of a round body at the distance $b$, the Abel transform $N(b) = 2\int_b^R j_N(r)\,r\,\mathrm dr/\sqrt{r^2 - b^2}$ of its glow. For a uniform ball it is $2j\sqrt{R^2 - b^2}$, the glow times the chord.'
    chapter: '5.6'
    anchor: from-the-surface-of-a-round-planet-each-line-of-sight-is-a-chord
  - key: speed-ratio
    title: Speed as a fraction of light's
    tex: '\obs{\beta}'
    role: obs
    kind: A pure number between 0 and 1 (a vector $\boldsymbol\beta = \mathbf v/c$ when its direction matters)
    meaning: 'The speed of one frame through another divided by the speed of light, $\beta = v/c$. The paper''s pixel crosses the room at $\beta = 0.6$; the Earth moves round the Sun, at $29.8\,\mathrm{km\,s^{-1}}$, at $\beta = 9.94\times10^{-5}$.'
    chapter: '6.1'
    anchor: steady-motion-along-a-line-mixes-time-and-distance
  - key: lorentz-factor
    title: Lorentz factor
    tex: '\obs{\gamma}'
    role: obs
    kind: A pure number, 1 or more
    meaning: 'The factor $\gamma = (1 - \beta^2)^{-1/2}$ of the Lorentz transformation, by which a moving clock runs slow and a moving rod is shortened. It is 1.25 at $0.6c$ and $1 + 4.9\times10^{-9}$ for the Earth on its orbit. (Not a damping rate, which the tutorial writes $\Gamma$.)'
    chapter: '6.1'
    anchor: steady-motion-along-a-line-mixes-time-and-distance
  - key: proper-time
    title: Proper time
    tex: '\obs{\tau}'
    role: obs
    kind: A time; in seconds
    meaning: 'The time a clock itself reads along its path, $\tau = \int\sqrt{1 - v^2/c^2}\,\mathrm dt$, the same for every observer. A traveller at $0.6c$ ages 8 years in 10 years of the room. (Not the averaging time of chapter 3.2, the relaxation time of chapter 4.4 or the optical depth of chapter 5.5.)'
    chapter: '6.1'
    anchor: a-moving-clock-runs-slow-and-a-clocks-own-time-is-the-length-of-its-path
  - key: rest-frame-distance
    title: Distance in a body's rest frame
    tex: 'R_*'
    role: none
    kind: A distance; in metres
    meaning: 'The distance from the pixel to a steadily moving body in the body''s own frame, at the pixel''s "now": $R_*^2 = \gamma^2r_\parallel^2 + r_\perp^2 = \gamma^2(r^2 - |\mathbf v\times\mathbf r|^2/c^2)$, with $\mathbf r$ the vector to where the body is now. The body''s tide is $GM/R_*^3$.'
    chapter: '6.1'
    anchor: a-moving-ruler-is-shorter-along-its-motion-and-distances-in-a-bodys-own-frame-are-longer
  - key: rapidity
    title: Rapidity
    tex: '\obs{\eta}'
    role: obs
    kind: A pure number
    meaning: 'The measure of speed defined by $\beta = \tanh\eta$, so that $\gamma = \cosh\eta$ and $\gamma\beta = \sinh\eta$. Boosts along one line add their rapidities; $0.6c$ is $\eta = \ln 2$, and $\eta \to \infty$ as the speed approaches $c$. (Not the viscosity $\eta$ of chapter 4.4, the $\eta_{\mu\nu}$ of chapter 6.2 or the vector $\boldsymbol\eta$ of chapter 13.2.)'
    chapter: '6.1'
    anchor: rapidities-add-where-velocities-do-not
  - key: four-position
    title: Event as a four-vector
    tex: 'x^\mu'
    role: none
    kind: A four-vector; each component in metres
    meaning: 'The time and place of an event as one list, $x^\mu = (x^0, x^1, x^2, x^3) = (ct, x, y, z)$, with the time multiplied by $c$ so that all four are lengths. The paper''s $x^0 = ct$. A boost changes it by $x''^\mu = \Lambda^\mu{}_\nu x^\nu$.'
    chapter: '6.2'
    anchor: an-event-is-a-vector-of-four-components
  - key: lorentz-matrix
    title: Lorentz transformation as a table
    tex: '\Lambda^\mu{}_\nu'
    role: none
    kind: A table of four rows and four columns of pure numbers
    meaning: 'The boost written as one table, $x''^\mu = \Lambda^\mu{}_\nu x^\nu$. For a boost along $x$ its top left block is $\begin{pmatrix}\gamma & -\gamma\beta\\ -\gamma\beta & \gamma\end{pmatrix}$, with 1.25 and 0.75 at $0.6c$. It keeps the metric, $\eta_{\alpha\beta}\Lambda^\alpha{}_\mu\Lambda^\beta{}_\nu = \eta_{\mu\nu}$. Always written with its indices. (Not the paper''s $3\times3$ complex $\Lambda = \exp(-i\eta\,\hat u\cdot\mathbf L)$ of chapter 6.6, the projector $\Lambda_{ij,kl}$ of chapter 5.2, a logarithm or the cosmological constant.)'
    chapter: '6.2'
    anchor: an-event-is-a-vector-of-four-components
  - key: minkowski-metric
    title: Minkowski metric
    tex: '\field{\eta}_{\mu\nu}'
    role: field
    kind: A symmetric table of four rows of pure numbers
    meaning: 'The table $\eta_{\mu\nu} = \mathrm{diag}(-1, 1, 1, 1)$ of the dot product of four-vectors, $a\cdot b = \eta_{\mu\nu}a^\mu b^\nu = -a^0b^0 + \vect a\cdot\vect b$, and of lowering an index, $a_\mu = \eta_{\mu\nu}a^\nu$. It is the same in every inertial frame; in curved spacetime a general metric $g_{\mu\nu}$ takes its place. Always written with its indices. (Not the rapidity $\eta$, the viscosity $\eta$ or the paper''s vector $\boldsymbol\eta$ of Section XIII.)'
    chapter: '6.2'
    anchor: the-minkowski-metric-measures-the-interval-with-one-minus-sign-for-time
  - key: four-velocity
    title: Four-velocity
    tex: '\obs{u}^\mu'
    role: obs
    kind: A four-vector; in m/s
    meaning: 'The rate $u^\mu = \mathrm dx^\mu/\mathrm d\tau = \gamma(c, \vect v)$ of a body''s event along its worldline, with $\tau$ its own proper time. Every body has $u\cdot u = -c^2$. An observer''s $u^\mu$ is its direction in time, and its "now" is the set of steps orthogonal to it; at $0.6c$, $u^\mu = (1.25c, 0.75c, 0, 0)$.'
    chapter: '6.2'
    anchor: the-four-velocity-has-the-same-length-for-every-body
  - key: inverse-minkowski-metric
    title: Inverse Minkowski metric
    tex: '\field{\eta}^{\mu\nu}'
    role: field
    kind: A symmetric table of four rows of pure numbers
    meaning: 'The inverse of $\eta_{\mu\nu}$, defined by $\eta^{\mu\alpha}\eta_{\alpha\nu} = \delta^\mu{}_\nu$. In flat spacetime it is the same table, $\mathrm{diag}(-1, 1, 1, 1)$. It raises an index, $a^\mu = \eta^{\mu\nu}a_\nu$, and builds the wave operator $\Box = \eta^{\mu\nu}\partial_\mu\partial_\nu$.'
    chapter: '6.2'
    anchor: lowering-an-index-changes-only-the-sign-of-time
  - key: four-gradient
    title: Four-gradient
    tex: '\partial_\mu'
    role: none
    kind: An operator with a lower index; in m⁻¹
    meaning: 'The rates $\partial_\mu = \partial/\partial x^\mu = (c^{-1}\partial_t, \nabla)$. Under a boost it changes by the inverse table, $\partial''_\mu = (\Lambda^{-1})^\nu{}_\mu\partial_\nu$, so its pairing with a step, $\partial_\mu f\,\mathrm dx^\mu = \mathrm df$, is the same for every observer.'
    chapter: '6.2'
    anchor: lowering-an-index-changes-only-the-sign-of-time
  - key: wave-operator
    title: "d'Alembert operator"
    tex: '\Box'
    role: none
    kind: An operator; in m⁻²
    meaning: 'The square of the four-gradient, $\Box = \eta^{\mu\nu}\partial_\mu\partial_\nu = -c^{-2}\partial_t^2 + \nabla^2$, the same for every observer. $\Box\phi = 0$ is the wave equation for waves at $c$, and a plane wave $e^{ik_\mu x^\mu}$ solves it when $k\cdot k = 0$. For a static field it is $\nabla^2$.'
    chapter: '6.2'
    anchor: the-gradient-is-a-lower-index-vector-and-the-wave-operator-is-its-square
  - key: wave-four-vector
    title: Wave four-vector
    tex: 'k^\mu'
    role: none
    kind: A four-vector; in m⁻¹
    meaning: 'The four-vector $k^\mu = (\omega/c, \vect k)$ of a plane wave $e^{ik_\mu x^\mu}$, whose phase $k_\mu x^\mu = \vect k\cdot\vect x - \omega t$ has the paper''s signs. A wave that travels at $c$ has $k\cdot k = 0$: a gravitational wave of 1 kHz has $\omega/c = |\vect k| = 2.10\times10^{-5}\,\mathrm{m^{-1}}$.'
    chapter: '6.2'
    anchor: the-gradient-is-a-lower-index-vector-and-the-wave-operator-is-its-square
  - key: four-momentum
    title: Four-momentum
    tex: 'p^\mu'
    role: none
    kind: A four-vector; in kg m s⁻¹
    meaning: 'A particle''s mass times its four-velocity, $p^\mu = m u^\mu$. An observer with four-velocity $u^\mu$ measures its energy $E = -p_\mu u^\mu$: $1.25\,mc^2$ for a particle at $0.6c$ seen from the room, $mc^2$ for an observer moving with it. Chapter 6.4 builds it.'
    chapter: '6.2'
    anchor: what-an-observer-measures-is-a-contraction-with-its-own-four-velocity
  - key: travel-direction
    title: Direction of travel of a wave
    tex: '\hat k'
    role: none
    kind: A vector of length one; no unit
    meaning: 'The unit vector $\hat k = \vect k/|\vect k|$ along which a plane wave travels, across its crests. The source is seen the other way, along $\hat n = -\hat k$. A boost changes it by the aberration $\hat k'' = [\hat k_\perp + \gamma(\hat k_\parallel - \boldsymbol\beta)]/\gamma(1 - \boldsymbol\beta\cdot\hat k)$, with the parts of $\hat k$ along and across the motion.'
    chapter: '6.3'
    anchor: a-ray-of-light-is-a-null-four-vector-and-a-boost-changes-its-frequency-and-its-direction-together
  - key: source-angle
    title: Angle of a source from the direction of motion
    tex: '\alpha'
    role: none
    kind: An angle; in radians or degrees, from 0 to 180°
    meaning: 'The angle between the direction in which an observer sees a source, $\hat n$, and the observer''s direction of motion. A boost changes it by $\cos\alpha'' = (\cos\alpha + \beta)/(1 + \beta\cos\alpha)$, so every source moves forward: a source at $90°$ is seen at $53.1°$ from $0.6c$. The paper''s free-fall paragraph uses it in $\cos\alpha = 23/31$. (Not the absorption coefficient $\alpha$ of chapter 5.5.)'
    chapter: '6.3'
    anchor: a-ray-of-light-is-a-null-four-vector-and-a-boost-changes-its-frequency-and-its-direction-together
  - key: aberration-angle
    title: Aberration angle
    tex: '\delta'
    role: none
    kind: An angle; in radians
    meaning: 'The angle by which motion shifts the direction in which a source is seen: about $v_\perp/c$ for an observer whose speed across the line of sight is $v_\perp$, $9.93\times10^{-5}$ rad or $20.5''''$ for the Earth on its orbit. For a body passing at $0.6c$, the angle between its present position and its retarded position at closest approach is $\arctan\gamma\beta = 36.9°$.'
    chapter: '6.3'
    anchor: at-small-speeds-the-shift-is-the-speed-across-the-line-of-sight-over-c
  - key: rest-direction
    title: Direction of a body in its own frame
    tex: '\hat n_0'
    role: none
    kind: A vector of length one; no unit
    meaning: 'In the paper''s Appendix C, the unit vector from the pixel toward a body, in the body''s rest frame, where the body''s tide is $(GM/R_*^3)(1 - 3\hat n_0\hat n_0^{\mathsf T})$ and its principal null directions are $\pm\hat n_0$. With $a = \boldsymbol\beta\cdot\hat n_0$ it splits as $(a/\beta)\hat\beta + \vect n_\perp$.'
    chapter: '6.3'
    anchor: one-step-of-appendix-c-the-directions-of-a-moving-body-are-its-directions-at-rest-aberrated
  - key: pnd-pairs
    title: The two pairs of directions of a moving body
    tex: '\hat p_\pm'
    role: none
    kind: Two vectors of length one; no unit
    meaning: 'The paper''s two pairs of principal null directions of a single moving body: its directions at rest, $\pm\hat n_0$, aberrated as rays. Their half sum is the body''s velocity across the line to where it is now, over $c$ (the paper''s eq:star-velocity), and their half difference lies along that line with the length $(1 - v_\perp^2/c^2)^{1/2}$.'
    chapter: '6.3'
    anchor: one-step-of-appendix-c-the-directions-of-a-moving-body-are-its-directions-at-rest-aberrated
  - key: rest-mass
    title: Rest mass
    tex: '\matter{m}'
    role: matter
    kind: A number that every observer agrees on; in kilograms
    meaning: 'The energy of a body at rest divided by $c^2$. It is the length of the four-momentum, $p\cdot p = -m^2c^2$, so $E^2 = |\mathbf p|^2c^2 + m^2c^4$ at every speed. Light has $m = 0$.'
    chapter: '6.4'
    anchor: momentum-and-energy-are-the-parts-of-one-four-vector
  - key: energy
    title: Energy of a body
    tex: 'E'
    role: none
    kind: A number; in joules
    meaning: 'The time component of the four-momentum times $c$, $E = \gamma mc^2$: the rest energy $mc^2$ plus the energy of motion, $\tfrac12mv^2$ for a slow body. It depends on the observer: $1.25\,mc^2$ at $0.6c$. (Not the electric field of light, nor the tidal tensor.)'
    chapter: '6.4'
    anchor: momentum-and-energy-are-the-parts-of-one-four-vector
  - key: total-four-momentum
    title: Total four-momentum
    tex: 'P^\mu'
    role: none
    kind: A four-vector; in kg m s⁻¹
    meaning: 'The sum $P^\mu = \sum_a p_a^\mu$ of the four-momenta of the parts of a system. In a collision with nothing outside it is kept, $\Delta P^\mu = 0$: energy and momentum together. Its length gives the mass of the system, $M^2c^2 = -P\cdot P$.'
    chapter: '6.4'
    anchor: if-momentum-is-kept-in-every-frame-so-is-energy
  - key: system-mass
    title: Mass of a system
    tex: '\matter{M}'
    role: matter
    kind: A number that every observer agrees on; in kilograms
    meaning: 'The rest mass of a body of many parts, $M^2c^2 = (\sum_aE_a/c)^2 - |\sum_a\mathbf p_a|^2$. In its rest frame it is the total energy over $c^2$, so heat adds $\Delta U/c^2$, about $10^{-11}$ kg per megajoule. The paper writes it $\mathcal M$ in Appendix C.'
    chapter: '6.4'
    anchor: a-bodys-mass-is-its-total-energy-so-heat-has-weight
  - key: light-cone-u
    title: Light-cone coordinate u
    tex: 'u'
    role: none
    kind: A coordinate; in metres
    meaning: 'The combination $u = ct - z$ of the paper''s Appendix C. A flash moving along $+z$ keeps its $u$, so a surface of constant $u$ is the front of a wave along $+z$. A boost along $z$ of rapidity $\eta$ multiplies it by $e^{\eta}$. (Not the four-velocity $u^\mu$, nor the retarded time $t - r/c$.)'
    chapter: '6.4'
    anchor: along-one-line-light-cone-coordinates-turn-a-boost-into-a-stretch
  - key: light-cone-v
    title: Light-cone coordinate v
    tex: 'v'
    role: none
    kind: A coordinate; in metres
    meaning: 'The combination $v = ct + z$ of the paper''s Appendix C, kept by a flash moving along $-z$. With $u$ it gives $-c^2\mathrm dt^2 + \mathrm dz^2 = -\mathrm du\,\mathrm dv$. A boost along $z$ multiplies it by $e^{-\eta}$. (Not a speed.)'
    chapter: '6.4'
    anchor: along-one-line-light-cone-coordinates-turn-a-boost-into-a-stretch
  - key: light-cone-q
    title: Light-cone momentum q
    tex: 'q'
    role: none
    kind: A momentum; in kg m s⁻¹
    meaning: 'The light-cone component $q = E/c - p_z$ of a body''s four-momentum: about $mc$ for slow matter, $mc/2$ at $0.6c$ along $+z$, zero for light along $+z$. With the other component, $q(E/c + p_z) = m^2c^2 + p_\perp^2$. An impulsive plane wave along $z$ keeps it. (Not chapter 3.7''s $q = kz$.)'
    chapter: '6.4'
    anchor: along-one-line-light-cone-coordinates-turn-a-boost-into-a-stretch
  - key: transverse-momentum
    title: Momentum across the line
    tex: '\mathbf p_\perp'
    role: none
    kind: A vector of two components; in kg m s⁻¹
    meaning: 'The part $(p_x, p_y)$ of a body''s momentum across the direction $z$ of a wave, with square $p_\perp^2$. A boost along $z$ leaves it alone; a kick that keeps $q$ and changes it gives the energy $(c/2q)\,\Delta(p_\perp^2)$.'
    chapter: '6.4'
    anchor: along-one-line-light-cone-coordinates-turn-a-boost-into-a-stretch
  - key: wave-profile
    title: Profile of an impulsive wave
    tex: 'H'
    role: none
    kind: A function across the wave front; in metres
    meaning: 'The profile $H(\mathbf x_\perp)$ of the paper''s impulsive plane wave, $\mathrm ds^2 = -\mathrm du\,\mathrm dv + H\delta(u)\,\mathrm du^2 + \mathrm d\mathbf x_\perp^2$. A particle that crosses it receives the sideways momentum $\tfrac12q\nabla H$. (Not the Hamiltonian, the Wiener filter or the bits $H$.)'
    chapter: '6.4'
    anchor: a-sideways-kick-that-keeps-q-fixes-the-energy-gained
  - key: light-cone-total
    title: Total light-cone momentum Q
    tex: 'Q'
    role: none
    kind: A momentum; in kg m s⁻¹
    meaning: 'The sum $Q = \sum_aq_a$ over the particles of a body. With the weights $q_a/Q$, the rest mass is $\mathcal M^2c^2 = Q\sum_am_a^2c^2/q_a + Q^2\,\mathrm{Var}(\mathbf p_\perp/q)$. (Not a moment $Q_h$ nor a quality factor.)'
    chapter: '6.4'
    anchor: a-bodys-rest-mass-in-light-cone-form-is-a-sum-and-a-weighted-variance
  - key: spacetime-metric
    title: Metric of spacetime
    tex: '\field{g}_{\mu\nu}'
    role: field
    kind: A symmetric table of four rows at each event, ten independent entries; pure numbers when every coordinate is a length, as with x⁰ = ct
    meaning: 'The table that turns differences of coordinate labels into what clocks and rulers read: along a clock''s path $c^2\,\mathrm d\tau^2 = -g_{\mu\nu}\,\mathrm dx^\mu\mathrm dx^\nu$. In flat spacetime with inertial coordinates it is $\eta_{\mu\nu}$; near slow matter its time part is $g_{00} = -(1 + 2\Phi/c^2)$, which gives Newton''s law and the rates of clocks. Always written with its two indices. (Not the size $g$ of the field at the ground, nor the metric $g_{ij}$ of the space below a flat camera in chapter 3.9.)'
    chapter: '7.1'
    anchor: a-clocks-own-time-is-set-by-the-metric
  - key: inverse-spacetime-metric
    title: Inverse metric
    tex: '\field{g}^{\mu\nu}'
    role: field
    kind: A symmetric table of four rows at each event; pure numbers when every coordinate is a length
    meaning: 'The inverse of the metric as a matrix, $g^{\mu\alpha}g_{\alpha\nu} = \delta^\mu{}_\nu$. It raises an index, $a^\mu = g^{\mu\nu}a_\nu$, as $g_{\mu\nu}$ lowers one. For a diagonal metric each entry is one over the matching entry of $g_{\mu\nu}$.'
    chapter: '7.1'
    anchor: a-clocks-own-time-is-set-by-the-metric
  - key: metric-perturbation
    title: Metric perturbation
    tex: '\field{h}_{\mu\nu}'
    role: field
    kind: A symmetric table of four rows of small pure numbers at each event
    meaning: 'The difference $h_{\mu\nu} = g_{\mu\nu} - \eta_{\mu\nu}$ between the metric and the flat one: how much a weak field changes what clocks and rulers read. Near slow matter $h_{00} = -2\Phi/c^2$, which is $1.4 \times 10^{-9}$ at the Earth''s surface. Chapter 7.4 builds the rest of the table. (Its trace is written $h^\alpha{}_\alpha$, never a bare $h$, which is a strain.)'
    chapter: '7.1'
    anchor: free-fall-is-the-path-along-which-a-clock-ages-most
  - key: christoffel
    title: Christoffel symbols
    tex: '\Gamma^\mu{}_{\alpha\beta}'
    role: none
    kind: Forty numbers at each event, symmetric in the two lower indices; in m⁻¹ when every coordinate is a length
    meaning: 'The first derivatives of the metric that enter the law of free fall, $\mathrm d^2x^\mu/\mathrm d\tau^2 + \Gamma^\mu{}_{\alpha\beta}u^\alpha u^\beta = 0$, with $\Gamma^\mu{}_{\alpha\beta} = \tfrac12g^{\mu\nu}(\partial_\alpha g_{\nu\beta} + \partial_\beta g_{\nu\alpha} - \partial_\nu g_{\alpha\beta})$. In a weak static field $\Gamma^i{}_{00} = \partial_i\Phi/c^2$ holds Newton''s pull. They depend on the coordinates and vanish at any one event in a freely falling frame, so they are not a tensor and carry no colour. Always written with three indices. (Not the damping rate $\Gamma$ of chapter 4.1.)'
    chapter: '7.1'
    anchor: free-bodies-follow-geodesics-and-the-christoffel-symbols-hold-newtons-pull
  - key: magnetic-field
    title: Magnetic field
    tex: '\light{B}'
    role: light
    kind: A vector at each point; in teslas (V s/m²)
    meaning: 'The field that pushes on a moving charge: a charge $q$ moving with velocity $\mathbf v$ feels $q\,\mathbf v\times\mathbf B$ on top of $q\mathbf E$. Multiplied by $c$ it is in V/m, like $\mathbf E$; in a light wave $c|\mathbf B| = |\mathbf E|$, and sunlight has $B_{\rm rms} = 2.39\,\mu\mathrm T$. (Not the magnetic part $\mathcal B_{ij}$ of the curvature, nor the Planck radiance $B_\omega$.)'
    chapter: '6.6'
    anchor: the-electric-and-magnetic-fields-are-defined-by-the-force-on-a-test-charge
  - key: complex-field
    title: Riemann–Silberstein vector
    tex: '\light{\boldsymbol F}'
    role: light
    kind: A complex vector at each point; in V/m
    meaning: 'Light''s two fields as one complex vector, $\mathbf F = \mathbf E + ic\mathbf B$; the paper writes $\mathbf E + ic\mathbf B$ without a letter. Maxwell''s equations become $\nabla\cdot\mathbf F = \rho_q/\varepsilon_0$ and $\nabla\times\mathbf F = (i/c)\partial_t\mathbf F + i\mu_0c\mathbf J_q$; a plane wave is $a\mathbf m$; a moving sensor reads $\Lambda\mathbf F$; and $\mathbf F\cdot\mathbf F = E^2 - c^2B^2 + 2ic\,\mathbf E\cdot\mathbf B$ is the same for every observer. (Not the paper''s energy flux $\mathbf F$, nor a force.)'
    chapter: '6.6'
    anchor: maxwells-four-equations-are-two-equations-for-one-complex-vector
  - key: field-tensor
    title: Electromagnetic field tensor
    tex: '\light{F}^{\mu\nu}'
    role: light
    kind: An antisymmetric table of four rows; in teslas
    meaning: 'The six numbers of light as one tensor of spacetime: $F^{0i} = E_i/c$, $F^{ij} = \epsilon_{ijk}B_k$, and with both indices lowered $F_{0i} = -E_i/c$. A boost changes it by $\Lambda^\mu{}_\alpha\Lambda^\nu{}_\beta F^{\alpha\beta}$, which is the same change as the paper''s $3\times3$ complex $\Lambda$ acting on $\mathbf E + ic\mathbf B$.'
    chapter: '6.6'
    anchor: a-moving-sensor-reads-the-field-turned-by-an-imaginary-angle
  - key: complex-boost
    title: Boost as a complex rotation
    tex: '\Lambda'
    role: none
    kind: A 3×3 table of complex numbers with ΛᵀΛ = 1
    meaning: 'The paper''s $\Lambda = \exp(-i\eta\,\hat u\cdot\mathbf L)$: a sensor moving with rapidity $\eta$ along $\hat u$ reads $\Lambda\mathbf F$ for light and $\Lambda\mathcal W\Lambda^{\mathsf T}$ for gravity. It is the table of a turn of the axes about $\hat u$ by the imaginary angle $i\eta$. For $\hat u = \hat z$ its rows are $(\cosh\eta, i\sinh\eta, 0)$, $(-i\sinh\eta, \cosh\eta, 0)$, $(0, 0, 1)$. (Not the $4\times4$ $\Lambda^\mu{}_\nu$ of chapter 6.2, which always carries its indices, the projector $\Lambda_{ij,kl}$, a logarithm or the cosmological constant.)'
    chapter: '6.6'
    anchor: a-moving-sensor-reads-the-field-turned-by-an-imaginary-angle
  - key: electric-constant
    title: Electric constant
    tex: '\varepsilon_0'
    role: none
    kind: A constant; 8.854 × 10⁻¹² C V⁻¹ m⁻¹
    meaning: 'The constant in Gauss''s law for electricity, $\nabla\cdot\mathbf E = \rho_q/\varepsilon_0$, and in the energy density of the field, $u = \tfrac12\varepsilon_0(E^2 + c^2B^2)$. With the magnetic constant it obeys $\varepsilon_0\mu_0c^2 = 1$.'
    chapter: '6.6'
    anchor: maxwells-four-equations-are-two-equations-for-one-complex-vector
  - key: magnetic-constant
    title: Magnetic constant
    tex: '\mu_0'
    role: none
    kind: A constant; 1.257 × 10⁻⁶ V s A⁻¹ m⁻¹
    meaning: 'The constant in the Ampère–Maxwell law, $\nabla\times\mathbf B = \mu_0\mathbf J_q + c^{-2}\partial_t\mathbf E$, and in Poynting''s vector $\mathbf E\times\mathbf B/\mu_0$. It obeys $\varepsilon_0\mu_0c^2 = 1$. (Not a shear modulus $\mu$.)'
    chapter: '6.6'
    anchor: maxwells-four-equations-are-two-equations-for-one-complex-vector
  - key: charge-density
    title: Charge density
    tex: '\rho_q'
    role: none
    kind: A number at each point; in C/m³
    meaning: 'Electric charge per unit volume, the source of the electric field in Gauss''s law $\nabla\cdot\mathbf E = \rho_q/\varepsilon_0$. Its current density $\mathbf J_q$, in A/m², is the charge crossing a unit area per second. The subscript keeps both apart from the mass density $\rho$ and mass flux $\mathbf J$.'
    chapter: '6.6'
    anchor: maxwells-four-equations-are-two-equations-for-one-complex-vector
  - key: light-amplitude
    title: Complex amplitude of light
    tex: 'a'
    role: none
    kind: A complex number; in V/m
    meaning: 'The number in $\mathbf E + ic\mathbf B = a\,\mathbf m$ for a plane wave, $a = \sqrt2(E_1 - iE_2)$. Its path in the complex plane as the wave passes is the polarization: a circle for circular, a line for linear. A sensor that runs with the wave at rapidity $\eta$ reads $e^{-\eta}a$, the Doppler factor.'
    chapter: '6.6'
    anchor: in-a-light-wave-the-complex-field-is-a-multiple-of-one-null-vector
  - key: em-energy-density
    title: Energy density of the field
    tex: 'u'
    role: none
    kind: A number at each point; in J/m³
    meaning: 'The energy of the electric and magnetic fields per unit volume, $u = \tfrac12\varepsilon_0(E^2 + c^2B^2) = \tfrac12\varepsilon_0\,\mathbf F^*\cdot\mathbf F$. Sunlight at the Earth has $u = 4.54\times10^{-6}\,\mathrm{J\,m^{-3}}$. It changes from one observer to another. (Not a four-velocity $u^\mu$.)'
    chapter: '6.6'
    anchor: the-energy-of-the-field-and-its-flow-are-two-products-of-the-complex-field
  - key: poynting-vector
    title: Poynting vector
    tex: '\boldsymbol S'
    role: none
    kind: A vector at each point; in W/m²
    meaning: 'The flow of the field''s energy, $\mathbf S = \mathbf E\times\mathbf B/\mu_0 = \tfrac12\varepsilon_0c\,i\,\mathbf F\times\mathbf F^*$: the energy crossing a unit area per second. In a plane wave $\mathbf S = cu\,\hat k$; for sunlight $|\mathbf S| = 1361\,\mathrm{W\,m^{-2}}$. The paper builds gravity''s direction of travel from the same product of $\mathbf m$.'
    chapter: '6.6'
    anchor: the-energy-of-the-field-and-its-flow-are-two-products-of-the-complex-field
  - key: null-vector-z
    title: Null vector of a direction on the sky
    tex: '\boldsymbol m(z)'
    role: none
    kind: A complex vector with no unit, for each complex number z
    meaning: 'The paper''s $\mathbf m(z) = (1 - z^2, i(1 + z^2), -2z)$, a null vector for the direction $\hat n(z) = (2\,\mathrm{Re}\,z, 2\,\mathrm{Im}\,z, 1 - |z|^2)/(1 + |z|^2)$, labelled by its stereographic coordinate $z$. Light''s principal null directions solve $\mathbf m(z)\cdot\mathbf F = 0$, two roots; gravity''s solve $\mathbf m(z)^{\mathsf T}\mathcal W\mathbf m(z) = 0$, four.'
    chapter: '6.6'
    anchor: light-has-two-special-directions-where-gravity-has-four
  - key: stress-energy-tensor
    title: Stress–energy tensor
    tex: '\matter{T}^{\mu\nu}'
    role: matter
    kind: A symmetric 4 × 4 table, ten numbers; every entry in J/m³ (pascals)
    meaning: 'Where energy and momentum are and how they flow. $T^{00}$ is the energy density; $T^{0j} = T^{j0}$ is the energy flux across a face facing $j$ divided by $c$, and also $c$ times the momentum density; $T^{ij}$ is the momentum along $i$ that crosses a unit area facing $j$ each second. Its spatial block is the flow of momentum, $+p\,\delta_{ij}$ for a fluid at rest: the negative of chapter 4.3''s stress for matter at rest. It obeys $\partial_\nu T^{\mu\nu} = 0$, and the source of a weak static field is $T^{00} + T^{11} + T^{22} + T^{33}$.'
    chapter: '6.5'
    anchor: ten-numbers-say-where-energy-and-momentum-are-and-where-they-flow
  - key: principal-stresses
    title: Principal stresses
    tex: '\matter{p}_a'
    role: matter
    kind: Three numbers at each point; in pascals
    meaning: 'The paper''s $p_1, p_2, p_3$: the eigenvalues of the momentum flux $T^{ij}$ in the matter''s own frame, positive for a pressure and negative for a tension. A fluid has $p_a = p$ for each, so their sum is $3p$. Inside matter the trace of the tide is $4\pi G[\rho + (p_1 + p_2 + p_3)/c^2]$.'
    chapter: '6.5'
    anchor: in-the-stresses-the-sign-is-that-of-a-flow-of-momentum
  - key: casimir-energy-density
    title: Casimir energy density
    tex: 'u'
    role: none
    kind: A number; in J/m³
    meaning: 'The paper''s energy density of the field between two flat metal plates a distance $a$ apart, $u = -\pi^2\hbar c/720a^4$, below that of empty space: $-4.3\times10^{-4}\,\mathrm{J\,m^{-3}}$ at $a = 1\,\mu\mathrm m$. The stress across the plates is $3u$ and the two along them $-u$ each. (Not a four-velocity $u^\mu$ or a light-cone coordinate.)'
    chapter: '6.5'
    anchor: along-a-ray-of-light-the-table-gives-the-energy-less-c-times-the-momentum
  - key: crossing-energy
    title: Energy less c times momentum across a front
    tex: '\matter{\mathcal N}'
    role: matter
    kind: A number at each point of a wave's front; in J/m²
    meaning: 'The paper''s $\mathcal N(\mathbf x_\perp) = \int T_{\mu\nu}k^\mu k^\nu\,\mathrm d\ell$ along the null ray through $\mathbf x_\perp$, with $k^\mu = (1, 0, 0, 1)$ and $\ell = ct$ along the ray: the energy, less $c$ times the momentum along the wave, that crosses the front there. For particles it is $c\sum_aq_a\delta^2(\mathbf x_\perp - \mathbf x_a)$ with $q = E/c - p_z$; for slow matter $\Sigma c^2$. Ordinary matter has $\mathcal N \ge 0$.'
    chapter: '6.5'
    anchor: along-a-ray-of-light-the-table-gives-the-energy-less-c-times-the-momentum
  - key: riemann
    title: Riemann tensor
    tex: '\curv{R}^\alpha{}_{\beta\gamma\delta}'
    role: curv
    kind: A tensor of rank 4 with twenty independent numbers at each event; in m⁻² when every coordinate is a length
    meaning: 'The curvature of spacetime, in the paper''s (MTW''s) convention $R^\alpha{}_{\beta\gamma\delta} = \partial_\gamma\Gamma^\alpha{}_{\beta\delta} - \partial_\delta\Gamma^\alpha{}_{\beta\gamma} + \Gamma^\alpha{}_{\gamma\sigma}\Gamma^\sigma{}_{\beta\delta} - \Gamma^\alpha{}_{\delta\sigma}\Gamma^\sigma{}_{\beta\gamma}$. It is the one combination of the metric''s derivatives that no change of coordinates removes: two neighbouring free balls drift apart by $-R^\mu{}_{\alpha\nu\beta}u^\alpha\xi^\nu u^\beta$, and for an observer at rest the tide is $\mathcal E_{ij} = c^2R_{0i0j}$.'
    chapter: '7.2'
    anchor: the-riemann-tensor-is-built-from-the-christoffel-symbols-yet-it-is-a-tensor
  - key: riemann-lowered
    title: Riemann tensor, all indices lowered
    tex: '\curv{R}_{\alpha\beta\gamma\delta}'
    role: curv
    kind: A tensor of rank 4; in m⁻² when every coordinate is a length
    meaning: 'The Riemann tensor with its first index lowered by the metric, $R_{\alpha\beta\gamma\delta} = g_{\alpha\mu}R^\mu{}_{\beta\gamma\delta}$. It changes sign when the first two or the last two indices are exchanged, is unchanged when the two pairs are exchanged, and its cyclic sum over the last three vanishes; so it has 20 independent numbers in four dimensions. In a weak field $R_{\alpha\beta\gamma\delta} = \tfrac12(\partial_\beta\partial_\gamma h_{\alpha\delta} + \partial_\alpha\partial_\delta h_{\beta\gamma} - \partial_\alpha\partial_\gamma h_{\beta\delta} - \partial_\beta\partial_\delta h_{\alpha\gamma})$.'
    chapter: '7.2'
    anchor: to-first-order-the-curvature-is-made-of-second-derivatives-of-the-metric
  - key: ricci-tensor
    title: Ricci tensor
    tex: '\curv{R}_{\mu\nu}'
    role: curv
    kind: A symmetric 4 × 4 table, ten numbers at each event; in m⁻²
    meaning: 'The sum $R_{\mu\nu} = R^\alpha{}_{\mu\alpha\nu}$ of the Riemann tensor over its first and third indices: an average of the tides over directions. For an observer at rest $c^2R_{00}$ is the trace of the tide, which changes the volume of a ball of free dust. Einstein''s equation fixes it from the energy and stress at the same event, $R_{\mu\nu} = (8\pi G/c^4)(T_{\mu\nu} - \tfrac12Tg_{\mu\nu})$, so it is zero in empty space.'
    chapter: '7.3'
    anchor: the-trace-of-the-tide-is-the-ricci-curvature-along-the-observers-time
  - key: ricci-scalar
    title: Ricci scalar
    tex: '\curv{R}'
    role: curv
    kind: One number at each event, the same for every observer; in m⁻²
    meaning: 'The trace of the Ricci tensor, $R = g^{\mu\nu}R_{\mu\nu}$. Einstein''s equation makes it $-(8\pi G/c^4)T$, with $T$ the trace of the stress–energy tensor: $8\pi G\rho/c^2$ in dust. (A bare $R$; the Riemann tensor always carries four indices.)'
    chapter: '7.3'
    anchor: einsteins-equation-ties-the-curvature-to-the-energy-and-stress-at-each-point
  - key: einstein-tensor
    title: Einstein tensor
    tex: '\curv{G}_{\mu\nu}'
    role: curv
    kind: A symmetric 4 × 4 table, ten numbers at each event; in m⁻²
    meaning: 'The combination $G_{\mu\nu} = R_{\mu\nu} - \tfrac12Rg_{\mu\nu}$ of the Ricci tensor and scalar whose divergence is zero for every metric, by the contracted Bianchi identity. Einstein''s equation sets it to $(8\pi G/c^4)T_{\mu\nu}$. (With indices; a bare $G$ is Newton''s constant.)'
    chapter: '7.3'
    anchor: einsteins-equation-ties-the-curvature-to-the-energy-and-stress-at-each-point
  - key: stress-energy-trace
    title: Trace of the stress–energy tensor
    tex: '\matter{T}'
    role: matter
    kind: One number at each event, the same for every observer; in J/m³
    meaning: 'The contraction $T = g_{\mu\nu}T^{\mu\nu}$, which is $-T^{00} + T^{11} + T^{22} + T^{33}$ in an observer''s own frame: $-\rho c^2 + 3p$ for a fluid, $-\rho c^2$ for dust and $0$ for light. Trace reversal, $R_{\mu\nu} = (8\pi G/c^4)(T_{\mu\nu} - \tfrac12Tg_{\mu\nu})$, uses it. (Not a temperature.)'
    chapter: '7.3'
    anchor: einsteins-equation-ties-the-curvature-to-the-energy-and-stress-at-each-point
  - key: cosmological-constant
    title: Cosmological constant
    tex: '\Lambda'
    role: none
    kind: One number, the same everywhere; in m⁻²
    meaning: 'The constant in the term $\Lambda g_{\mu\nu}$ that Einstein''s equation allows on its left side, about $1.1\times10^{-52}\,\mathrm{m^{-2}}$ from the expansion of the universe. It adds $-\Lambda c^2 = -1.0\times10^{-35}\,\mathrm{s^{-2}}$ to the trace of the tide everywhere. (A bare $\Lambda$; with indices, $\Lambda_{ij,kl}$ is a projector and $\Lambda^\mu{}_\nu$ a boost.)'
    chapter: '7.3'
    anchor: pressure-and-stress-gravitate
  - key: weyl-tensor
    title: Weyl tensor
    tex: '\curv{C}_{\alpha\beta\gamma\delta}'
    role: curv
    kind: A tensor of rank 4 with ten independent numbers at each event; in m⁻²
    meaning: 'What is left of the Riemann tensor when its Ricci part is removed: it has every symmetry of the Riemann tensor and no trace. Einstein''s equation does not fix it at the event; it comes from matter elsewhere and from waves. In empty space it is the whole curvature, and for an observer at rest its ten numbers are the five of a trace-free tide and the five of a trace-free magnetic part.'
    chapter: '7.3'
    anchor: inside-matter-the-tide-has-a-part-fixed-by-the-matter-at-that-point
  - key: gauge-shift
    title: Gauge shift
    tex: '\zeta^\mu'
    role: none
    kind: Four functions of the event; in metres
    meaning: 'The small change of coordinates $x''^\mu = x^\mu + \zeta^\mu(x)$ of a weak field. It changes the metric perturbation by $h''_{\mu\nu} = h_{\mu\nu} - \partial_\mu\zeta_\nu - \partial_\nu\zeta_\mu$ and leaves the linearized curvature unchanged. Choosing it with $\Box\zeta_\nu = \partial^\mu\bar h_{\mu\nu}$ reaches harmonic gauge. (Not the separation $\xi$ of two free balls, nor the Calderón exponentials $\zeta_\pm$ of Section XIII.)'
    chapter: '7.4'
    anchor: relabelling-the-coordinates-changes-the-table-not-the-curvature
  - key: perturbation-trace
    title: Trace of the metric perturbation
    tex: '\field{h}^\alpha{}_\alpha'
    role: field
    kind: One pure number at each event, the same for every observer
    meaning: 'The sum $h^\alpha{}_\alpha = \eta^{\alpha\beta}h_{\alpha\beta} = -h_{00} + h_{11} + h_{22} + h_{33}$. Trace reversal, $\bar h_{\mu\nu} = h_{\mu\nu} - \tfrac12\eta_{\mu\nu}h^\alpha{}_\alpha$, changes its sign. Near a static slow body it is $-4\Phi/c^2$. Always written with its indices: a bare $h$ is a strain.'
    chapter: '7.4'
    anchor: trace-reversal-and-harmonic-gauge-tidy-the-equation
  - key: flow-curl
    title: Curl of the flow's potential
    tex: '\field{\vect b}'
    role: field
    kind: A vector at each point; in kg m⁻¹ s⁻¹
    meaning: 'The curl $\vect b = \nabla\times\vect A$ of the potential of a flow. Outside matter the magnetic part of the tide is $\mathcal B_{ij} = (G/c)(\partial_ib_j + \partial_jb_i)$, and a gyroscope at rest in a steady weak field turns at $(2G/c^2)\vect b$. Outside a round spinning body it is the spin dipole $[3\hat x(\vect L\cdot\hat x) - \vect L]/2r^3$.'
    chapter: '7.5'
    anchor: moving-matter-makes-the-magnetic-part-through-the-potential-of-its-flow
  - key: gyroscope-precession
    title: Precession of a gyroscope
    tex: '\vect\Omega_{\rm g}'
    role: none
    kind: An angular velocity; in rad/s
    meaning: 'The rate at which the axis of a gyroscope at rest in a steady weak field turns relative to the distant stars, $\vect\Omega_{\rm g} = -(c/2)\nabla\times\vect h_0 = (2G/c^2)\vect b$. Outside a spinning body it is the Lense–Thirring precession. Two gyroscopes a small vector $\vect\xi$ apart differ by $\mathcal B_{ij}\xi_j/c$.'
    chapter: '7.5'
    anchor: neighbouring-gyroscopes-turn-relative-to-one-another-at-the-magnetic-part-times-their-separation
  - key: tt-strain
    title: Strain of a gravitational wave (TT gauge)
    tex: '\field{h}^{\rm TT}_{ij}'
    role: field
    kind: A symmetric table of pure numbers at each event, across the direction of travel and with no trace
    meaning: 'The spatial part of the metric perturbation of a wave in the transverse-traceless gauge, where every entry with a time index is zero. It has $\hat k_jh^{\rm TT}_{ij} = 0$ and $h^{\rm TT}_{ii} = 0$, so it holds two numbers, $h^{\rm TT}_{ij} = h_+e^+_{ij} + h_\times e^\times_{ij}$. From any harmonic-gauge plane wave it is $\Lambda_{ij,kl}(\hat k)\bar h_{kl}$. Its tide is $\mathcal E_{ij} = -\tfrac12\partial_t^2h^{\rm TT}_{ij}$, and it moves a free ball by $\tfrac12h^{\rm TT}_{ij}\xi_j$.'
    chapter: '7.6'
    anchor: of-the-ten-amplitudes-of-a-plane-wave-two-are-physical
  - key: stress-transform
    title: Transform of the stress
    tex: '\matter{\tilde T}_{kl}(\omega, \vect k)'
    role: matter
    kind: A symmetric table of complex numbers for each frequency and wavevector; in N m s
    meaning: 'The stress $T_{kl}$ of a source, the flow of momentum through it, transformed in time and space: $\tilde T_{kl}(\omega, \mathbf k) = \int T_{kl}\,e^{i\omega t - i\mathbf k\cdot\mathbf x}\,\mathrm dt\,\mathrm d^3x$. Far away, the wave in the direction $\hat n$ reads it at $\mathbf k = \omega\hat n/c$, the paper''s eq:wave-zone. For a compact source it is $-\tfrac12\omega^2\tilde I_{kl}$ at $\mathbf k = 0$.'
    chapter: '7.7'
    anchor: far-away-each-direction-reads-the-stress-at-one-wavevector
  - key: radiated-power
    title: Power radiated in gravitational waves
    tex: 'P'
    role: none
    kind: A number; a power, in W
    meaning: 'The energy that a source sends out in gravitational waves each second, through any sphere round it. For a compact source it is $P = (G/5c^5)\langle\dddot I_{ij}\dddot I_{ij}\rangle$ with the trace of $I_{ij}$ removed; two 1 kg masses 1 m apart at sixteen turns a second give $4.55 \times 10^{-41}$ W. (Not the projector $P_{ij}$ of chapter 7.6.)'
    chapter: '7.7'
    anchor: the-power-is-set-by-the-third-derivative-of-the-quadrupole
  - key: wave-energy-density
    title: Energy density of a gravitational wave
    tex: '\matter{\mathcal U}'
    role: matter
    kind: A number; an energy per volume, in J/m³
    meaning: 'The energy that a gravitational wave carries in each cubic metre, averaged over a cycle: $\mathcal U = (c^2/32\pi G)\langle\dot h^{\rm TT}_{ij}\dot h^{\rm TT}_{ij}\rangle = (c^2/16\pi G)\langle\dot h_+^2 + \dot h_\times^2\rangle$. It moves at $c$, so the flux is $c\,\mathcal U$. A wave of strain $10^{-21}$ at 100 Hz holds $5.3\times10^{-12}\ \mathrm{J\,m^{-3}}$. It has a meaning only averaged over several wavelengths. Chapters 6.5 and 7.3 use the same letter for the energy density of light. (Not a displacement, a field, a light-cone coordinate or the retarded time, all written $u$.)'
    chapter: '7.8'
    anchor: the-heat-comes-from-the-wave-so-the-wave-carries-energy
  - key: emission-direction
    title: Direction of emission
    tex: '\hat n'''
    role: none
    kind: A vector of length one; no unit
    meaning: 'In the paper''s memory formula, eq:memory, the direction in which a piece of a burst''s energy leaves its source. The energy sent into each steradian about it is $\mathrm dE/\mathrm d^2\hat n''$, which the paper writes $\mathrm dE/\mathrm d\Omega''$.'
    chapter: '7.8'
    anchor: a-burst-that-carries-energy-away-leaves-the-strain-changed-for-good
  - key: camera-direction
    title: Direction from a source to the camera
    tex: '\hat N'
    role: none
    kind: A vector of length one; no unit
    meaning: 'In the paper''s memory formulas, the unit vector from the source of a burst to the camera. Emission close to $\hat N$ is crowded by the factor $1/(1 - \hat n''\cdot\hat N)$ but has little part across $\hat N$.'
    chapter: '7.8'
    anchor: a-burst-that-carries-energy-away-leaves-the-strain-changed-for-good
  - key: memory-step
    title: Memory
    tex: '\Delta\field h^{\rm TT}_{ij}'
    role: field
    kind: A symmetric table of pure numbers across the line of sight, with no trace
    meaning: 'The strain after a burst minus the strain before it, a constant. One narrow jet of energy $E$ at the angle $\theta$ leaves $\Delta h_+ = (2GE/c^4r)(1 + \cos\theta)$; a sphere or a dipole leaves nothing; a core collapse at 10 kpc with $q = 0.01$ leaves $4\times10^{-21}$ seen from the side.'
    chapter: '7.8'
    anchor: a-burst-that-carries-energy-away-leaves-the-strain-changed-for-good
  - key: radiated-energy
    title: Energy radiated in a burst of waves
    tex: '\matter{\Delta E}'
    role: matter
    kind: A number; an energy, in J
    meaning: 'The energy that a merger sends out in gravitational waves, which sets its memory, $\Delta h_+ = (G\Delta E/24c^4r)\sin^2\iota\,(17 + \cos^2\iota)$. The first merger LIGO detected radiated about three solar masses, $5.4\times10^{47}$ J.'
    chapter: '7.8'
    anchor: the-waves-own-energy-leaves-a-memory-too
  - key: burst-asymmetry
    title: Asymmetry of a burst
    tex: 'q'
    role: none
    kind: A pure number
    meaning: 'The strength of the part of a burst''s pattern that is stronger along an axis than across it, $\mathrm dE/\mathrm d\Omega'' = (E/4\pi)[1 + q\,P_2(\cos\theta'')]$; it leaves the memory $(qGE/2c^4r)\sin^2\theta$. (Not chapter 3.7''s $q = kz$.)'
    chapter: '7.8'
    anchor: a-burst-that-carries-energy-away-leaves-the-strain-changed-for-good
  - key: quantum-state
    title: Quantum state (a ket)
    tex: '|\psi\rangle'
    role: none
    kind: A column of complex amplitudes of length one; no unit
    meaning: 'The quantum state of a system: one complex amplitude for each outcome of a complete measurement, with the squared sizes adding to one. For a particle that can take path $L$ or $R$ it is $|\psi\rangle = \psi_L|L\rangle + \psi_R|R\rangle$. An overall factor $e^{i\alpha}$ changes nothing. (Not chapter 1.7''s classical state, a point of phase space.)'
    chapter: '8.1'
    anchor: a-quantum-state-is-a-list-of-complex-amplitudes
  - key: amplitude
    title: Amplitude of an outcome
    tex: '\psi_L'
    role: none
    kind: A complex number; no unit
    meaning: 'One entry of a quantum state, here the amplitude for the path $L$, $\psi_L = \langle L|\psi\rangle$. Its squared modulus is the probability of the outcome (the Born rule). Amplitudes of two ways to the same outcome add before they are squared, so they can cancel.'
    chapter: '8.1'
    anchor: a-quantum-state-is-a-list-of-complex-amplitudes
  - key: bra
    title: Bra
    tex: '\langle\chi|'
    role: none
    kind: A row of complex numbers; no unit
    meaning: 'The row of the conjugated entries of the state $|\chi\rangle$. A bra times a ket is a bracket, $\langle\chi|\psi\rangle = \sum_i\chi_i^*\psi_i$.'
    chapter: '8.1'
    anchor: a-quantum-state-is-a-list-of-complex-amplitudes
  - key: bracket
    title: Bracket of two states
    tex: '\langle\chi|\psi\rangle'
    role: none
    kind: A complex number; no unit
    meaning: 'Dirac''s product of two states, $\sum_i\chi_i^*\psi_i$, with the first factor conjugated: chapter 1.5b''s Hermitian product $\psi\cdot\chi^*$ written the other way round. Its squared modulus is the probability that a measurement asking "is it in $|\chi\rangle$?" says yes; it is one for a state with itself and zero for orthogonal states.'
    chapter: '8.1'
    anchor: a-quantum-state-is-a-list-of-complex-amplitudes
  - key: unitary-table
    title: Beam splitter (a unitary table)
    tex: 'U'
    role: none
    kind: A 2 × 2 table of complex numbers with U†U = 1; no unit
    meaning: 'The half-silvered mirror as a table that multiplies the state, $U = \tfrac{1}{\sqrt2}\bigl(\begin{smallmatrix}1 & i\\ i & 1\end{smallmatrix}\bigr)$: through with the amplitude $1/\sqrt2$, reflected with $i/\sqrt2$, a choice that treats both arrivals alike (a real table would also do). A unitary table keeps every bracket, so probabilities still add to one. (Not chapter 1.2''s potential energy $U$.)'
    chapter: '8.1'
    anchor: amplitudes-add-so-two-paths-can-cancel
  - key: path-phase
    title: Phase of a delay
    tex: '\phi'
    role: none
    kind: An angle; in radians
    meaning: 'The phase $e^{i\phi}$ that a longer path $L$ gives its amplitude, $\phi = 2\pi\ell/\lambda$ for an extra length $\ell$. In a Mach–Zehnder interferometer the particle leaves along $R$ with the probability $\cos^2(\phi/2)$.'
    chapter: '8.1'
    anchor: amplitudes-add-so-two-paths-can-cancel
  - key: wave-function
    title: Wave function
    tex: '\psi(x)'
    role: none
    kind: A complex function of position; in m^(−1/2) on a line
    meaning: 'The amplitudes of a particle''s positions: the probability of finding it between $x$ and $x + \mathrm dx$ is $|\psi(x)|^2\,\mathrm dx$. A particle of momentum $p$ and energy $E$ is the ripple $e^{i(px - Et)/\hbar}$, of wavelength $2\pi\hbar/p$. (Not chapter 2.5''s null-space potential $\psi$.)'
    chapter: '8.1'
    anchor: a-particle-on-a-line-is-described-by-a-wave-function
  - key: record-state
    title: States of a record
    tex: '|e_L\rangle,\ |e_R\rangle'
    role: none
    kind: Two quantum states of length one, of whatever outside the mass keeps a record
    meaning: 'The states in which a pixel''s masses, a graviton or anything else outside ends when the mass is at $L$ or at $R$. They multiply the interference term by their overlap: $P_R = \tfrac12[1 + \mathrm{Re}(\langle e_R|e_L\rangle e^{i\phi})]$, so a perfect record, $\langle e_R|e_L\rangle = 0$, leaves no fringes.'
    chapter: '8.1'
    anchor: a-record-of-the-place-multiplies-the-interference-by-the-overlap-of-the-records
  - key: operator
    title: Operator of a quantity
    tex: 'A'
    role: none
    kind: A Hermitian table (or, on wave functions, a rule such as a derivative); in the unit of its quantity
    meaning: 'The table that stands for a measurable quantity, $A = \sum_k a_k|k\rangle\langle k|$: its eigenvalues $a_k$ are the possible outcomes and its eigenvectors $|k\rangle$ the states in which the quantity has a definite value. It equals its conjugate transpose, $A^\dagger = A$. The tutorial puts no hat on an operator (hats are unit vectors) and gives it its quantity''s letter. (Not chapter 4.5''s sum $A$.)'
    chapter: '8.2'
    anchor: a-measurable-quantity-is-a-hermitian-table
  - key: quantum-mean
    title: Expectation value
    tex: '\langle A\rangle'
    role: none
    kind: A real number; in the unit of $A$
    meaning: 'The mean of the outcomes of $A$ over many runs prepared in the state $|\psi\rangle$, each weighted by its Born-rule probability: $\langle A\rangle = \langle\psi|A|\psi\rangle$. It is chapter 3.1''s mean, not chapter 3.2''s average over time.'
    chapter: '8.2'
    anchor: a-measurable-quantity-is-a-hermitian-table
  - key: pauli
    title: Pauli matrices
    tex: '\sigma_1,\ \sigma_2,\ \sigma_3'
    role: none
    kind: Three Hermitian 2 × 2 tables; pure numbers
    meaning: '$\sigma_1 = \bigl(\begin{smallmatrix}0 & 1\\ 1 & 0\end{smallmatrix}\bigr)$, $\sigma_2 = \bigl(\begin{smallmatrix}0 & -i\\ i & 0\end{smallmatrix}\bigr)$, $\sigma_3 = \mathrm{diag}(1, -1)$, each with the outcomes $\pm1$, and $[\sigma_1, \sigma_2] = 2i\sigma_3$. Bold $\boldsymbol\sigma$ is the three together. They carry numbers, never letters: $\sigma_x$ is a standard deviation and a bare $\sigma$ a surface density.'
    chapter: '8.2'
    anchor: a-measurable-quantity-is-a-hermitian-table
  - key: commutator
    title: Commutator
    tex: '[A, B]'
    role: none
    kind: An operator; in the unit of $AB$
    meaning: 'The difference $AB - BA$ of two products of operators. If it is not zero, no state gives both quantities definite values, and $\sigma_A\sigma_B \ge \tfrac12|\langle[A, B]\rangle|$. Dirac''s rule makes it $i\hbar$ times the Poisson bracket, as in $[x, p] = i\hbar$.'
    chapter: '8.2'
    anchor: two-quantities-that-do-not-commute-cannot-both-be-sharp
  - key: momentum-operator
    title: Momentum operator
    tex: 'p = -i\hbar\,\mathrm d/\mathrm dx'
    role: none
    kind: An operator on wave functions; in kg m s⁻¹
    meaning: 'Momentum acting on a wave function: $p\psi = -i\hbar\,\mathrm d\psi/\mathrm dx$, chosen so that the ripple $e^{ipx/\hbar}$ is a state of definite momentum $p$. With position it gives $[x, p] = i\hbar$, and with any function of position $[f(x), p] = i\hbar f''(x)$.'
    chapter: '8.2'
    anchor: momentum-is-a-derivative-and-x-p-ihbar
  - key: generated-unitary
    title: Unitary table made by a generator
    tex: 'U = e^{-i\lambda G/\hbar}'
    role: none
    kind: A unitary operator; no unit
    meaning: 'The change of state that a Hermitian generator $G$ makes, the solution of Schrödinger''s equation with $G$ in the place of $H$. It moves every quantity as $U^\dagger FU = F + \lambda\{F, G\} + \dots$, chapter 1.7''s motion. The momentum makes slides, $e^{-isp/\hbar}\psi(x) = \psi(x - s)$, and the paper''s impulse is $e^{i\epsilon Q_g/\hbar}$. (Not chapter 8.1''s beam splitter $U$.)'
    chapter: '8.2'
    anchor: a-generator-is-the-exponent-of-a-unitary-table
  - key: lowering-operator
    title: Lowering operator
    tex: 'a'
    role: none
    kind: An operator of an oscillator, not Hermitian; a pure number
    meaning: 'The combination $a = (m\omega x + ip)/\sqrt{2m\hbar\omega}$ of an oscillator''s position and momentum. With $[x, p] = i\hbar$ it has $[a, a^\dagger] = 1$, and the energy is $H = \hbar\omega(a^\dagger a + \tfrac12)$. It lowers a level by one quantum, $a|n\rangle = \sqrt n\,|n - 1\rangle$, and the ground state is the state with $a\psi_0 = 0$. Used only in chapters 8.3, 8.5 and 8.7. (Not the Kerr parameter, a radius or a semi-major axis.)'
    chapter: '8.3'
    anchor: the-oscillators-energy-factorizes-into-two-ladder-operators
  - key: raising-operator
    title: Raising operator
    tex: 'a^\dagger'
    role: none
    kind: The conjugate transpose of the lowering operator; a pure number
    meaning: 'The operator $a^\dagger = (m\omega x - ip)/\sqrt{2m\hbar\omega}$, which raises a level by one quantum, $a^\dagger|n\rangle = \sqrt{n + 1}\,|n + 1\rangle$. The product $a^\dagger a$ is the number operator, whose eigenvalue $n$ counts the quanta.'
    chapter: '8.3'
    anchor: the-oscillators-energy-factorizes-into-two-ladder-operators
  - key: quantum-number
    title: Number of quanta
    tex: 'n'
    role: none
    kind: A whole number, 0, 1, 2, …; no unit
    meaning: 'The eigenvalue of the number operator $a^\dagger a$: how many quanta $\hbar\omega$ an oscillator''s level holds above its zero point. (Not chapter 5.1''s refractive index.)'
    chapter: '8.3'
    anchor: its-energies-are-evenly-spaced-and-the-lowest-is-not-zero
  - key: level-energy
    title: Energy of a level
    tex: 'E_n'
    role: none
    kind: An energy; in J
    meaning: 'The energies an oscillator of angular frequency $\omega$ can have, $E_n = (n + \tfrac12)\hbar\omega$: evenly spaced by one quantum $\hbar\omega$, with the lowest, $\tfrac12\hbar\omega$, above zero. For the steel ball''s 15 kHz mode the step is $1.0\times10^{-29}$ J.'
    chapter: '8.3'
    anchor: its-energies-are-evenly-spaced-and-the-lowest-is-not-zero
  - key: zero-point-width
    title: Zero-point width
    tex: 'x_{\rm zp}'
    role: none
    kind: A length; in m
    meaning: 'The standard deviation of an oscillator''s position in its ground state, $x_{\rm zp} = \sqrt{\hbar/2m\omega}$, the zero-point motion that no cooling removes: $7.5\times10^{-21}$ m for the steel ball''s quadrupole swing, against $2.2\times10^{-16}$ m from heat at 300 K. In a thermal state $\langle x^2\rangle = x_{\rm zp}^2(2\bar n + 1)$.'
    chapter: '8.3'
    anchor: its-energies-are-evenly-spaced-and-the-lowest-is-not-zero
  - key: occupation
    title: Occupation number
    tex: '\bar n'
    role: none
    kind: A mean number of quanta; no unit
    meaning: 'The mean number of quanta in a mode. In thermal equilibrium it is the Bose–Einstein occupation $\bar n = 1/(e^{\hbar\omega/k_BT} - 1)$, about $k_BT/\hbar\omega$ when $\hbar\omega \ll k_BT$: $4.1\times10^8$ for the steel ball''s 15 kHz mode at 300 K, 0.09 for silicon''s Raman line. In a coherent state it is $|\alpha|^2 = E/\hbar\omega$. The paper''s $\bar n$.'
    chapter: '8.3'
    anchor: a-warm-mode-holds-about-k_bthbaromega-quanta
  - key: coth
    title: Hyperbolic cotangent
    tex: '\coth'
    role: none
    kind: A function of a pure number
    meaning: '$\coth u = \cosh u/\sinh u = (e^u + e^{-u})/(e^u - e^{-u})$, about $1/u + u/3$ for small $u$ and one for large $u$. A warm mode''s mean energy is $\tfrac12\hbar\omega\coth(\hbar\omega/2k_BT)$.'
    chapter: '8.3'
    anchor: a-warm-mode-holds-about-k_bthbaromega-quanta
  - key: coherent-eigenvalue
    title: Coherent-state amplitude
    tex: '\alpha'
    role: none
    kind: A complex number; no unit
    meaning: 'The eigenvalue of the lowering operator in a coherent state, $a|\alpha\rangle = \alpha|\alpha\rangle$, with $\alpha = (m\omega x_0 + ip_0)/\sqrt{2m\hbar\omega}$ for the ground state moved to $(x_0, p_0)$. Its squared size $|\alpha|^2$ is the mean number of quanta, and it turns as $\alpha e^{-i\omega t}$. (Not Section VI''s absorption coefficient.)'
    chapter: '8.3'
    anchor: a-classical-oscillation-is-a-state-of-many-quanta-in-step
  - key: spin-up-down
    title: Spin up and spin down
    tex: '|{\uparrow}\rangle,\ |{\downarrow}\rangle'
    role: none
    kind: Two states of a spin one half; columns of two complex numbers
    meaning: 'The states $(1, 0)$ and $(0, 1)$ of a spin one half, in which the spin along $z$ is $+\tfrac12$ and $-\tfrac12$ (in units of $\hbar$) for certain. They are the eigenvectors of $\sigma_3$, and every state of a spin one half is a sum of them.'
    chapter: '8.4'
    anchor: a-spin-one-half-is-a-state-of-two-components
  - key: spin-vector
    title: Spin operator
    tex: '\mathbf S,\ S_k'
    role: none
    kind: Three Hermitian operators; in units of $\hbar$ from chapter 8.4 on
    meaning: 'The spin along the three axes. For a spin one half $\mathbf S = \tfrac12\boldsymbol\sigma$ (in units of $\hbar$), with the outcomes $\pm\tfrac12$ along every axis, and $[S_x, S_y] = iS_z$, the rule of every angular momentum. For $N$ spins one half the total is $\tfrac12\sum_a\boldsymbol\sigma^{(a)}$; on a reading it acts as $S_k\mathcal W = [iL_k, \mathcal W]$. (Not the tidal column $S(\hat n)$, the spectra $S_{yy}$ or chapter 6.6''s Poynting vector.)'
    chapter: '8.4'
    anchor: a-spin-one-half-is-a-state-of-two-components
  - key: spin-direction-state
    title: Spin up along a direction
    tex: '|\hat n\rangle'
    role: none
    kind: A state of a spin one half, for each unit vector $\hat n$
    meaning: 'The state $(\cos\tfrac\vartheta2,\ e^{i\varphi}\sin\tfrac\vartheta2)$, spin up along $\hat n = (\sin\vartheta\cos\varphi, \sin\vartheta\sin\varphi, \cos\vartheta)$. Every state of a spin one half is one of these up to a phase, and two of them overlap as $|\langle\hat n_1|\hat n_2\rangle|^2 = \cos^2(\vartheta_{12}/2)$: 0.75 at 60°, zero for opposite directions. With all $2s$ spins of a spin $s$ along $\hat n$ it is the spin coherent state $|\hat n\rangle_s$.'
    chapter: '8.4'
    anchor: every-state-of-a-spin-one-half-points-somewhere
  - key: density-matrix
    title: Density matrix
    tex: '\varrho'
    role: none
    kind: A Hermitian table of pure numbers with trace one
    meaning: 'The table $\varrho = \sum_ap_a|\psi_a\rangle\langle\psi_a|$ of a mixture of states $|\psi_a\rangle$ with probabilities $p_a$; every mean is $\langle A\rangle = \mathrm{tr}(\varrho A)$. For a spin one half $\varrho = \tfrac12(1 + \mathbf b\cdot\boldsymbol\sigma)$. The paper''s $\varrho$, a curly rho; never $\rho$, which is a density of mass or Section VIII''s signal-to-noise ratio.'
    chapter: '8.4'
    anchor: a-mixture-is-described-by-a-density-matrix-and-its-arrow-is-shorter
  - key: bloch-vector
    title: Bloch vector
    tex: '\mathbf b'
    role: none
    kind: A real vector of length at most one; no unit
    meaning: 'The mean of $\boldsymbol\sigma$ for a spin one half, $\mathbf b = \langle\boldsymbol\sigma\rangle = \mathrm{tr}(\varrho\boldsymbol\sigma)$, twice its mean spin. Its length is one for a pure state, less for a mixture, and zero for an unpolarized spin: 0.71 for half spin up along $z$ and half along $x$. For one of the four spins of a reading it is $\mathbf P/u$, the super-Poynting vector over the super-energy. (Bold b for Bloch; not the second amplitude $b$ of a state $(a, b)$ or chapter 8.2''s kick $b$.)'
    chapter: '8.4'
    anchor: a-mixture-is-described-by-a-density-matrix-and-its-arrow-is-shorter
  - key: spin-number
    title: Spin of a quantum state
    tex: 's'
    role: none
    kind: A whole or half-whole number, 0, ½, 1, 3/2, 2, …
    meaning: 'The largest spin component of a state: a symmetric state of $N$ spins one half has $s = N/2$ and $2s + 1$ components. Light''s complex field at a point is a spin one; a gravitational reading $\mathcal W$ is a spin two. It is the same number as chapter 1.5b''s spin of the pattern''s extreme component. (Not a singular value, which is always subscripted, nor chapter 3.7''s ratio $s$.)'
    chapter: '8.4'
    anchor: a-spin-s-is-a-symmetric-state-of-2s-spins-one-half
  - key: spin-component
    title: Spin component
    tex: 'm'
    role: none
    kind: A number from $-s$ to $s$ in steps of one
    meaning: 'The outcome of $S_z$ on the basis state $|s, m\rangle$ of a spin $s$, with $k = s + m$ of its $2s$ spins one half up. A turn by $\theta$ about $z$ multiplies that component by $e^{-im\theta}$, chapter 1.5b''s factor; turning the axes instead multiplies it by $e^{+im\theta}$, so 1.5b''s arrow and shear are the components $m = -1$ and $-2$. (Not a mass, nor the null vector $\vect m$; the same kind of number as chapter 2.2''s order $m$.)'
    chapter: '8.4'
    anchor: a-spin-s-is-a-symmetric-state-of-2s-spins-one-half
  - key: super-poynting
    title: Super-Poynting vector
    tex: '\mathbf P,\ P_k'
    role: none
    kind: A real vector; in s⁻⁴
    meaning: 'The paper''s super-Poynting vector $\mathbf P$, with the components $P_k = \epsilon_{kij}(\mathcal E\mathcal B)_{ij}$, built from a reading''s tide and magnetic part as light''s Poynting vector is built from its fields. It is zero when $\mathcal E$ and $\mathcal B$ share their axes, as for masses at rest, and equals $u\hat k$ for one wave travelling along $\hat k$. Over the super-energy it is the Bloch vector of one of the reading''s four spins one half.'
    chapter: '8.4'
    anchor: one-of-the-four-spins-of-a-reading-points-along-its-super-poynting-vector
  - key: super-energy
    title: Super-energy
    tex: 'u'
    role: none
    kind: A positive number; in s⁻⁴
    meaning: 'The paper''s $u = \tfrac12(|\mathcal E|^2 + |\mathcal B|^2)$, half the squared length of the reading $\mathcal W$, built as light''s energy density is built from its fields. Every reading has $|\mathbf P| \le u$, with equality for one wave. (Not chapter 6.6''s energy density $u$ of light, or the four-velocity $u^\mu$.)'
    chapter: '8.4'
    anchor: one-of-the-four-spins-of-a-reading-points-along-its-super-poynting-vector
  - key: count-distribution
    title: Count distribution
    tex: 'P(n)'
    role: none
    kind: A probability for each count n = 0, 1, 2, …; no unit
    meaning: 'The probability that a detector counts $n$ quanta of a mode in a window. A coherent state gives the Poisson law $e^{-\bar n}\bar n^n/n!$, of variance $\bar n$; a thermal mode the geometric law $\bar n^n/(1 + \bar n)^{n+1}$, of variance $\bar n + \bar n^2$. (Not a power, nor the paper''s super-Poynting vector $\mathbf P$.)'
    chapter: '8.5'
    anchor: a-steady-source-gives-poisson-counts
  - key: quadrature
    title: Quadratures
    tex: 'X_1, X_2'
    role: none
    kind: Two amplitudes, in the unit of the wave
    meaning: 'The amplitudes of the cosine and sine parts of a wave of one frequency at one place, $q(t) = X_1\cos\omega t + X_2\sin\omega t$. They are fixed for a steady wave and wander over a coherence time for noise; for heat they are independent Gaussian numbers. For an oscillator they are $x$ and $p/m\omega$.'
    chapter: '8.5'
    anchor: a-thermal-source-gives-geometric-counts-with-a-larger-spread
  - key: wave-intensity
    title: Intensity
    tex: 'I'
    role: none
    kind: A power per unit area; in W m⁻²
    meaning: 'The power per square metre that a wave carries, averaged over a cycle, in proportion to $X_1^2 + X_2^2$. A detector that counts at random clicks at a mean rate in proportion to it. (Not Stokes $I$, Part 9''s invariant $I$ or a moment of inertia.)'
    chapter: '8.5'
    anchor: a-thermal-source-gives-geometric-counts-with-a-larger-spread
  - key: second-order-coherence
    title: Second-order coherence
    tex: 'g^{(2)}'
    role: none
    kind: A pure number
    meaning: 'The rate of coincident counts over that of independent arrivals, $g^{(2)} = \langle n(n - 1)\rangle/\bar n^2 = \langle a^\dagger a^\dagger aa\rangle/\langle a^\dagger a\rangle^2$: 1 for a coherent source, 2 for a thermal one. Every classical wave has $g^{(2)} \ge 1$. The paper''s $g^{(2)}$.'
    chapter: '8.5'
    anchor: one-number-tells-the-two-apart-and-no-classical-wave-brings-it-below-one
  - key: cross-coherence
    title: Cross coherence of two detectors
    tex: 'g^{(2)}_{12}'
    role: none
    kind: A pure number
    meaning: 'The rate at which two detectors click together over the rate for independent clicks, $\langle n_1n_2\rangle/\bar n_1\bar n_2$. Classical waves obey $g^{(2)}_{12} \le \sqrt{g^{(2)}_{11}g^{(2)}_{22}}$, at most 2 for thermal beams; a two-mode squeezed state gives $2 + 1/\bar n$. The paper writes it $g^{(2)}$.'
    chapter: '8.5'
    anchor: one-number-tells-the-two-apart-and-no-classical-wave-brings-it-below-one
  - key: squeezing-parameter
    title: Squeezing parameter
    tex: 'r'
    role: none
    kind: A real number; no unit
    meaning: 'How strongly a state is squeezed: a squeezed vacuum has the spread $e^{-r}x_{\rm zp}$ in one quadrature and $e^{r}x_{\rm zp}$ in the other, and holds $\bar n = \sinh^2r$ quanta in pairs. (Not a distance.)'
    chapter: '8.5'
    anchor: a-squeezed-state-is-narrower-than-the-zero-point-in-one-direction
  - key: pair-amplitude
    title: Amplitudes of a two-mode squeezed state
    tex: 'c_n'
    role: none
    kind: Real numbers; no unit
    meaning: 'The amplitude $c_n = \tanh^nr/\cosh r$ of $n$ quanta in each of two modes, in the two-mode squeezed state $\sum_nc_n|n\rangle|n\rangle$. Their squares are the thermal law with $\bar n = \sinh^2r$, so each mode alone is thermal.'
    chapter: '8.5'
    anchor: pairs-in-two-modes-coincide-more-than-thermal-classical-waves-can
  - key: first-reading-spread
    title: Sharpness of a first reading
    tex: '\sigma_0'
    role: none
    kind: A standard deviation; in metres
    meaning: 'The standard deviation of a free mass''s position at once after a first reading. The reading''s kick then gives its momentum a spread of at least $\hbar/2\sigma_0$, and a time $\tau$ later its position has the spread $\sigma_x(\tau) \ge \sqrt{\sigma_0^2 + (\hbar\tau/2m\sigma_0)^2}$, least when $\sigma_0 = \sqrt{\hbar\tau/2m}$.'
    chapter: '8.6'
    anchor: reading-a-position-disturbs-the-momentum
  - key: reading-time
    title: Reading time
    tex: '\tau'
    role: none
    kind: A time; in seconds
    meaning: 'The time over which a mass, a pixel or a camera is watched: between the two readings of a free mass, or the whole observation in the paper''s ceiling $\mathrm{SNR} \lesssim M_sc^2\tau/\hbar$. (Chapter 4.4''s $\tau$ is a relaxation time, and chapter 5.5''s an optical depth.)'
    chapter: '8.6'
    anchor: a-free-mass-watched-for-a-time-cannot-be-followed-better-than-the-standard-quantum-limit
  - key: sql-width
    title: Standard quantum limit of a free mass
    tex: '\sigma_{\rm SQL}'
    role: none
    kind: A standard deviation; in metres
    meaning: 'The least spread of a free mass''s position a time $\tau$ after a first reading, $\sqrt{\hbar\tau/m}$, when the reading is of the position and leaves no chirp: $3.25 \times 10^{-16}$ m for a gram and a second. Chapter R1 wrote it $\Delta x$.'
    chapter: '8.6'
    anchor: a-free-mass-watched-for-a-time-cannot-be-followed-better-than-the-standard-quantum-limit
  - key: smallest-tide
    title: Smallest resolved tide
    tex: '\Delta\curv{\mathcal{E}}'
    role: curv
    kind: A tide; in s⁻²
    meaning: 'The smallest tide that moves two free masses a distance $\xi$ apart by more than the standard quantum limit in the time $\tau$, about $2\sigma_{\rm SQL}/\xi\tau^2$: $6.5 \times 10^{-14}\,\mathrm{s^{-2}}$ for two grams a centimetre apart read for a second, and $\sqrt2$ times more for the distance between them.'
    chapter: '8.6'
    anchor: two-gram-masses-read-for-a-second-resolve-a-tide-a-hundred-thousand-times-smaller-than-the-persons
  - key: arm-length
    title: Arm length of an interferometer
    tex: 'L'
    role: none
    kind: A length; in metres
    meaning: 'The length of each arm of an interferometer such as LIGO, 4 km. A strain $h$ changes the difference of the two arms by $hL$. (Elsewhere $L_k$ are the generators of turns.)'
    chapter: '8.6'
    anchor: the-standard-quantum-limit-belongs-to-one-way-of-reading-and-it-can-be-beaten
  - key: sql-strain
    title: Standard quantum limit of an interferometer
    tex: 'h_{\rm SQL}'
    role: none
    kind: An amplitude spectral density of strain, one-sided; in Hz⁻¹ᐟ²
    meaning: 'The least quantum noise of an interferometer with free mirrors of mass $m$ and arms of length $L$ at the angular frequency $\omega$, where shot noise and radiation pressure balance: $\sqrt{8\hbar/m\omega^2L^2}$, $1.8 \times 10^{-24}\,\mathrm{Hz^{-1/2}}$ at 100 Hz for LIGO''s 40 kg mirrors.'
    chapter: '8.6'
    anchor: the-standard-quantum-limit-belongs-to-one-way-of-reading-and-it-can-be-beaten
  - key: energy-spread
    title: Spread of energy
    tex: '\sigma_E'
    role: none
    kind: A standard deviation; in joules
    meaning: 'The standard deviation of the energy of a quantum state, $\sqrt{\langle H^2\rangle - \langle H\rangle^2}$. It sets how fast the state can become different from itself: no faster than in the time $\pi\hbar/2\sigma_E$.'
    chapter: '8.6'
    anchor: no-state-changes-faster-than-its-energy-spread-allows-and-that-caps-every-camera
  - key: orthogonality-time
    title: Time to become orthogonal
    tex: 't_\perp'
    role: none
    kind: A time; in seconds
    meaning: 'The first time at which a state has become orthogonal to its starting state, so that one measurement could tell the two apart for certain. Mandelstam and Tamm''s bound is $t_\perp \ge \pi\hbar/2\sigma_E$; a state of two levels meets it.'
    chapter: '8.6'
    anchor: no-state-changes-faster-than-its-energy-spread-allows-and-that-caps-every-camera
  - key: quantum-fisher
    title: Quantum Fisher information
    tex: 'F_Q'
    role: none
    kind: A number; in the inverse square of the unit of the parameter
    meaning: 'The largest Fisher information about a parameter that any measurement of a quantum state can draw. For a parameter $\theta$ that enters through an interaction $\theta V$ acting for a time $\tau$, it is $4\sigma_V^2\tau^2/\hbar^2$, with $\sigma_V$ the standard deviation of $V$.'
    chapter: '8.6'
    anchor: no-state-changes-faster-than-its-energy-spread-allows-and-that-caps-every-camera
  - key: interaction-energy
    title: Energy of interaction
    tex: 'E_{\rm int}'
    role: none
    kind: An energy; in joules
    meaning: 'The spread $\theta\sigma_V$ of the energy $\theta V$ with which a camera and the scene are coupled. No signal-to-noise ratio above $2E_{\rm int}\tau/\hbar$ can be reached in the time $\tau$; for a camera that is not a black hole $E_{\rm int} \le M_sc^2/4$, which gives $M_sc^2\tau/2\hbar$, and the paper rounds the ceiling to $M_sc^2\tau/\hbar$.'
    chapter: '8.6'
    anchor: no-state-changes-faster-than-its-energy-spread-allows-and-that-caps-every-camera
  - key: source-mass
    title: Mass of the source
    tex: '\matter{M}_s'
    role: matter
    kind: A mass; in kilograms
    meaning: 'The mass of the body a camera watches, in the paper''s ceiling $\mathrm{SNR} \lesssim M_sc^2\tau/\hbar$: 70 kg for the person, 324 kg for the locked safe''s gold.'
    chapter: '8.6'
    anchor: no-state-changes-faster-than-its-energy-spread-allows-and-that-caps-every-camera
  - key: povm-element
    title: Table of one outcome of a measurement
    tex: '\Pi_k'
    role: none
    kind: A positive Hermitian table
    meaning: 'In a general measurement, the table of the outcome $k$: the outcome has the probability $\langle\psi|\Pi_k|\psi\rangle$, and the tables of all the outcomes add to the identity. For chapter 8.1''s orthonormal outcomes, $\Pi_k = |k\rangle\langle k|$.'
    chapter: '8.6'
    anchor: a-measurement-is-a-set-of-positive-tables-that-add-to-one-and-a-gravitons-click-carries-about-a-bit
  - key: coherent-povm
    title: Measurement by coherent states
    tex: '\Pi(\hat n)'
    role: none
    kind: A positive table for each direction; per steradian
    meaning: 'The measurement $\Pi(\hat n)\,\mathrm d\Omega = \tfrac{2s+1}{4\pi}|\hat n\rangle_s\langle\hat n|_s\,\mathrm d\Omega$ made of the spin coherent states of all directions. One quantum from $\hat n_0$ clicks at the angle $\vartheta$ from it with the density $\tfrac{2s+1}{4\pi}\cos^{4s}(\vartheta/2)$.'
    chapter: '8.6'
    anchor: a-measurement-is-a-set-of-positive-tables-that-add-to-one-and-a-gravitons-click-carries-about-a-bit
  - key: step-function
    title: Step function
    tex: '\theta(t)'
    role: none
    kind: A function of time; no unit
    meaning: 'One for $t > 0$ and zero for $t < 0$. In the Kubo formula $\chi_{yy}(t) = (i/\hbar)\,\theta(t)\langle[y(t), y(0)]\rangle$ it says that a body answers a blow only after it. (Not an angle $\theta$.)'
    chapter: '8.7'
    anchor: the-response-to-a-push-is-a-commutator
  - key: symmetrized-spectrum
    title: Symmetrized spectrum
    tex: '\bar S_{yy}'
    role: none
    kind: A real, even function of the angular frequency (two-sided); the square of the unit of y times a second
    meaning: 'The transform of the average of the two orders, $\tfrac12\langle y(t)y(0) + y(0)y(t)\rangle$, in chapter 3.2''s convention, so that $\langle y^2\rangle = \int\bar S_{yy}\,\mathrm d\omega/2\pi$. By the quantum fluctuation–dissipation theorem it is $\hbar\coth(\hbar\omega/2k_BT)\,\mathrm{Im}\,\chi_{yy}$. Chapter 4.6''s classical $S_{yy} = 2k_BT\,\mathrm{Im}\,\chi_{yy}/\omega$ is its limit when $\hbar\omega \ll k_BT$.'
    chapter: '8.7'
    anchor: the-tremor-at-each-frequency-is-hbarcothhbaromega2k_bt-times-the-friction-there
  - key: unsymmetrized-spectrum
    title: Unsymmetrized spectrum
    tex: 'S_{yy}(\omega)'
    role: none
    kind: A real function of the angular frequency, not even; the square of the unit of y times a second
    meaning: 'The transform of one order alone, $\int\langle y(t)y(0)\rangle e^{i\omega t}\,\mathrm dt$; $S_{yy}(-\omega)$ is that of the other order. Positive frequencies are absorption, negative ones emission: in equilibrium $S_{yy}(\omega) = 2\hbar(\bar n + 1)\,\mathrm{Im}\,\chi_{yy}$ and $S_{yy}(-\omega) = e^{-\hbar\omega/k_BT}S_{yy}(\omega)$, detailed balance. (Chapter 4.6''s classical $S_{yy}$ is even and has no bar either; in Part 8 it is $\bar S_{yy}$.)'
    chapter: '8.7'
    anchor: a-cold-body-can-take-energy-from-a-push-but-has-none-to-give
  - key: frequency-weight
    title: Weight of the frequencies of a response
    tex: '\mu(\mathrm d\omega)'
    role: none
    kind: A probability distribution over the positive angular frequencies; no unit
    meaning: 'Appendix A''s measure $(2/\pi\chi_0)\,\mathrm{Im}\,\chi(\omega)\,\mathrm d\omega/\omega$, the share of the static compliance $\chi_0$ held near each frequency. It adds up to one by the dispersion relation at zero frequency, and its mean of $\omega^2$ is $A/\chi_0$ by the sum rule. (Not the shear modulus $\mu$.)'
    chapter: '8.7'
    anchor: the-static-jitter-lies-between-two-bounds
  - key: artanh
    title: Inverse hyperbolic tangent
    tex: '\mathrm{artanh}'
    role: none
    kind: A function of a number between −1 and 1
    meaning: 'The inverse of $\tanh$: $\mathrm{artanh}\,z = u$ when $\tanh u = z$, about $z$ for small $z$. The quantum thermometer is $T = \hbar\omega/2k_B\,\mathrm{artanh}(\hbar\,\mathrm{Im}\,\chi_{yy}/\bar S_{yy})$.'
    chapter: '8.7'
    anchor: the-thermometer-still-needs-no-model
  - key: mode-coupling
    title: Weight of a mode in a reading
    tex: 'c_n'
    role: none
    kind: A number for each normal mode; the unit of the reading per unit of mass-weighted amplitude
    meaning: 'How far mode $n$ moves a reading $y$, or a moment $Q_h$, per unit of its mass-weighted amplitude (chapters 4.3 and 4.6; Appendix A''s $c_n$). The same $c_n^2$ weigh the mode in the reading''s tremor and in its response, $\chi_{yy} = \sum_nc_n^2/(\omega_n^2 - \omega^2 - i\Gamma_n\omega)$. (Not the amplitudes $c_n$ of chapter 8.5 or the Fourier coefficients of chapter 2.6.)'
    chapter: '8.7'
    anchor: the-tremor-at-each-frequency-is-hbarcothhbaromega2k_bt-times-the-friction-there
  - key: turn-angle
    title: Angle of a turn about an axis
    tex: '\psi'
    role: none
    kind: An angle; in radians
    meaning: 'The angle by which a field is turned about an axis $\hat k$, anticlockwise as seen from the side toward which $\hat k$ points, by chapter 1.7''s $R = \exp(\psi\,\hat k\cdot L)$. It turns $\vect m$ to $e^{-i\psi}\vect m$ and a table of spin weight $m$ to $e^{-im\psi}$ times itself. (Not chapter 8.1''s quantum state $\psi$, nor chapter 2.5''s null-space potential.)'
    chapter: '9.1'
    anchor: a-readings-five-numbers-carry-spin-weights-from--2-to-2-about-any-axis
  - key: spin-weight
    title: Spin weight
    tex: 'm'
    role: none
    kind: A whole number from $-2$ to 2 for a reading; from $-s$ to $s$ for a spin $s$
    meaning: 'The power of $e^{-i\psi}$ by which a turn by $\psi$ about an axis $\hat k$ multiplies a table: 2 for $\vect m\vect m^{\mathsf T}$, 1 for $\vect m\hat k^{\mathsf T} + \hat k\vect m^{\mathsf T}$, 0 for $3\hat k\hat k^{\mathsf T} - 1$, and $-1$, $-2$ for their conjugates. It is chapter 8.4''s spin component. A plane wave fills only the weight 2 about its direction of travel. Components read in turned axes take the opposite factor. (Not a mass, nor the null vector $\vect m$, which is always bold.)'
    chapter: '9.1'
    anchor: a-readings-five-numbers-carry-spin-weights-from--2-to-2-about-any-axis
  - key: frequency-parts
    title: Complex amplitude of a wave's tide
    tex: '\tilde{\curv\tE}'
    role: curv
    kind: A constant complex symmetric trace-free table; in s⁻²
    meaning: 'For a tide that changes at one angular frequency, $\mathcal E(t) = \tfrac12\tilde{\mathcal E}e^{-i\omega t} + \tfrac12\tilde{\mathcal E}^*e^{i\omega t}$, as chapter 5.4 wrote the strain: the first term is the positive-frequency part, its conjugate the negative-frequency part. The magnetic part has its own $\tilde{\mathcal B}$. If $\tilde{\mathcal E}$ is a multiple of $\vect m\vect m^{\mathsf T}$, the wave has helicity $+2$ and $\tilde{\mathcal B} = -i\tilde{\mathcal E}$; if it is a multiple of $\vect m^*\vect m^{*\mathsf T}$, helicity $-2$ and $\tilde{\mathcal B} = i\tilde{\mathcal E}$.'
    chapter: '9.1'
    anchor: the-sign-of-the-frequency-gives-the-helicity
  - key: helicity-amplitudes
    title: Helicity amplitudes of one wave
    tex: '\curv\alpha^\pm'
    role: curv
    kind: Two complex numbers; in s⁻²
    meaning: 'The paper''s amplitudes in $\mathcal W_\pm = \alpha^\pm\,\vect m\vect m^{\mathsf T}$, the parts of one wave''s reading at $e^{\mp i\omega t}$ in $\mathcal W(t) = \mathcal W_+e^{-i\omega t} + \mathcal W_-e^{i\omega t}$ (since $\mathcal W$ is complex, $\mathcal W_-$ is not the conjugate of $\mathcal W_+$). $\alpha^+$ belongs to the helicity $+2$ and $\alpha^-$ to $-2$; a wave of helicity $+2$ has $\mathcal W_+ = \tilde{\mathcal E}$. For the rotor seen at the inclination $\iota$, $|\alpha^+/\alpha^-| = \cot^4(\iota/2)$. (The paper''s $\alpha^\pm_a$ of its pencil; not chapter 8.3''s coherent state $\alpha$.)'
    chapter: '9.1'
    anchor: on-the-sky-a-quantity-of-spin-weight-s-begins-at-degree-s
  - key: weyl-eigenvalue
    title: Eigenvalue of the complex tidal table
    tex: '\curv{w}_a'
    role: curv
    kind: Three complex numbers that add up to zero; in s⁻²
    meaning: 'The paper''s eigenvalues $w_1$, $w_2$, $w_3$ of $\mathcal W$, the roots of $\lambda^3 - \tfrac12I\lambda - \tfrac13J$. Every observer, turned or moving, finds the same three. One mass gives $(GM/r^3)(1, 1, -2)$; a repeated eigenvalue is $w = -J/I$, positive for a single body. They are real for a scene at rest and complex when something in the scene moves or turns. (Not chapter 3.9''s place $w = x + iy$ on a camera''s plane.)'
    chapter: '9.2'
    anchor: two-complex-numbers-fix-the-eigenvalues-of-a-trace-free-three-by-three-table
  - key: invariant-i
    title: First invariant of a reading
    tex: 'I'
    role: none
    kind: A complex number; in s⁻⁴
    meaning: 'The paper''s $I = \mathrm{tr}\,\mathcal W^2 = w_1^2 + w_2^2 + w_3^2$, the same for every observer. With $J$ it fixes the eigenvalues, the roots of $\lambda^3 - \tfrac12I\lambda - \tfrac13J$. One mass gives $6(GM/r^3)^2$, $1.31 \times 10^{-16}\,\mathrm{s^{-4}}$ for a person a metre away; a single wave gives 0. In Part 9 a bare $I$ is always this invariant. (Not Stokes $I$, an intensity, a moment of inertia or a second moment $I_{ij}$.)'
    chapter: '9.2'
    anchor: two-complex-numbers-fix-the-eigenvalues-of-a-trace-free-three-by-three-table
  - key: invariant-j
    title: Second invariant of a reading
    tex: 'J'
    role: none
    kind: A complex number; in s⁻⁶
    meaning: 'The paper''s $J = \mathrm{tr}\,\mathcal W^3 = w_1^3 + w_2^3 + w_3^3 = 3\det\mathcal W$, the same for every observer. One mass gives $-6(GM/r^3)^3$. Two eigenvalues are equal exactly when $1 - 6J^2/I^3 = 0$, and then the repeated one is $-J/I$. (Not the current column $\mathbf J$ or a momentum density.)'
    chapter: '9.2'
    anchor: two-complex-numbers-fix-the-eigenvalues-of-a-trace-free-three-by-three-table
  - key: complex-rotation
    title: Complex rotation
    tex: 'P'
    role: none
    kind: A 3×3 table of complex numbers with PᵀP = 1 and determinant 1
    meaning: 'A table that keeps the dot product without conjugates, as turns and boosts do. Every one splits as $P = R_0e^{iK_0}$, a boost $e^{iK_0}$ followed by a real turn $R_0$, with $e^{2iK_0} = P^\dagger P$. A reading with three different eigenvalues is $\mathcal W = P\,\mathrm{diag}(w_1, w_2, w_3)\,P^{\mathsf T}$. (Not a power, a projector $P_{ij}$, a count distribution $P(n)$ or the bold super-Poynting vector $\mathbf P$.)'
    chapter: '9.2'
    anchor: every-complex-rotation-is-a-boost-followed-by-a-turn
  - key: polar-turn
    title: The turn of a complex rotation
    tex: 'R_0'
    role: none
    kind: A real orthogonal 3×3 table
    meaning: 'The real part left of a complex rotation $P$ once its boost is removed, $R_0 = Pe^{-iK_0}$. For a reading it holds three angles, the orientation of the field''s own axes. For two boosts of $0.6c$ at right angles it is a turn of $12.7°$, the Wigner rotation.'
    chapter: '9.2'
    anchor: every-complex-rotation-is-a-boost-followed-by-a-turn
  - key: polar-boost
    title: The boost of a complex rotation
    tex: 'K_0'
    role: none
    kind: A real antisymmetric 3×3 table; a pure number
    meaning: 'The table with $e^{2iK_0} = P^\dagger P$ for a complex rotation $P$, unique because a positive Hermitian table has one Hermitian logarithm. Written $K_0 = -\eta\,\hat u\cdot\mathbf L$, it makes $e^{iK_0}$ the boost of rapidity $\eta$ along $\hat u$; for a reading, the velocity of the field''s own rest frame.'
    chapter: '9.2'
    anchor: every-complex-rotation-is-a-boost-followed-by-a-turn
  - key: tide-eigenvalue
    title: Eigenvalues of the tide
    tex: '\curv{\lambda}_a'
    role: curv
    kind: Three real numbers; in s⁻²
    meaning: 'The eigenvalues $\lambda_1$, $\lambda_2$, $\lambda_3$ of the tide $\mathcal E$ along its principal axes, which add up to zero in empty space. In a room of masses at rest a slow pixel reads $\mathcal B_{bc} = (v_a/c)(\lambda_c - \lambda_b)$ for $(a, b, c)$ in cyclic order, so each gap between two of them reads one component of its velocity, to $c\sigma_n/(\sqrt2|\lambda_b - \lambda_c|)$. (Not a wavelength, nor chapter 9.2''s variable $\lambda$ of the characteristic polynomial.)'
    chapter: '9.3'
    anchor: in-a-room-at-rest-a-pixel-reads-its-own-velocity
  - key: kerr-parameter
    title: Kerr's spin parameter
    tex: 'a'
    role: none
    kind: A length; in m
    meaning: 'The length defined by writing a spinning body''s angular momentum as $Mca\,\hat z$: its angular momentum divided by its mass and the speed of light. For a spinning black hole the eigenvalues of $\mathcal W$ are proportional to $(r - ia\cos\vartheta)^{-3}$ (Kerr), and outside any round spinning body this holds to first order in $a$, so their phase is $3a\cos\vartheta/r$. For the Earth $a = 3.27$ m, and the phase at the surface above a pole is $1.5 \times 10^{-6}$. (Not a shell''s radius, a lattice constant or a light amplitude.)'
    chapter: '9.3'
    anchor: complex-eigenvalues-mean-that-something-in-the-room-moves-or-turns
  - key: stereographic-z
    title: Stereographic coordinate
    tex: 'z'
    role: none
    kind: A complex number; no unit
    meaning: 'The complex number that labels a direction on the sky around the pixel: $z = 0$ is $+\hat z$, $|z| = 1$ the equator, $z \to \infty$ the direction $-\hat z$, with $|z| = \tan(\vartheta/2)$ and $\arg z$ the azimuth. The opposite direction is $-1/\bar z$. In Part 9 the letter is only this number, never a depth; the axis is written $\hat z$.'
    chapter: '9.4'
    anchor: a-direction-on-the-sky-is-a-complex-number
  - key: sky-direction
    title: Direction of a point of the sky
    tex: '\hat k(z)'
    role: none
    kind: A vector of length one; no unit
    meaning: 'The direction $(2\,\mathrm{Re}\,z, 2\,\mathrm{Im}\,z, 1 - |z|^2)/(1 + |z|^2)$ of the stereographic coordinate $z$: the direction of travel of a wave whose null vector is $\mathbf m(z)$. Chapter 6.6 wrote it $\hat n(z)$; the tutorial keeps $\hat n$ for the direction toward a source.'
    chapter: '9.4'
    anchor: a-direction-on-the-sky-is-a-complex-number
  - key: sideways-velocity
    title: Sideways velocity of a body
    tex: '\obs{\mathbf v}_\perp'
    role: obs
    kind: A vector; in m/s
    meaning: 'The part of a moving body''s velocity across the line from the pixel to where the body is now. For a single round body at any speed, $\mathbf v_\perp/c$ is the half sum of its two pairs of principal null directions (the paper''s eq:star-velocity), and the line turns at $\mathbf v_\perp/r$.'
    chapter: '9.4'
    anchor: one-pixel-reads-the-whole-state-of-a-moving-body
  - key: present-line
    title: Direction to where a body is now
    tex: '\hat n'
    role: none
    kind: A vector of length one; no unit
    meaning: 'The unit vector from the pixel to the present position of a moving body, at the pixel''s own time. The half difference of the body''s two pairs of principal null directions lies along it, with the length $(1 - v_\perp^2/c^2)^{1/2}$, and its rate of turning $|\dot{\hat n}| = v_\perp/r$ gives the distance $r$.'
    chapter: '9.4'
    anchor: one-pixel-reads-the-whole-state-of-a-moving-body
  - key: line-tide
    title: Tide along the line to a body
    tex: '\curv{\mathcal E}_\parallel'
    role: curv
    kind: A number; in s⁻²
    meaning: 'The entry of the tide along the line from the pixel to a body coming straight at it, $-2GM/\gamma^3r^3$. It grows as $r^{-3}$, so $3\mathcal E_\parallel/\dot{\mathcal E}_\parallel$ is the time to contact and $\mathcal E_\parallel\ddot{\mathcal E}_\parallel/\dot{\mathcal E}_\parallel^2 = 4/3$ for a body that coasts (the paper''s eq:contact).'
    chapter: '9.4'
    anchor: one-pixel-reads-the-whole-state-of-a-moving-body
  - key: wave-amplitudes
    title: Amplitudes of several waves
    tex: '\curv\alpha_a'
    role: curv
    kind: One complex number per wave; in s⁻²
    meaning: 'The amplitude of wave $a$ in a reading of several waves, $\mathcal W = \sum_a\alpha_a\mathbf m_a\mathbf m_a^{\mathsf T}$; it absorbs the length and phase of the null vector $\mathbf m_a$. The paper writes $c_a$; the tutorial keeps $c$ for the speed of light and the weight components $c_m$.'
    chapter: '9.5'
    anchor: two-waves-give-a-reading-of-rank-two-and-the-vector-it-sends-to-zero-leads-to-both
  - key: pencil-roots
    title: Roots of the pencil of three waves
    tex: '\lambda_a'
    role: none
    kind: Three complex numbers; no unit
    meaning: 'The roots of $\det(\mathcal W_+ - \lambda\mathcal W_-)$ for three waves of one frequency, the ratios $\alpha^+_a/\alpha^-_a$ of each wave''s helicity amplitudes. At each root one wave drops out. For a circular binary seen at the inclination $\iota$, $|\lambda| = \cot^4(\iota/2)$. Not a wavelength.'
    chapter: '9.5'
    anchor: three-waves-of-one-frequency-are-three-roots-of-one-pencil
  - key: four-wave-table
    title: The table of four waves
    tex: 'A'
    role: none
    kind: A complex symmetric table, which can be taken trace-free; no unit
    meaning: 'The one table with $\mathrm{tr}(A\mathcal W) = 0$ for every reading of four waves from fixed directions (the paper''s eq:four-waves). Each wave''s null vector solves $\mathbf m^{\mathsf T}A\mathbf m = 0$ and $\mathbf m\cdot\mathbf m = 0$, so the four directions are the four principal null directions of $A$. Not chapter 8.7''s sum $A$.'
    chapter: '9.5'
    anchor: four-waves-over-time-leave-one-combination-of-the-readings-empty
  - key: snapshots
    title: Number of snapshots
    tex: 'L'
    role: none
    kind: A whole number
    meaning: 'The number of independent sets of moments in a record of waves: 1 for one reading, 2 for one frequency (the parts $\mathcal W_+$ and $\mathcal W_-$), many for a long record. Only in the paper''s eq:wave-count; not the generators $L_k$ or an arm length.'
    chapter: '9.5'
    anchor: all-three-cases-are-pronys-problem-and-counting-gives-the-limit
  - key: moments-y
    title: Moments of a reading
    tex: 'y_j'
    role: none
    kind: Five complex numbers, j = 0 to 4; in s⁻²
    meaning: 'The sums $y_j = \sum_a\alpha_az_a^j$ over the waves of a reading, with $z_a$ their stereographic coordinates. They are the five numbers of the reading up to a fixed linear map, because the quartic $\mathbf m(z)^{\mathsf T}\mathcal W\mathbf m(z)$ is $4\sum_k(-1)^k\binom4ky_{4-k}z^k$.'
    chapter: '9.5'
    anchor: all-three-cases-are-pronys-problem-and-counting-gives-the-limit
  - key: prony-polynomial
    title: Prony's polynomial
    tex: 'p(z)'
    role: none
    kind: A polynomial of degree N in the stereographic coordinate
    meaning: 'The polynomial $\prod_a(z - z_a) = \sum_kp_kz^k$, with $p_N = 1$, whose roots are the directions of the $N$ waves. Its coefficients solve the linear equations $\sum_kp_ky_{j+k} = 0$ of the paper''s eq:proof-prony.'
    chapter: '9.5'
    anchor: all-three-cases-are-pronys-problem-and-counting-gives-the-limit
  - key: wave-count
    title: The count of waves
    tex: 'N_{\max}'
    role: none
    kind: A whole number
    meaning: 'The largest number of waves a point sensor of a field of spin $s$ can separate from $L$ snapshots, $\lfloor L(2s + 1)/(L + 1)\rfloor$ (the paper''s eq:wave-count): 2, 3 and 4 for gravity at one instant, one frequency and over a long record, and 1, 2 and 2 for light.'
    chapter: '9.5'
    anchor: all-three-cases-are-pronys-problem-and-counting-gives-the-limit
  - key: steering-vector
    title: Steering vector of a source
    tex: '\mathbf q_a'
    role: none
    kind: A column of five complex numbers, of length one; no unit
    meaning: 'The five numbers, in the orthonormal basis of chapter 1.5, of the unit square $\mathbf m_a\mathbf m_a^{\mathsf T}$ of source $a$: what a unit wave from that direction puts into the reading. Five sources from different directions have independent steering vectors.'
    chapter: '9.5'
    anchor: uncorrelated-sources-separate-from-their-average-brightness-and-circular-polarization
  - key: spectral-matrix
    title: Spectral matrix of one pixel
    tex: 'C'
    role: none
    kind: A 10×10 Hermitian table; in s⁻⁴
    meaning: 'The mean products $\langle\mathbf x\mathbf x^\dagger\rangle$ of a pixel''s ten complex amplitudes $\tilde{\mathcal E}$, $\tilde{\mathcal B}$ at one frequency, over many stretches of the record: 100 real numbers. In the helicity coordinates it has the blocks $C_+$, $C_-$ (Hermitian) and $C_{+-}$ (complex symmetric for a sky of independent waves), and chapter 9.5''s $C_I$, $C_V$ are $C_+ \pm C_-$. The paper writes $C$ for one helicity block. (Not 9.3''s moment of inertia or 9.7''s $C(\iota, \theta)$.)'
    chapter: '9.6'
    anchor: the-pixels-spectral-matrix-splits-into-three-blocks-by-helicity
  - key: sky-stokes
    title: The sky's brightness and polarization
    tex: 'I(\hat n),\ V(\hat n),\ (Q - iU)(\hat n)'
    role: none
    kind: Functions on the sky; in s⁻⁴ sr⁻¹
    meaning: 'The sums over the sources in a small patch of directions, divided by its solid angle, of $|\alpha^+|^2 + |\alpha^-|^2$ (the brightness), $|\alpha^+|^2 - |\alpha^-|^2$ (the circular polarization) and $2\alpha^+\alpha^-$ (the linear polarization). For one wave they are chapter 5.4''s Stokes parameters times $\omega^4/2$. A pixel reads 25 numbers of $I$, 25 of $V$ and 18 of $Q - iU$. (Not 9.2''s invariant $I$.)'
    chapter: '9.6'
    anchor: the-pixels-spectral-matrix-splits-into-three-blocks-by-helicity
  - key: pixel-picture
    title: The single pixel's picture of a point
    tex: 'K(\vartheta)'
    role: none
    kind: A function of the angle from the source; a pure number, 1 at the source
    meaning: 'The projection of a point source onto the spherical harmonics of degree four and below, divided by its value at the source: $K = \sum_{\ell=0}^{4}(2\ell+1)P_\ell(\cos\vartheta)/25$. It is 51.6° wide at half height, crosses zero at 43.9°, dips to $-0.152$ at 59.5° and is 0.2 directly behind the source.'
    chapter: '9.6'
    anchor: a-single-pixels-picture-of-the-sky-is-blurred-over-52
  - key: reduced-distance
    title: Distance in reduced wavelengths
    tex: 'kr'
    role: none
    kind: A pure number
    meaning: 'The distance $r$ to a source of waves times $k = \omega/c$: the distance in reduced wavelengths $c/\omega$, which are 477 km at 100 Hz. By peeling, a source''s near-field terms of spin weight 1 and 0 are smaller than its wave by about $1/kr$ and $1/(kr)^2$.'
    chapter: '9.7'
    anchor: a-nearby-source-spoils-the-square-only-at-second-order
  - key: rank-constant
    title: The coefficient of the departure from rank one
    tex: 'C(\iota, \theta)'
    role: none
    kind: A pure number
    meaning: 'The coefficient in the paper''s eq:ranging-instant, $s_2/s_1 = C/(kr)^2$, for two masses turning in a circle seen at the inclination $\iota$ and the wave phase $\theta$ (the paper''s eq:ranging-C). It is 2 edge-on and, at $\theta = 0$, vanishes at $\cos^2\iota = 1/3$. (Not 9.3''s moment of inertia or 9.6''s spectral matrix.)'
    chapter: '9.7'
    anchor: a-nearby-source-spoils-the-square-only-at-second-order
  - key: wave-phase
    title: Phase of a turning pair's wave
    tex: '\theta'
    role: none
    kind: An angle, in radians
    meaning: 'The phase of the wave of two masses turning in a circle, zero when its plus tide is largest, in the paper''s eq:ranging-C. (Not a polar angle, which is $\vartheta$.)'
    chapter: '9.7'
    anchor: a-nearby-source-spoils-the-square-only-at-second-order
  - key: helicity-split
    title: The split between the two helicities' directions
    tex: '\Delta\theta_\pm'
    role: none
    kind: An angle, in radians
    meaning: 'The angle between the directions read from the two frequency parts $\mathcal W_\pm$ of a turning pair''s reading, $8|\cot\iota|/kr$ (the paper''s eq:helicity-split), not a change of the phase $\theta$: 0.069 rad at $kr = 200$ and $\iota = 30°$. Because it falls only as $1/kr$, it ranges the source out to $kr$ of order $\rho$.'
    chapter: '9.7'
    anchor: the-two-frequency-parts-tilt-apart-and-the-angle-between-them-ranges-the-source
  - key: phase-speed
    title: Phase speed of a metric wave
    tex: 'v_p'
    role: none
    kind: A speed, in m s⁻¹
    meaning: 'The speed $\omega/|\mathbf k|$ at which a wave''s crests move. In Einstein''s theory it is $c$; in any metric theory the second Bianchi identity gives $\mathcal B_{ij} = (c/v_p)\epsilon_{ipq}\hat k_p\mathcal E_{qj}$ (the paper''s eq:bianchi-wave).'
    chapter: '9.7'
    anchor: the-second-bianchi-identity-ties-a-metric-waves-magnetic-part-to-its-tide
  - key: wave-vector-p
    title: The wave vector read at one point
    tex: '\mathbf p'
    role: none
    kind: A vector with no unit
    meaning: 'The vector $(c/v_p)\hat k$, which one reading gives through the paper''s eq:wave-vector, $(|\mathcal E|^2 - \mathcal E^2)\mathbf p = \sum_j\mathbf t_j\times\mathbf b_j$ (with $\mathbf t_j$, $\mathbf b_j$ the columns of $\mathcal E$, $\mathcal B$; the paper writes $\mathbf e_j$ for $\mathbf t_j$), whenever the tide has rank two or more. Its direction is the wave''s direction of travel and its length the refractive index $n = c/v_p$.'
    chapter: '9.7'
    anchor: summing-cross-products-of-the-columns-gives-the-waves-direction-and-speed
  - key: reading-snr
    title: Signal-to-noise ratio of one reading
    tex: '\rho'
    role: none
    kind: A pure number
    meaning: 'Section VIII''s $|\mathcal W|/\sigma_n$ for the whole reading, with $\sigma_n$ the noise on each of the ten numbers in an orthonormal basis. Its parts are $\rho_\pm$ for the two frequency parts of a cycle ($\rho_+^2 + \rho_-^2 = \rho^2$) and $\rho_E = |\mathcal E|/\sigma_n$ for the tide alone, $\rho/\sqrt2$ for a wave. One pixel places one wave to $1/\rho$ radian in each direction, a sensor of light to $\sqrt2/\rho$. (Not a density, which is also $\rho$.)'
    chapter: '9.7'
    anchor: one-waves-direction-is-known-to-1ρ-a-factor-2-better-than-lights
